paths:
  /clusters:
    get:
      operationId: clusters.list
      tags: [clusters]
      summary: List clusters and their linked hosts
      description: |
        Only a global `hosts.view` sees clusters; everyone else gets an empty
        list. A host is linked when a manager's node list contains the node
        ID the host reports; the role is the manager's view.
      responses:
        "200":
          description: Clusters by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Cluster"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: clusters.create
      tags: [clusters]
      summary: Create the cluster of the Swarm a host manages
      description: |
        Needs the global-only `clusters.create`. The host must be a manager
        of an active Swarm, checked live against its own node list; the
        cluster id is the Swarm's cluster ID. Hosts the node list confirms
        are linked right away and kept current afterwards. Audited as
        `cluster.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_id]
              properties:
                host_id: {type: string, description: "`local` or an agent host id."}
                name:
                  type: string
                  description: 1 to 64 letters, digits, spaces, `.`, `-` or `_`; defaults to `swarm-` plus the first 8 characters of the cluster ID.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cluster"}
        "400":
          description: Invalid name, or the host is not a manager of an active Swarm.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A cluster for this Swarm or with this name exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The host's Swarm state could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The host is offline, has no Docker, or its agent is too old to list Swarm nodes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/candidates:
    get:
      operationId: clusters.candidates
      tags: [clusters]
      summary: Swarms with a manager host that are not a cluster yet
      description: Needs the global-only `clusters.create`. From each host's last reported Swarm state.
      responses:
        "200":
          description: One entry per Swarm.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [cluster_id, managers]
                  properties:
                    cluster_id: {type: string}
                    managers:
                      type: array
                      items:
                        type: object
                        required: [host_id, host_name, node_id]
                        properties:
                          host_id: {type: string}
                          host_name: {type: string}
                          node_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  schemas:
    Cluster:
      type: object
      required: [id, name, origin_host, created_at, members]
      properties:
        id: {type: string, description: The Swarm's cluster ID.}
        name: {type: string}
        origin_host: {type: string, description: The manager host the cluster was created from.}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        members:
          type: array
          items:
            type: object
            required: [host_id, node_id, role, linked_at]
            properties:
              host_id: {type: string}
              node_id: {type: string}
              role: {type: string, enum: [manager, worker]}
              linked_at: {type: string, format: date-time}
