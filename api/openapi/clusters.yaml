paths:
  /clusters:
    get:
      operationId: clusters.list
      tags: [clusters]
      summary: List clusters and their linked hosts
      description: |
        Lists the clusters the caller holds `hosts.view` on, globally or on a
        `cluster` scope; a host scope on a node shows nothing. A host is
        linked when the origin manager's node list contains the node ID the
        host reports; the role is the manager's view. `status` is the
        state from the origin manager's last check.
      responses:
        "200":
          description: Clusters by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Cluster"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: clusters.create
      tags: [clusters]
      summary: Create the cluster of the Swarm a host manages
      description: |
        Needs the global-only `clusters.create`. The host must be a manager
        of an active Swarm, checked live against its own node list, and
        every other host claiming to manage the Swarm that answers must
        list it as a manager. The cluster id is the Swarm's cluster ID; the
        host becomes the origin, whose node list alone links and unlinks
        hosts (every minute; changes audited as `cluster.member_link` /
        `cluster.member_unlink`). Audited as `cluster.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_id]
              properties:
                host_id: {type: string, description: "`local` or an agent host id."}
                name:
                  type: string
                  description: 1 to 64 letters, digits, spaces, `.`, `-` or `_`; defaults to `swarm-` plus the first 8 characters of the cluster ID.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cluster"}
        "400":
          description: Invalid name, or the host is not a manager of an active Swarm.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A cluster for this Swarm or with this name exists, or another manager host does not list this host as a manager.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The host's Swarm state could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The host is offline, has no Docker, or its agent is too old to list Swarm nodes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}:
    delete:
      operationId: clusters.delete
      tags: [clusters]
      summary: Delete a cluster, its memberships and the access on its scope
      description: |
        Needs the global-only `clusters.create`. In one transaction with the
        cluster, deletes the role assignments and IdP group mappings on its
        `cluster` scope, revokes API tokens restricted to it (never widens
        them), and drops the cluster from unused invites; an invite left
        with no scope expires. `GET /clusters/{id}/access` lists all of it
        beforehand. The caller must be able to grant every assignment and
        group mapping role on the cluster scope, and needs
        `tokens.manage_others` when another user's token would be revoked.
        Nothing changes on the Swarm. Audited as `cluster.delete` with the
        counts per kind and the revoked token ids.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: |
            Missing `clusters.create`, or (code `cluster_access_above_own`)
            the cluster holds access above the caller's own; the message
            names the assignment, mapping or token that blocks the delete.
            Nothing was deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500":
          description: Deleting failed and nothing changed, or (code `cluster_deleted_cache_stale`) everything was deleted but the permission cache could not be reloaded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/trust-root/confirm:
    post:
      operationId: clusters.confirmTrustRoot
      tags: [clusters]
      summary: Accept the changed root CA of a single-manager Swarm
      description: |
        Needs the global-only `clusters.create`. Only for a cluster whose
        trust root is pending and whose Swarm has a single manager, so no
        second manager can agree to the change. The pending root replaces
        the pinned one and every member proves its identity again. Audited
        as `cluster.trust_root` with `change: confirmed`. The body names the
        fingerprint the admin compared (`trust.pending_fingerprint`), so a
        root that changed meanwhile is refused.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint: {type: string, description: The pending root's fingerprint as shown in `trust.pending_fingerprint`; case-insensitive.}
      responses:
        "200":
          description: Accepted; the cluster as it is now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cluster"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: |
            The pending root is not the one named (code `cluster_root_changed`),
            nothing to confirm (code `cluster_no_pending_root`), or the Swarm
            has several managers and accepts the new root only when two
            verified managers report it (code `cluster_root_needs_managers`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/access:
    get:
      operationId: clusters.access
      tags: [clusters]
      summary: What deleting a cluster removes
      description: |
        Needs the global-only `clusters.create`. Lists the role assignments,
        unused invites, IdP group mappings (OIDC, SAML, LDAP, OAuth2) and
        active API tokens on the cluster's scope. `counts` always covers
        everything; the lists name users, invites and mappings only for
        callers with `users.view` on everything, and other users' tokens
        only with `tokens.manage_others`. `complete` is false when names
        were left out.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Access on the cluster scope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterAccess"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /clusters/{id}/nodes:
    get:
      operationId: clusters.nodes
      tags: [clusters]
      summary: Nodes of the cluster's Swarm
      description: |
        Needs `hosts.view` on the cluster (global or `cluster` scope; a host
        scope on a node is not enough). Every node of the Swarm, including
        nodes without a Dockmesh agent, as the cluster's origin manager
        lists them.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterNodes"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/distribution:
    get:
      operationId: clusters.distribution
      tags: [clusters]
      summary: How the cluster's running tasks spread over its nodes
      description: |
        Needs `hosts.view` on the cluster (global or `cluster` scope; a host
        scope on a node is not enough). Per node the running tasks, whether
        the node counts for the fair share (ready and active) and whether it
        is heavy: it runs at least 1.5 times and at least 3 tasks more than
        the fair share of the counted nodes. Nodes with an agent carry the
        host's CPU and memory when the caller also holds `hosts.view` on that
        host (a cluster role covers the Swarm, not its node hosts); the others
        say why they have none.

        With `stacks.view` on the cluster the answer also lists every
        service with its running tasks per node and the CPU (cores) and
        memory its task containers use on nodes with an agent; `partial`
        marks services with tasks on nodes that were not measured. A heavy
        node names the services a placement constraint
        (`node.hostname==` or `node.id==`) pins to it.

        When no manager can be read, the answer is the node list of the
        last successful check with `stale` and `known_at`, and no tasks.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: usage
          in: query
          description: '`false` leaves out CPU, memory and the services (no request to the node hosts).'
          schema: {type: string, enum: ["true", "false"]}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterDistribution"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: No manager can be read and no earlier node list is known (for example right after a server start).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/services:
    get:
      operationId: clusters.services
      tags: [clusters]
      summary: Services of the cluster's Swarm
      description: |
        Needs `stacks.view` on the cluster. At most 1000 services by name
        with running and desired task counts; `truncated` is set when the
        manager had more.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterServices"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/services/{service}:
    get:
      operationId: clusters.service
      tags: [clusters]
      summary: Inspect one Swarm service
      description: |
        Needs `stacks.view` on the cluster. Environment variables come as
        names only and secrets and configs as references (id, name, target
        file); their values and data, command and arguments and driver
        options are never returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: service
          in: path
          required: true
          description: Service ID or name.
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterService"}
        "400":
          description: Invalid service id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/tasks:
    get:
      operationId: clusters.tasks
      tags: [clusters]
      summary: Tasks of the cluster's Swarm
      description: |
        Needs `stacks.view` on the cluster. At most 5000 tasks, newest
        first; `truncated` is set when the manager had more.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: service
          in: query
          required: false
          description: Only the tasks of this service (ID or name).
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterTasks"}
        "400":
          description: Invalid service id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/networks:
    get:
      operationId: clusters.networks
      tags: [clusters]
      summary: Networks with Swarm scope
      description: |
        Needs `networks.view` on the cluster. Overlay and ingress networks
        (at most 500, by name); `truncated` is set when the manager had
        more. With `stacks.view` on the cluster each network also lists
        the services attached to it.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterNetworks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/volumes:
    get:
      operationId: clusters.volumes
      tags: [clusters]
      summary: Volumes of Swarm stacks and the nodes they exist on
      description: |
        Needs `volumes.view` and `hosts.view` on the cluster. Lists every volume with a
        `com.docker.stack.namespace` label on the cluster's member hosts
        (nodes with an agent), grouped per stack and volume, with the hosts
        that hold a copy. Volumes of a compose project are left out even
        when they carry the label. Nodes without an agent are not read.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Volumes per stack.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterVolumes"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503":
          description: Clusters are not available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /ws/clusters/{id}/services/{service}/logs:
    get:
      operationId: ws.clusters.service_logs
      tags: [clusters]
      summary: WebSocket stream of a Swarm service's task logs
      description: |
        Streams the logs of every task of the service, read through the
        cluster's manager. Pass `?ticket=<jwt>` from
        `POST /ws/ticket?for=containers.logs`; the caller needs
        `containers.logs` on the cluster. Each text frame is one
        `SwarmLogLine` JSON object. When the stream fails after the
        upgrade, a last frame `{"error": "..."}` comes before the close.
        Of the log metadata only the task and node ids are passed on;
        attributes a log driver adds from labels or env are dropped. At
        most 32 service log streams are open at once, 4 per user or API
        token; the server pings every 30 s and drops a peer that stops
        answering.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: service
          in: path
          required: true
          description: Service ID or name.
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
        - name: ticket
          in: query
          required: true
          schema: {type: string}
        - name: tail
          in: query
          description: Existing lines per task to send first.
          schema: {type: integer, minimum: 0, maximum: 5000, default: 100}
        - name: since
          in: query
          description: Only lines from this point on; a duration back from now (`15m`, at most 90 days), an RFC 3339 time or unix seconds.
          schema: {type: string}
        - name: follow
          in: query
          description: Keep the stream open for new lines; `0` or `false` ends it after the existing lines.
          schema: {type: boolean, default: true}
      responses:
        "101":
          description: Upgraded to WebSocket; frames are `SwarmLogLine` objects.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SwarmLogLine"}
        "400":
          description: Invalid service id, tail or since.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: Missing or invalid ticket.
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429":
          description: Too many service log streams are open, in total or for this caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames or the service log stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/candidates:
    get:
      operationId: clusters.candidates
      tags: [clusters]
      summary: Swarms with a manager host that are not a cluster yet
      description: Needs the global-only `clusters.create`. From each host's last reported Swarm state.
      responses:
        "200":
          description: One entry per Swarm.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [cluster_id, managers]
                  properties:
                    cluster_id: {type: string}
                    managers:
                      type: array
                      items:
                        type: object
                        required: [host_id, host_name, node_id]
                        properties:
                          host_id: {type: string}
                          host_name: {type: string}
                          node_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /clusters/memberships:
    get:
      operationId: clusters.memberships
      tags: [clusters]
      summary: Cluster memberships of the hosts the caller can see
      description: |
        One entry per linked host the caller holds `hosts.view` on, by host
        scope, host tag or globally; a cluster scope alone shows none. Names
        the cluster even when the caller can't open it, so a host page can
        say which cluster the host belongs to. `node` is the host's entry in
        the node list of the origin manager's last check; it is missing
        when that check returned no list (cluster unreachable or without
        quorum) and before the first check after a server start.
      responses:
        "200":
          description: Memberships.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ClusterMembership"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  schemas:
    ClusterNodes:
      type: object
      required: [read_host, nodes]
      properties:
        read_host: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [id, role]
            properties:
              id: {type: string}
              hostname: {type: string}
              role: {type: string, enum: [manager, worker]}
              state: {type: string}
              availability: {type: string}
              leader: {type: boolean}
              reachability: {type: string}
              addr: {type: string, description: The node's address as the manager sees it.}
              engine_version: {type: string}
              nano_cpus: {type: integer, format: int64}
              memory_bytes: {type: integer, format: int64}
              tls_issuer: {type: string, description: SHA-256 (hex) of the public key that issued the node's certificate; changes with a CA rotation.}
    ClusterDistribution:
      type: object
      required: [nodes, tasks, counted_nodes, fair_share]
      properties:
        read_host: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [id, role, tasks, counted]
            properties:
              id: {type: string}
              hostname: {type: string}
              role: {type: string, enum: [manager, worker]}
              state: {type: string}
              availability: {type: string}
              leader: {type: boolean}
              reachability: {type: string}
              addr: {type: string}
              engine_version: {type: string}
              nano_cpus: {type: integer, format: int64}
              memory_bytes: {type: integer, format: int64}
              host_id: {type: string, description: The Dockmesh host linked to the node; absent for nodes without an agent.}
              tasks: {type: integer, description: Running tasks on the node.}
              cpu_percent: {type: number}
              mem_percent: {type: number}
              no_metrics:
                type: string
                enum: [no_agent, unreachable, agent_offline, no_access]
                description: 'Why the node has no CPU and memory; `no_access` when the caller holds no hosts.view on the node''s host.'
              counted: {type: boolean, description: The node is ready and active and counts for the fair share.}
              heavy: {type: boolean}
              pinned:
                type: array
                description: Services pinned to a heavy node by a placement constraint, with their running tasks there.
                items:
                  type: object
                  required: [service, tasks]
                  properties:
                    service: {type: string}
                    tasks: {type: integer}
        tasks: {type: integer, description: Running tasks on ready nodes.}
        counted_nodes: {type: integer}
        fair_share: {type: number, description: Running tasks per counted node.}
        services:
          type: array
          description: Only with `stacks.view` on the cluster.
          items:
            type: object
            required: [id, name, per_node, running]
            properties:
              id: {type: string}
              name: {type: string}
              stack: {type: string}
              per_node:
                type: object
                description: Running tasks by node id.
                additionalProperties: {type: integer}
              running: {type: integer}
              cpu_cores: {type: number, description: CPU of the service's task containers on measured nodes, in cores.}
              mem_bytes: {type: integer, format: int64}
              partial: {type: boolean}
        truncated: {type: boolean, description: The manager had more tasks than one answer carries.}
        stale: {type: boolean}
        known_at: {type: string, format: date-time}
    ClusterServices:
      type: object
      required: [read_host, services]
      properties:
        read_host: {type: string}
        services:
          type: array
          items: {$ref: "#/components/schemas/SwarmService"}
        truncated: {type: boolean}
    SwarmRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        target: {type: string, description: File name inside the task.}
    SwarmUpdatePolicy:
      type: object
      required: [parallelism]
      properties:
        parallelism: {type: integer, format: int64}
        delay_ns: {type: integer, format: int64}
        failure_action: {type: string}
        order: {type: string}
    ClusterService:
      allOf:
        - {$ref: "#/components/schemas/SwarmService"}
        - type: object
          required: [read_host]
          properties:
            read_host: {type: string}
            labels:
              type: object
              additionalProperties: {type: string}
            env_keys:
              type: array
              description: Names of the environment variables; values are never returned.
              items: {type: string}
            secrets:
              type: array
              items: {$ref: "#/components/schemas/SwarmRef"}
            configs:
              type: array
              items: {$ref: "#/components/schemas/SwarmRef"}
            networks:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: {type: string}
                  aliases:
                    type: array
                    items: {type: string}
            mounts:
              type: array
              items:
                type: object
                required: [type, target]
                properties:
                  type: {type: string}
                  source: {type: string}
                  target: {type: string}
                  read_only: {type: boolean}
            max_replicas_per_node: {type: integer, format: int64}
            limit_nano_cpus: {type: integer, format: int64}
            limit_memory_bytes: {type: integer, format: int64}
            update_config: {$ref: "#/components/schemas/SwarmUpdatePolicy"}
            rollback_config: {$ref: "#/components/schemas/SwarmUpdatePolicy"}
            update_message: {type: string}
    ClusterTasks:
      type: object
      required: [read_host, tasks]
      properties:
        read_host: {type: string}
        tasks:
          type: array
          items:
            type: object
            required: [id, service_id, desired_state, state, updated_at]
            properties:
              id: {type: string}
              service_id: {type: string}
              node_id: {type: string}
              slot: {type: integer}
              desired_state: {type: string}
              state: {type: string}
              message: {type: string}
              error: {type: string}
              container_id: {type: string}
              image: {type: string}
              updated_at: {type: string, format: date-time}
        truncated: {type: boolean}
    SwarmLogLine:
      type: object
      required: [task, task_id, node_id, stream, msg]
      properties:
        ts: {type: string, format: date-time}
        task: {type: string, description: "`<service>.<slot>`, or `<service>.<node id>` for global services."}
        task_id: {type: string}
        node: {type: string, description: Host name of the node the task runs on.}
        node_id: {type: string}
        stream: {type: string, enum: [stdout, stderr]}
        msg: {type: string, description: The message, cut to 16 KiB.}
        truncated: {type: boolean, description: The message was longer and has been cut.}
    ClusterNetworks:
      type: object
      required: [read_host, networks]
      properties:
        read_host: {type: string}
        networks:
          type: array
          items:
            type: object
            required: [id, name, driver, created_at]
            properties:
              id: {type: string}
              name: {type: string}
              driver: {type: string}
              attachable: {type: boolean}
              ingress: {type: boolean}
              internal: {type: boolean}
              encrypted: {type: boolean}
              subnets:
                type: array
                items: {type: string}
              stack: {type: string}
              created_at: {type: string, format: date-time}
              services:
                type: array
                description: Services attached to the network; only for callers with `stacks.view` on the cluster.
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    stack: {type: string}
        truncated: {type: boolean}
    ClusterVolumes:
      type: object
      required: [volumes, read_hosts, unreachable_hosts]
      properties:
        volumes:
          type: array
          items:
            type: object
            required: [stack, name, nodes]
            properties:
              stack: {type: string, description: The `com.docker.stack.namespace` label.}
              name: {type: string}
              nodes:
                type: array
                description: Member hosts that hold a copy of the volume.
                items:
                  type: object
                  required: [host_id, host_name, driver]
                  properties:
                    host_id: {type: string}
                    host_name: {type: string}
                    driver: {type: string}
        read_hosts:
          type: array
          description: Member hosts that answered. Nodes without an agent are never read.
          items: {type: string}
        unreachable_hosts:
          type: array
          items:
            type: object
            properties:
              host_id: {type: string}
              host_name: {type: string}
              reason: {type: string}
    Cluster:
      type: object
      required: [id, name, origin_host, created_at, members]
      properties:
        id: {type: string, description: The Swarm's cluster ID.}
        name: {type: string}
        origin_host: {type: string, description: The manager host the cluster was created from.}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        members:
          type: array
          items:
            type: object
            required: [host_id, node_id, role, linked_at, verified, proof]
            properties:
              host_id: {type: string}
              node_id: {type: string}
              role: {type: string, enum: [manager, worker]}
              linked_at: {type: string, format: date-time}
              verified:
                type: boolean
                description: |
                  The host proved that its daemon holds the node's Swarm key:
                  its agent signed a fresh challenge with the node key, and the
                  node certificate chains to the cluster's pinned root CA and
                  names this node, Swarm and role. The server's own host counts
                  as verified without a proof.
              verified_at: {type: string, format: date-time}
              cert_not_after: {type: string, format: date-time, description: Expiry of the certificate the host proved with.}
              proof:
                type: string
                enum: [verified, local, pending, agent_too_old, no_trust_root, key_locked, invalid, failed]
                description: |
                  Why the member is or is not verified. `pending`: not asked
                  yet; `agent_too_old`: the agent can't prove; `no_trust_root`:
                  no root CA pinned yet; `key_locked`: the Swarm uses autolock,
                  so the key on disk can't sign; `invalid`: the proof was
                  refused; `failed`: the agent could not make one.
              addr_warning:
                type: string
                description: |
                  Set when the agent connects from another address than the
                  Swarm lists for the node, as `<agent address>|<node
                  address>`. Only a hint: NAT and proxies cause it too.
        status: {$ref: "#/components/schemas/ClusterStatus"}
        trust:
          type: object
          required: [pinned, origin_verified]
          description: |
            The root CA node proofs are checked against. It is pinned from the
            origin when the cluster is created (or, for clusters created
            before, at the first check) and must match what the other manager
            hosts report. A different root (after `docker swarm ca --rotate`)
            stays `pending` until two verified managers report it; in a Swarm
            with a single manager an admin confirms it (`confirmable`).
          properties:
            pinned: {type: boolean}
            pinned_fingerprint: {type: string, description: "SHA-256 over the pinned root certificate, colon-separated upper-case hex (openssl x509 -fingerprint -sha256)."}
            pending_fingerprint: {type: string, description: SHA-256 of the reported root that waits to be accepted.}
            pending: {type: boolean}
            pending_since: {type: string, format: date-time}
            confirmable: {type: boolean}
            origin_verified: {type: boolean, description: The origin proved its node identity. Reads keep going through an unverified origin.}
    ClusterStatus:
      type: object
      description: |
        The cluster as its origin manager showed it at the last check (every
        minute). `healthy`: every node ready and every manager reachable;
        `degraded`: a node is not ready or a manager is unreachable, quorum
        held; `no_quorum`: the origin is online but its Swarm has no leader;
        `unreachable`: the origin's agent is offline, can't list nodes or is
        no longer the linked manager node; `unknown`: not checked since the
        server started. The counts come from the last node list the origin
        returned (`known_at`), so they keep the last known shape while the
        cluster is unreachable or without quorum.
      required: [state, managers, managers_reachable, workers, nodes_down, nodes_without_agent]
      properties:
        state: {type: string, enum: [healthy, degraded, no_quorum, unreachable, unknown]}
        managers: {type: integer}
        managers_reachable: {type: integer}
        workers: {type: integer}
        nodes_down: {type: integer, description: Nodes whose state is not `ready`.}
        nodes_without_agent: {type: integer, description: Nodes no Dockmesh host is linked to.}
        leader: {type: string, description: Host name of the leader node.}
        checked_at: {type: string, format: date-time}
        known_at: {type: string, format: date-time, description: When the origin last returned its node list.}
    ClusterMembership:
      type: object
      required: [host_id, cluster_id, cluster_name, node_id, role]
      properties:
        host_id: {type: string}
        cluster_id: {type: string}
        cluster_name: {type: string}
        node_id: {type: string}
        role: {type: string, enum: [manager, worker]}
        node:
          type: object
          properties:
            state: {type: string, description: "Node state, e.g. `ready` or `down`."}
            availability: {type: string, enum: [active, pause, drain]}
            reachability: {type: string, description: "Manager reachability, e.g. `reachable` or `unreachable`; empty on workers."}
            leader: {type: boolean}
    ClusterAccess:
      type: object
      required: [assignments, invites, mappings, tokens, counts, complete]
      properties:
        counts:
          type: object
          required: [assignments, invites, mappings, tokens]
          properties:
            assignments: {type: integer}
            invites: {type: integer}
            mappings: {type: integer}
            tokens: {type: integer}
        complete: {type: boolean}
        assignments:
          type: array
          items:
            type: object
            required: [id, username, role]
            properties:
              id: {type: integer, format: int64}
              username: {type: string}
              role: {type: string}
              via: {type: string, description: IdP group of an assignment made by a group mapping.}
        invites:
          type: array
          items:
            type: object
            required: [id, role, expired]
            properties:
              id: {type: integer, format: int64}
              email_hint: {type: string}
              role: {type: string}
              expired: {type: boolean, description: The invite has no other scope and expires with the delete.}
        mappings:
          type: array
          items:
            type: object
            required: [kind, provider, group, role]
            properties:
              kind: {type: string, enum: [oidc, saml, ldap, oauth2]}
              provider: {type: string}
              group: {type: string}
              role: {type: string}
        tokens:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
              owner: {type: string}
