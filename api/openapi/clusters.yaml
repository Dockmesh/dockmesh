paths:
  /clusters:
    get:
      operationId: clusters.list
      tags: [clusters]
      summary: List clusters and their linked hosts
      description: |
        Lists the clusters the caller holds `hosts.view` on, globally or on a
        `cluster` scope; a host scope on a node shows nothing. A host is
        linked when the origin manager's node list contains the node ID the
        host reports; the role is the manager's view.
      responses:
        "200":
          description: Clusters by name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Cluster"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: clusters.create
      tags: [clusters]
      summary: Create the cluster of the Swarm a host manages
      description: |
        Needs the global-only `clusters.create`. The host must be a manager
        of an active Swarm, checked live against its own node list, and
        every other host claiming to manage the Swarm that answers must
        list it as a manager. The cluster id is the Swarm's cluster ID; the
        host becomes the origin, whose node list alone links and unlinks
        hosts (every minute; changes audited as `cluster.member_link` /
        `cluster.member_unlink`). Audited as `cluster.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_id]
              properties:
                host_id: {type: string, description: "`local` or an agent host id."}
                name:
                  type: string
                  description: 1 to 64 letters, digits, spaces, `.`, `-` or `_`; defaults to `swarm-` plus the first 8 characters of the cluster ID.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cluster"}
        "400":
          description: Invalid name, or the host is not a manager of an active Swarm.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A cluster for this Swarm or with this name exists, or another manager host does not list this host as a manager.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The host's Swarm state could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The host is offline, has no Docker, or its agent is too old to list Swarm nodes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}:
    delete:
      operationId: clusters.delete
      tags: [clusters]
      summary: Delete a cluster, its memberships and the access on its scope
      description: |
        Needs the global-only `clusters.create`. In one transaction with the
        cluster, deletes the role assignments and IdP group mappings on its
        `cluster` scope, revokes API tokens restricted to it (never widens
        them), and drops the cluster from unused invites; an invite left
        with no scope expires. `GET /clusters/{id}/access` lists all of it
        beforehand. The caller must be able to grant every assignment and
        group mapping role on the cluster scope, and needs
        `tokens.manage_others` when another user's token would be revoked.
        Nothing changes on the Swarm. Audited as `cluster.delete` with the
        counts per kind and the revoked token ids.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: |
            Missing `clusters.create`, or (code `cluster_access_above_own`)
            the cluster holds access above the caller's own; the message
            names the assignment, mapping or token that blocks the delete.
            Nothing was deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500":
          description: Deleting failed and nothing changed, or (code `cluster_deleted_cache_stale`) everything was deleted but the permission cache could not be reloaded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/access:
    get:
      operationId: clusters.access
      tags: [clusters]
      summary: What deleting a cluster removes
      description: |
        Needs the global-only `clusters.create`. Lists the role assignments,
        unused invites, IdP group mappings (OIDC, SAML, LDAP, OAuth2) and
        active API tokens on the cluster's scope. `counts` always covers
        everything; the lists name users, invites and mappings only for
        callers with `users.view` on everything, and other users' tokens
        only with `tokens.manage_others`. `complete` is false when names
        were left out.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Access on the cluster scope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterAccess"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /clusters/{id}/nodes:
    get:
      operationId: clusters.nodes
      tags: [clusters]
      summary: Nodes of the cluster's Swarm
      description: |
        Needs `hosts.view` on the cluster (global or `cluster` scope; a host
        scope on a node is not enough). Every node of the Swarm, including
        nodes without a Dockmesh agent, as the cluster's origin manager
        lists them.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterNodes"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/services:
    get:
      operationId: clusters.services
      tags: [clusters]
      summary: Services of the cluster's Swarm
      description: |
        Needs `stacks.view` on the cluster. At most 1000 services by name
        with running and desired task counts; `truncated` is set when the
        manager had more.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterServices"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/services/{service}:
    get:
      operationId: clusters.service
      tags: [clusters]
      summary: Inspect one Swarm service
      description: |
        Needs `stacks.view` on the cluster. Environment variables come as
        names only and secrets and configs as references (id, name, target
        file); their values and data, command and arguments and driver
        options are never returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: service
          in: path
          required: true
          description: Service ID or name.
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterService"}
        "400":
          description: Invalid service id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/tasks:
    get:
      operationId: clusters.tasks
      tags: [clusters]
      summary: Tasks of the cluster's Swarm
      description: |
        Needs `stacks.view` on the cluster. At most 5000 tasks, newest
        first; `truncated` is set when the manager had more.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: service
          in: query
          required: false
          description: Only the tasks of this service (ID or name).
          schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterTasks"}
        "400":
          description: Invalid service id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/{id}/networks:
    get:
      operationId: clusters.networks
      tags: [clusters]
      summary: Networks with Swarm scope
      description: |
        Needs `networks.view` on the cluster. Overlay and ingress networks
        (at most 500, by name); `truncated` is set when the manager had
        more.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Read through the cluster's manager; `read_host` names it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterNetworks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The cluster's manager is offline, no longer the linked manager node, not a manager anymore, or its agent is too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /clusters/candidates:
    get:
      operationId: clusters.candidates
      tags: [clusters]
      summary: Swarms with a manager host that are not a cluster yet
      description: Needs the global-only `clusters.create`. From each host's last reported Swarm state.
      responses:
        "200":
          description: One entry per Swarm.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [cluster_id, managers]
                  properties:
                    cluster_id: {type: string}
                    managers:
                      type: array
                      items:
                        type: object
                        required: [host_id, host_name, node_id]
                        properties:
                          host_id: {type: string}
                          host_name: {type: string}
                          node_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  schemas:
    ClusterNodes:
      type: object
      required: [read_host, nodes]
      properties:
        read_host: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [id, role]
            properties:
              id: {type: string}
              hostname: {type: string}
              role: {type: string, enum: [manager, worker]}
              state: {type: string}
              availability: {type: string}
              leader: {type: boolean}
              reachability: {type: string}
              addr: {type: string, description: The node's address as the manager sees it.}
              engine_version: {type: string}
              nano_cpus: {type: integer, format: int64}
              memory_bytes: {type: integer, format: int64}
    SwarmService:
      type: object
      required: [id, name, mode, running_tasks, desired_tasks, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        image: {type: string}
        mode: {type: string, enum: [replicated, global, replicated-job, global-job, ""]}
        replicas: {type: integer, format: int64}
        running_tasks: {type: integer, format: int64}
        desired_tasks: {type: integer, format: int64}
        stack: {type: string, description: The `com.docker.stack.namespace` label.}
        ports:
          type: array
          items:
            type: object
            required: [target_port]
            properties:
              protocol: {type: string}
              target_port: {type: integer}
              published_port: {type: integer}
              publish_mode: {type: string}
        update_state: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ClusterServices:
      type: object
      required: [read_host, services]
      properties:
        read_host: {type: string}
        services:
          type: array
          items: {$ref: "#/components/schemas/SwarmService"}
        truncated: {type: boolean}
    SwarmRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        target: {type: string, description: File name inside the task.}
    SwarmUpdatePolicy:
      type: object
      required: [parallelism]
      properties:
        parallelism: {type: integer, format: int64}
        delay_ns: {type: integer, format: int64}
        failure_action: {type: string}
        order: {type: string}
    ClusterService:
      allOf:
        - {$ref: "#/components/schemas/SwarmService"}
        - type: object
          required: [read_host]
          properties:
            read_host: {type: string}
            labels:
              type: object
              additionalProperties: {type: string}
            env_keys:
              type: array
              description: Names of the environment variables; values are never returned.
              items: {type: string}
            secrets:
              type: array
              items: {$ref: "#/components/schemas/SwarmRef"}
            configs:
              type: array
              items: {$ref: "#/components/schemas/SwarmRef"}
            networks:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: {type: string}
                  aliases:
                    type: array
                    items: {type: string}
            mounts:
              type: array
              items:
                type: object
                required: [type, target]
                properties:
                  type: {type: string}
                  source: {type: string}
                  target: {type: string}
                  read_only: {type: boolean}
            constraints:
              type: array
              items: {type: string}
            max_replicas_per_node: {type: integer, format: int64}
            limit_nano_cpus: {type: integer, format: int64}
            limit_memory_bytes: {type: integer, format: int64}
            update_config: {$ref: "#/components/schemas/SwarmUpdatePolicy"}
            rollback_config: {$ref: "#/components/schemas/SwarmUpdatePolicy"}
            update_message: {type: string}
    ClusterTasks:
      type: object
      required: [read_host, tasks]
      properties:
        read_host: {type: string}
        tasks:
          type: array
          items:
            type: object
            required: [id, service_id, desired_state, state, updated_at]
            properties:
              id: {type: string}
              service_id: {type: string}
              node_id: {type: string}
              slot: {type: integer}
              desired_state: {type: string}
              state: {type: string}
              message: {type: string}
              error: {type: string}
              container_id: {type: string}
              image: {type: string}
              updated_at: {type: string, format: date-time}
        truncated: {type: boolean}
    ClusterNetworks:
      type: object
      required: [read_host, networks]
      properties:
        read_host: {type: string}
        networks:
          type: array
          items:
            type: object
            required: [id, name, driver, created_at]
            properties:
              id: {type: string}
              name: {type: string}
              driver: {type: string}
              attachable: {type: boolean}
              ingress: {type: boolean}
              internal: {type: boolean}
              encrypted: {type: boolean}
              subnets:
                type: array
                items: {type: string}
              stack: {type: string}
              created_at: {type: string, format: date-time}
        truncated: {type: boolean}
    Cluster:
      type: object
      required: [id, name, origin_host, created_at, members]
      properties:
        id: {type: string, description: The Swarm's cluster ID.}
        name: {type: string}
        origin_host: {type: string, description: The manager host the cluster was created from.}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        members:
          type: array
          items:
            type: object
            required: [host_id, node_id, role, linked_at]
            properties:
              host_id: {type: string}
              node_id: {type: string}
              role: {type: string, enum: [manager, worker]}
              linked_at: {type: string, format: date-time}
    ClusterAccess:
      type: object
      required: [assignments, invites, mappings, tokens, counts, complete]
      properties:
        counts:
          type: object
          required: [assignments, invites, mappings, tokens]
          properties:
            assignments: {type: integer}
            invites: {type: integer}
            mappings: {type: integer}
            tokens: {type: integer}
        complete: {type: boolean}
        assignments:
          type: array
          items:
            type: object
            required: [id, username, role]
            properties:
              id: {type: integer, format: int64}
              username: {type: string}
              role: {type: string}
              via: {type: string, description: IdP group of an assignment made by a group mapping.}
        invites:
          type: array
          items:
            type: object
            required: [id, role, expired]
            properties:
              id: {type: integer, format: int64}
              email_hint: {type: string}
              role: {type: string}
              expired: {type: boolean, description: The invite has no other scope and expires with the delete.}
        mappings:
          type: array
          items:
            type: object
            required: [kind, provider, group, role]
            properties:
              kind: {type: string, enum: [oidc, saml, ldap, oauth2]}
              provider: {type: string}
              group: {type: string}
              role: {type: string}
        tokens:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
              owner: {type: string}
