paths:
  /hosts:
    get:
      operationId: hosts.list
      tags: [hosts]
      summary: List all hosts visible to the caller
      description: |
        Returns the local docker daemon plus every registered agent (online
        or offline), decorated with host tags. Callers see
        only hosts their assignments with Hosts: View cover.
      responses:
        "200":
          description: Host list.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/HostInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /hosts/{id}/stacks-dir:
    put:
      operationId: hosts.setStacksDir
      tags: [hosts]
      summary: Set where new stacks go on a connected host
      description: |
        Needs `hosts.update` on the host. The directory the agent uses now
        is confirmed at once (200); for a host that is "Waiting for setup"
        this finishes the setup. Another path is checked by the agent and
        switched by its root updater (managed layout only; 202). Progress
        and the outcome show as `stacks_dir` in `GET /agents/{id}`: the
        agent restarts after a switch and the host reconnects. Existing
        stacks stay where they are.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string, maxLength: 4096, example: /srv/dockmesh/stacks}
      responses:
        "200":
          description: The current directory was confirmed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "202":
          description: Sent to the host; `stacks_dir.status` is `pending` until it answers.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The agent is not connected, uses the legacy layout, or is still applying an earlier request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /hosts/{id}/stacks-dir/check:
    post:
      operationId: hosts.checkStacksDir
      tags: [hosts]
      summary: Check a stacks directory on a connected host
      description: |
        Needs `hosts.update` on the host. The agent checks the path with
        the rules its root updater applies (allowed place, owner, empty,
        local disk, free space) and changes nothing. `status` is `ok`,
        `warn` (usable, e.g. little free space) or `fail` with the reason in
        `message`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string, maxLength: 4096}
      responses:
        "200":
          description: The agent's check.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StacksDirCheck"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The agent is not connected, uses the legacy layout, or an earlier check of the host is still running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The agent did not answer the check.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /hosts/{id}/stacks-dir/disks:
    get:
      operationId: hosts.stacksDirDisks
      tags: [hosts]
      summary: Disks of a connected host with a suggested stacks directory
      description: |
        Needs `hosts.update` on the host. Pseudo filesystems and Docker's
        own directories are left out. The root filesystem suggests
        `<data dir>/stacks`; disks at or below /srv, /opt, /data, /mnt or
        /media suggest `<mount>/stacks`. Network shares, filesystems
        without Unix permissions and other places are listed as not usable.
        `unsupported` is set for agents that do not report their disks.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Disk list.
          content:
            application/json:
              schema:
                type: object
                required: [disks]
                properties:
                  disks:
                    type: array
                    items:
                      type: object
                      required: [mountpoint, fs_type, total_bytes, free_bytes, suggested, usable]
                      properties:
                        mountpoint: {type: string}
                        fs_type: {type: string}
                        total_bytes: {type: integer, format: int64}
                        free_bytes: {type: integer, format: int64}
                        suggested: {type: string}
                        usable: {type: boolean}
                        reason: {type: string, enum: [network share, no Unix permissions, not allowed as a stacks dir]}
                  unsupported: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The agent is not connected.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The agent did not report its disks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  schemas:
    StacksDirCheck:
      type: object
      required: [path, status, message]
      properties:
        path: {type: string}
        status: {type: string, enum: [ok, warn, fail]}
        issue: {type: string, description: Machine-readable name of the first problem, or `unchanged`.}
        message: {type: string}
        command: {type: string, description: 'Shell command that prepares the directory by hand, set when the check refuses a path the agent cannot create or take itself.'}
        will_create: {type: boolean, description: The root updater would create the directory.}
        fs_type: {type: string}
        total_bytes: {type: integer, format: int64}
        free_bytes: {type: integer, format: int64}
    HostInfo:
      type: object
      required: [id, name, kind, status]
      properties:
        id:
          type: string
          description: '"local" for the central daemon, otherwise an agent UUID.'
        name: {type: string}
        kind:
          type: string
          enum: [local, agent]
        status:
          type: string
          enum: [online, offline, pending, removed, revoked]
        tags:
          type: array
          items: {type: string}
        needs_setup:
          type: boolean
          description: The host waits for setup and refuses deploys; host pickers list it disabled.
