paths:
  /roles:
    get:
      operationId: roles.list
      tags: [roles]
      summary: List roles (built-in + custom)
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CustomRole"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: roles.create
      tags: [roles]
      summary: Create a custom role
      description: Permissions and scopes may not exceed the caller's own (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomRole"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Role name already exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /roles/permissions:
    get:
      operationId: roles.permissions
      tags: [roles]
      summary: Catalogue of permissions that can be granted to a role
      description: |
        Returns all `Perm` values the server knows about with a
        human-readable description. Used by the role-create dialog to
        render the permission-picker.
      responses:
        "200":
          description: Permission catalogue.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, display_name, description, category, verb, danger_level]
                  properties:
                    name:
                      type: string
                      description: Backend identifier in `category.verb` dot-notation.
                      example: containers.exec
                    display_name:
                      type: string
                      description: Short human-readable label shown on the matrix cell tooltip and in Edit Role rows.
                      example: Shell into container
                    description:
                      type: string
                      description: One-line plain-language explanation. Renders as the `?` info-button tooltip.
                    category:
                      type: string
                      description: Resource group the permissions matrix renders this row under.
                      example: Containers
                    verb:
                      type: string
                      description: Matrix column header within the category — e.g., view / deploy / update / delete or per-resource sensitive verb.
                      example: exec
                    danger_level:
                      type: string
                      enum: [low, medium, high]
                      description: Drives UI tinting on dangerous grants.
                    sensitive:
                      type: boolean
                      description: When true the permission belongs in the matrix's "Sensitive operations" sub-section rather than the standard verb columns.
        "401": {$ref: "#/components/responses/Unauthorized"}
  /roles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: roles.get
      tags: [roles]
      summary: Inspect one role
      responses:
        "200":
          description: Role.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomRole"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: roles.update
      tags: [roles]
      summary: Update a custom role's display name + permissions
      description: |
        The caller must be unscoped (no host scope tags, no role scope) and
        hold every permission of the role before and after the change (403). Taking admin rights from a role whose holders
        are the last admins returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomRole"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Role is built-in (cannot be renamed).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: roles.delete
      tags: [roles]
      summary: Delete a custom role
      description: |
        Built-in roles cannot be deleted — returns 409, as does deleting
        the role of the last admins. The caller must be unscoped and hold
        every permission of the role (403).
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Role is built-in or still referenced by users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  schemas:
    CustomRole:
      type: object
      required: [name, display, permissions]
      properties:
        name: {type: string, example: operator}
        display: {type: string, example: "Operator"}
        description:
          type: string
          description: One-line human blurb shown under the role name in the Roles UI.
          example: "Deploy and operate stacks. No editing of compose files, no user management."
        builtin:
          type: boolean
          description: "Built-in roles cannot be renamed or deleted (the five v2 roles: viewer, operator, deployer, host-admin, admin)."
        permissions:
          type: array
          items: {type: string}
        scopes:
          type: array
          description: Per-role scope rows. Empty = unscoped (acts on everything its permissions allow). Each row narrows scope to a specific host, stack, or all hosts carrying a tag. Effective scope is the UNION of all rows for the role.
          items: {$ref: "#/components/schemas/RoleScope"}
    RoleScope:
      type: object
      required: [scope_type, scope_value]
      properties:
        scope_type:
          type: string
          enum: [host, stack, host_tag]
        scope_value:
          type: string
          description: Host id, stack name, or host-tag string depending on scope_type.
    RoleInput:
      type: object
      required: [name, display, permissions]
      properties:
        name: {type: string, example: deploy-bot}
        display: {type: string}
        description:
          type: string
          description: Optional one-line human blurb. Shown under the role name in the Roles UI.
        permissions:
          type: array
          items: {type: string}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/RoleScope"}
