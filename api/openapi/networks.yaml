paths:
  /networks:
    get:
      operationId: networks.list
      tags: [networks]
      summary: List networks (fan-out capable)
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Networks.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {type: object}
                  - $ref: "#/components/schemas/FanOutResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: networks.create
      tags: [networks]
      summary: Create a network on a host
      description: |
        `host` picks the host (default the server's own). Agents older than
        this server answer 503 and need an update.
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                driver: {type: string, default: bridge}
                labels:
                  type: object
                  additionalProperties: {type: string}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/HostUnavailable"}
  /networks/prune:
    post:
      operationId: networks.prune
      tags: [networks]
      summary: Remove unused networks on the host given by `host`
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Prune report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks_deleted:
                    type: array
                    items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/HostUnavailable"}
  /networks/topology:
    get:
      operationId: networks.topology
      tags: [networks]
      summary: Network graph of one host or cluster
      description: |
        Networks, containers and their memberships on one host, for the
        topology view. On an agent host the agent builds the graph for its
        own daemon; an agent too old for this request gets a 503 with code
        `topology_agent_outdated`. The answer holds only containers in the
        caller's scope, plus the networks of stacks in scope and any network a
        visible container is attached to. `target` names what the graph
        shows.

        With `cluster=<id>` the graph is the Swarm's, read through the
        cluster's manager: `services` instead of containers, Swarm-scoped
        networks (ingress counts as a system network) and links from
        services to networks. It needs `networks.view` and `stacks.view` on
        the cluster.
      parameters:
        - name: host
          in: query
          required: false
          description: "Host id. Empty or `local` = the server's own daemon, otherwise an agent id. `all` is refused: the graph is per host."
          schema: {type: string, default: local}
        - name: cluster
          in: query
          required: false
          description: Cluster id; the graph of that Swarm instead of a host. Refused with 400 together with `host`.
          schema: {type: string}
      responses:
        "200":
          description: The graph; the UI lays it out.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Topology"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502":
          description: The cluster's manager answered with an error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: Host offline, no Docker, or the agent is too old (code `topology_agent_outdated`); for a cluster, its manager is unreachable or too old for the Swarm read frames.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /networks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - $ref: "#/components/parameters/HostQuery"
    get:
      operationId: networks.inspect
      tags: [networks]
      summary: Inspect one network
      responses:
        "200":
          description: Network.
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: networks.remove
      tags: [networks]
      summary: Remove a network on the host given by `host`
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Network still has active endpoints.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/HostUnavailable"}
components:
  schemas:
    Topology:
      type: object
      required: [target, networks, containers, links]
      properties:
        target:
          type: object
          required: [kind, id, name]
          properties:
            kind:
              type: string
              enum: [host, cluster]
              description: What the graph shows.
            id: {type: string}
            name: {type: string}
        networks:
          type: array
          items:
            type: object
            required: [id, name, driver, scope, internal, system]
            properties:
              id: {type: string}
              name: {type: string}
              driver: {type: string}
              scope: {type: string}
              internal: {type: boolean}
              system: {type: boolean, description: "bridge, host or none"}
              stack: {type: string, description: Compose project the network belongs to.}
        containers:
          type: array
          items:
            type: object
            required: [id, name, state, image]
            properties:
              id: {type: string}
              name: {type: string}
              state: {type: string}
              image: {type: string}
              stack: {type: string}
              ports:
                type: array
                description: Published ports, one entry per host port and protocol.
                items:
                  type: object
                  properties:
                    host_port: {type: integer}
                    container_port: {type: integer}
                    protocol: {type: string}
        links:
          type: array
          description: Container memberships of networks; in a cluster graph, service attachments.
          items:
            type: object
            required: [network_id]
            properties:
              network_id: {type: string}
              container_id: {type: string}
              service_id: {type: string}
              ipv4: {type: string}
              aliases:
                type: array
                items: {type: string}
        services:
          type: array
          description: Only in a cluster graph.
          items: {$ref: "#/components/schemas/SwarmService"}
        truncated: {type: boolean, description: The manager cut its service or network list.}
