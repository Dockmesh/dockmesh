components:
  schemas:
    StacksDirCheck:
      type: object
      required: [path, status, message]
      properties:
        path: {type: string}
        status: {type: string, enum: [ok, warn, fail]}
        issue: {type: string, description: Machine-readable name of the first problem, or `unchanged`.}
        message: {type: string}
        command: {type: string, description: 'Shell command that prepares the directory by hand, set when the check refuses a path the agent cannot create or take itself.'}
        will_create: {type: boolean, description: The root updater would create the directory.}
        fs_type: {type: string}
        total_bytes: {type: integer, format: int64}
        free_bytes: {type: integer, format: int64}
    MigrationHookCommands:
      type: object
      description: |
        Hook commands from the stack's `.dockmesh.meta.json` that a
        migration runs with `sh -c` in a running container of the stack.
        `digest` names exactly these commands; a migration or drain runs
        them only when the request sends it back.
      required: [digest]
      properties:
        pre_dump: {type: string, description: Runs on the source host before the stack stops.}
        post_restore: {type: string, description: Runs on the target host after the stack starts.}
        digest: {type: string, description: SHA-256 hex of the commands.}
    ModifiedOutsideError:
      type: object
      description: An error, or with `code` `modified_outside` the stack files changed outside Dockmesh (`files`).
      required: [error]
      properties:
        error: {type: string}
        code: {type: string, enum: [modified_outside]}
        stack: {type: string}
        files:
          type: array
          items: {type: string}
    StackBusyError:
      type: object
      description: Another operation is changing the stack's containers (`code` `stack_busy`); retry when it has finished.
      required: [error, code, operation, since]
      properties:
        error: {type: string}
        code: {type: string, enum: [stack_busy]}
        operation:
          type: string
          description: What holds the stack, e.g. `deploy`, `scale`, `rolling update`, `image update`, `image rollback`, `git auto-deploy`, `auto-scaling`, `dependency deploy` or `maintenance`.
        since: {type: string, format: date-time}
    HistoryReason:
      type: string
      enum: [agent_outdated, agent_offline]
      description: "Why a host has no stored history: `agent_outdated`, its agent is too old to record it; `agent_offline`, the agent is offline and nothing is stored yet."
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid credentials
        code:
          type: string
          example: invalid_body
          description: |
            Stable identifier of the message, for clients that show errors in
            another language. Fixed messages have their own code; messages with
            runtime detail carry a generic `http_*` one per status (`http_bad_request`,
            `http_not_found`, `http_unavailable`, `http_internal`, …).
    Operation:
      type: object
      required: [id, kind, target, status, steps, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [image.update, backup.run, backup.restore, proxy.site]}
        target: {type: string, description: "Container, backup job, restored volume or stack, or site host."}
        ref: {type: string, description: "What it belongs to: `container:<id>`, `backup-run:<id>`, `proxy-site:<host>`."}
        group_id: {type: string, description: "Shared by the operations of one bulk update."}
        host_id: {type: string}
        stack: {type: string}
        actor: {type: string, description: "User id (the owner for an owned API token), `api-token:<id>` for an unowned token, empty for scheduled work."}
        actor_name: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        cancellable: {type: boolean, description: "Set while `POST /operations/{id}/cancel` would stop the work now: queued, or in a step that only reads or waits."}
        cancel_requested: {type: boolean, description: "A cancel was accepted and the running step is stopping."}
        error: {type: string, description: "The failure, or for a cancelled operation the step it stopped in."}
        steps:
          type: array
          items: {$ref: "#/components/schemas/OperationStep"}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        log:
          type: array
          description: Only on `GET /operations/{id}`.
          items: {$ref: "#/components/schemas/OperationLogLine"}
    OperationStep:
      type: object
      required: [key, label, status]
      properties:
        key: {type: string}
        label: {type: string}
        status: {type: string, enum: [pending, running, succeeded, failed, skipped, warning, cancelled]}
        detail: {type: string}
        progress: {type: number, minimum: 0, maximum: 1, description: "Absent when the step cannot measure its progress."}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    OperationLogLine:
      type: object
      required: [ts, level, text]
      properties:
        ts: {type: string, format: date-time}
        level: {type: string, enum: [info, warn, error]}
        text: {type: string, maxLength: 1024}
    Empty:
      type: object
      description: Empty body — use for 204 No Content endpoints.
    Scope:
      type: object
      required: [type]
      description: |
        Where an assignment applies. `host` and `stack` carry the host id in
        `host`; `host_tag` and `stack` carry the tag or stack name in
        `value`. Stack names are unique across the instance; a stack scope
        matches the stack while it is deployed on `host` (or, not deployed
        yet, was created for `host`); without `host` it matches the stack
        anywhere and while it is not deployed. A host or host tag scope
        reaches an undeployed stack only through the host it was created for.
        `cluster` carries the Swarm cluster id in `host`; it covers the
        cluster's own resources (its node list), never the hosts that are
        its nodes, and no host or host tag scope covers a cluster.
      properties:
        type: {type: string, enum: [global, host, host_tag, stack, cluster]}
        host: {type: string, example: local}
        value: {type: string, example: web}
    Assignment:
      type: object
      required: [id, user_id, role, scope, source]
      properties:
        id: {type: integer, format: int64}
        user_id: {type: string}
        role: {type: string}
        scope: {$ref: "#/components/schemas/Scope"}
        source:
          type: string
          enum: [manual, idp]
          description: "`idp`: written by an identity provider's group mapping at sign-in and replaced on every sign-in."
        via: {type: string, description: The group or default role an `idp` assignment came from.}
        created_at: {type: string}
        created_by: {type: string}
    AssignmentView:
      allOf:
        - $ref: "#/components/schemas/Assignment"
        - type: object
          properties:
            username: {type: string}
    User:
      type: object
      required: [id, username, source, mfa_enabled]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        email: {type: string, format: email}
        source:
          type: string
          enum: [manual, sso]
          description: "`sso`: sign-in replaces the account's identity provider assignments from its groups."
        assignments:
          type: array
          items: {$ref: "#/components/schemas/Assignment"}
        permissions:
          type: array
          description: In /me and the login response only. Every permission the caller holds on at least one scope, for UI gating.
          items: {type: string}
        unscoped:
          type: boolean
          description: In /me only. True when every permission is held on everything.
        mfa_enabled: {type: boolean}
        language:
          type: string
          enum: ["", en, de]
          description: In /me only. The language the user picked; empty when the browser language decides.
        locked_until:
          type: string
          format: date-time
          description: Only in the user list, while the account is blocked by failed sign-ins. Clear it with the unlock endpoint.
    BackupStatus:
      type: object
      properties:
        enabled: {type: boolean}
        last_run_at: {type: string, format: date-time}
        last_run_status: {type: string, enum: [success, failed, running]}
        last_run_size_bytes: {type: integer, format: int64}
        last_run_age_seconds: {type: integer}
        next_run_at: {type: string, format: date-time}
    VolumeEntry:
      type: object
      description: One row in a volume directory listing (P.11.8).
      required: [name, type, size, mode, mod_time]
      properties:
        name: {type: string}
        type:
          type: string
          enum: [file, dir, symlink]
        size: {type: integer, format: int64}
        mode: {type: string, description: Unix-style "rwxr-xr-x" string.}
        mod_time: {type: string, format: date-time}
        link_dest: {type: string, description: "For symlinks, the target path."}
    VolumeFileResult:
      type: object
      description: Inline file read from a volume (P.11.8).
      required: [content, size, truncated, binary]
      properties:
        content:
          type: string
          format: byte
          description: Base64-encoded file bytes — capped at 1 MiB.
        size:
          type: integer
          format: int64
          description: Actual file size on disk (may exceed content length when truncated).
        truncated: {type: boolean}
        binary:
          type: boolean
          description: True when the first 8 KiB contain a NUL byte.
    MigrationStatus:
      type: object
      description: |
        One stack migration. `rolling_back` means the stack is being
        restored on the source host after a failure or a server restart
        during the migration; it ends as `rolled_back`, or `failed` with
        what to do in `error_message`.
      required: [id, stack_name, source_host_id, target_host_id, status]
      properties:
        id: {type: string, format: uuid}
        stack_name: {type: string}
        source_host_id: {type: string}
        target_host_id: {type: string}
        status:
          type: string
          enum: [pending, preflight, preparing, pre_dump, stopping, syncing, starting, post_restore,
                 health_check, committing, completed, failed, rolling_back, rolled_back]
        phase: {type: string, description: The phase the migration is in or ended in.}
        progress:
          type: object
          properties:
            current_volume: {type: string}
            volume_index: {type: integer}
            volumes_total: {type: integer}
            bytes_total: {type: integer, format: int64}
            bytes_done: {type: integer, format: int64}
            images_pulled: {type: integer}
            images_total: {type: integer}
            created_volumes:
              type: array
              items: {type: string}
              description: Volumes the migration created on the target; a rollback before the commit removes them.
            volumes_copied:
              type: array
              description: Volumes copied to the target and read back identical (contents, owners, modes).
              items:
                type: object
                properties:
                  name: {type: string}
                  bytes: {type: integer, format: int64}
                  entries: {type: integer}
            failed_phase: {type: string, description: The phase a failed migration stopped in.}
            purged: {type: boolean, description: The migration was finalised and its copied volumes removed from the source; it can no longer be rolled back.}
            undo:
              type: array
              description: What the rollback did, in order.
              items:
                type: string
                enum: [stop_target, remove_target_volumes, keep_target_volumes, restart_source]
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        error_message: {type: string}
        initiated_by: {type: string}
        drain_id: {type: string}
        created_at: {type: string, format: date-time}
    FanOutResponse:
      type: object
      description: |
        Returned by list endpoints when `?host=all`. `items` is the flat
        aggregated list; `errors` lists hosts that failed to respond so
        the UI can show partial results with a warning banner.
      required: [items]
      properties:
        items:
          type: array
          items: {type: object}
          description: Rows from every host that answered. Shape depends on the endpoint.
        errors:
          type: array
          items:
            type: object
            properties:
              host_id: {type: string}
              host_name: {type: string}
              error: {type: string}
