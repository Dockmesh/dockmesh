paths:
  /settings/api-tokens:
    get:
      operationId: api_tokens.list
      tags: [api-tokens]
      summary: List API tokens (plaintext is NOT returned — only the prefix)
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ApiToken"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: api_tokens.create
      tags: [api-tokens]
      summary: Create a new API token
      description: |
        The plaintext token is returned ONCE in the `token` field. It is
        never retrievable afterwards — lose it and you must revoke +
        recreate.

        The new token is owned by the signed-in user, or by the owner of
        the API token making the request. Legacy tokens (no owner) can't
        create tokens (403). A token acts with its owner's current access,
        narrowed to `role` on `scope` when a role is given. A token created
        with a restricted API token stays inside that restriction (403) and
        never expires later than that token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, example: github-deploy}
                role: {type: string, example: deployer, description: Optional restriction; empty = the owner's full access.}
                scope: {$ref: "#/components/schemas/Scope"}
                expires_in_days:
                  type: integer
                  minimum: 0
                  default: 90
                  description: 0 = never expires.
      responses:
        "201":
          description: Created with one-time plaintext.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiToken"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: Full plaintext `dmt_…` value. Save it now.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /settings/api-tokens/{id}:
    delete:
      operationId: api_tokens.revoke
      tags: [api-tokens]
      summary: Revoke an API token (soft delete — sets revoked_at)
      description: |
        Without `tokens.manage_others`, a signed-in user can revoke their
        own tokens and an API token can revoke only itself; anything else
        is 404.
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "204": {description: Revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  schemas:
    ApiToken:
      type: object
      description: |
        Long-lived bearer token. Plaintext is NEVER returned except the
        one-time create response. A token belongs to the user who created
        it (`created_by`) and acts with the owner's current access, narrowed
        to `role` on `scope` when `role` is set. Tokens created before owners
        were recorded are `legacy`: they act as their role on their scope
        and have no owner.
      required: [id, prefix, name, role, legacy, created_at]
      properties:
        id: {type: integer, format: int64}
        prefix: {type: string, example: "dmt_A7f3X9c4"}
        name: {type: string}
        role: {type: string, description: Restriction role; empty = none.}
        scope: {$ref: "#/components/schemas/Scope"}
        created_by: {type: string, description: Owning user id.}
        legacy: {type: boolean, description: No owner on record; works with its pinned role.}
        owner_missing:
          type: boolean
          description: The owner was deleted; the token no longer authenticates.
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        last_used_ip: {type: string}
        revoked_at: {type: string, format: date-time}
