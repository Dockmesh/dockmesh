paths:
  /setup/preflight:
    get:
      operationId: setup.preflight
      tags: [setup]
      summary: Host + Docker preflight checks for the wizard's first page
      security: []
      responses:
        "200":
          description: Preflight snapshot with one row per check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, description: "true when no check is fail"}
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        label: {type: string}
                        value: {type: string}
                        status: {type: string, enum: [ok, warn, fail]}
                        message: {type: string}
                        hint: {type: string}
  /setup/server-info:
    get:
      operationId: setup.server_info
      tags: [setup]
      summary: Top-bar facts (version · os · ip · docker)
      description: Polled by the wizard top-bar every ~10s while setup is open.
      security: []
      responses:
        "200":
          description: Server info snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  os: {type: string}
                  ip: {type: string}
                  docker_version: {type: string}
                  uptime_secs: {type: integer}
  /setup/validate-data-dir:
    post:
      operationId: setup.validate_data_dir
      tags: [setup]
      summary: Live-validate Step 2's data-directory input
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  exists: {type: boolean}
                  is_dir: {type: boolean}
                  writable: {type: boolean}
                  will_create: {type: boolean}
                  total_bytes: {type: integer, format: int64}
                  free_bytes: {type: integer, format: int64}
                  parent_exists: {type: boolean}
                  parent_writable: {type: boolean}
                  status: {type: string, enum: [ok, warn, fail]}
                  message: {type: string}
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/validate-user:
    post:
      operationId: setup.validate_user
      tags: [setup]
      summary: Validate Step 3's service-user choice
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, username]
              properties:
                mode: {type: string, enum: [existing, create]}
                username: {type: string}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: {type: string}
                  exists: {type: boolean}
                  uid: {type: string}
                  gid: {type: string}
                  home_dir: {type: string}
                  in_docker_group: {type: boolean}
                  status: {type: string, enum: [ok, warn, fail]}
                  message: {type: string}
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/test-url:
    post:
      operationId: setup.test_url
      tags: [setup]
      summary: Reachability probe for Step 5's public URL
      description: |
        Connects only to public addresses and to this server's own LAN
        addresses on the port it is served on, 80 or 443. Loopback,
        link-local, cloud metadata, NAT64 and other private addresses
        are refused after DNS resolution and on every redirect hop; the
        result is then `status: fail` with a "not tested" message.
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}
                expect_health: {type: boolean}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  reachable: {type: boolean}
                  latency_ms: {type: integer}
                  status: {type: string, enum: [ok, warn, fail]}
                  message: {type: string}
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/commit:
    post:
      operationId: setup.commit
      tags: [setup]
      summary: Run the install with the wizard-collected config
      description: |
        Returns 202 Accepted with a `run_id`. The actual install runs
        in the background; subscribe to `/setup/stream/{run_id}` (SSE)
        to read each step's status as it happens. Only one install runs
        at a time. The service user is added to the `docker` group only
        when the wizard creates it (`mode: create`); existing accounts
        are never changed.
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_dir, service_user, admin, public_url]
              properties:
                data_dir: {type: string}
                service_user:
                  type: object
                  required: [mode, username]
                  properties:
                    mode: {type: string, enum: [existing, create]}
                    username: {type: string}
                    add_to_docker_group: {type: boolean}
                admin:
                  type: object
                  required: [username, password]
                  properties:
                    username: {type: string}
                    email: {type: string}
                    password: {type: string}
                public_url: {type: string, format: uri}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: {type: string}
                  stream_url: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: |
            Another install is already running or has just finished, or an
            account that can administer Dockmesh already exists (setup then
            closes).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/restore:
    post:
      operationId: setup.restore
      tags: [setup]
      summary: Restore a system backup instead of setting up a new install
      description: |
        Only while setup mode is active. Takes a system backup archive
        (`file`) and, for an archive encrypted by the original install,
        the backup key file exported there (`key`, from
        `GET /system/backup-key/export`). The archive is extracted next to
        the live files and checked (database opens and migrates, an admin
        exists); then setup mode ends and the server restarts, swapping the
        restored files in before it opens the database. Sign in with an
        account of the restored install afterwards. The service manager
        has to restart the process (exit code 75).

        Requests must carry `X-Dockmesh-Setup: 1`; browsers only send it
        from a same-origin page, so another site can't post a backup here.
        Archives may unpack to at most 8 GiB / 200,000 entries.
      security: []
      parameters:
        - name: X-Dockmesh-Setup
          in: header
          required: true
          schema: {type: string, enum: ["1"]}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "System backup (.tar.gz or .tar.gz.age), up to 1 GiB."}
                key: {type: string, format: binary, description: Exported backup key file; needed for encrypted archives.}
      responses:
        "202":
          description: Staged; the server restarts now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarting: {type: boolean}
                  counts: {type: object}
                  sanity: {type: object}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          description: The X-Dockmesh-Setup header is missing or the request is cross-site.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: Another restore is being staged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is not active or its window expired.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {description: "Archive larger than 1 GiB, or it unpacks to more than the limit."}
        "422":
          description: Encrypted without a matching key, or the backup failed the restore checks (`sanity` lists them).
          content:
            application/json:
              schema: {type: object}
  /setup/stream/{run_id}:
    get:
      operationId: setup.stream
      tags: [setup]
      summary: Server-Sent Events stream of install steps
      description: |
        SSE stream — `event: line` frames carry one `Event` JSON per
        install step (timestamp, step id, message, status). When the
        runner finishes, an `event: end` frame closes the stream. The
        wizard's Step 7 terminal animation reads from this directly.
        Stays available after setup has ended, so a wizard that connects
        after a fast install still gets the full history; runs are
        dropped 10 minutes after they finish (then 404).
      security: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: {type: string}
        "404":
          description: Run not found or already evicted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/status:
    get:
      operationId: setup.status
      tags: [setup]
      summary: Whether the server is in first-run setup mode
      description: |
        Returns `active: true` when the server has no admin user and
        the install wizard is the only thing that should be reachable.
        The wizard frontend polls this on every page load to decide
        whether to redirect to the dashboard once setup is complete.

        `expired: true` means the 30-minute setup window passed without
        the wizard being completed — the operator restarts the service
        to get a fresh window. Refusing to seed admins past the window
        is a Portainer-style drive-by protection.
      security: []
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [active, started_at, expires_at, expired, window_secs]
                properties:
                  active: {type: boolean}
                  started_at: {type: string, format: date-time}
                  expires_at: {type: string, format: date-time}
                  expired: {type: boolean}
                  window_secs: {type: integer}
