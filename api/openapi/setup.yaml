paths:
  /setup/preflight:
    get:
      operationId: setup.preflight
      tags: [setup]
      summary: Host + Docker preflight checks for the wizard's first page
      security:
        - setupSession: []
      responses:
        "401":
          description: No setup session (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "200":
          description: Preflight snapshot with one row per check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, description: "true when no check is fail"}
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        label: {type: string}
                        value: {type: string}
                        status: {type: string, enum: [ok, warn, fail]}
                        message: {type: string}
                        hint: {type: string}
  /setup/server-info:
    get:
      operationId: setup.server_info
      tags: [setup]
      summary: Top-bar facts (version · os · ip · docker)
      description: Polled by the wizard top-bar every ~10s while setup is open.
      security:
        - setupSession: []
      responses:
        "401":
          description: No setup session (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "200":
          description: Server info snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  os: {type: string}
                  arch: {type: string, description: "CPU architecture as Go names it, for example amd64."}
                  fresh: {type: boolean, description: "True for a new install. False for an older install whose setup never finished; its commit keeps the data dir, port and TLS settings."}
                  ip: {type: string}
                  docker_version: {type: string}
                  uptime_secs: {type: integer}
                  tls_fingerprint: {type: string, description: "SHA-256 of the certificate setup mode serves, as colon-separated hex; absent over plain HTTP."}
  /setup/disks:
    get:
      operationId: setup.disks
      tags: [setup]
      summary: Mounted filesystems for the data directory step
      description: Mountpoint, filesystem type and space of each disk, with the suggested data directory. Pseudo filesystems and Docker's own directories are left out; network shares and filesystems without Unix permissions come back with `usable` false. Never lists directory contents. Answers 410 once setup is over.
      security:
        - setupSession: []
      responses:
        "401":
          description: No setup session (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410": {description: Setup is over.}
        "200":
          description: The disks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  disks:
                    type: array
                    items:
                      type: object
                      properties:
                        mountpoint: {type: string}
                        fs_type: {type: string}
                        total_bytes: {type: integer}
                        free_bytes: {type: integer}
                        suggested: {type: string}
                        usable: {type: boolean}
                        reason: {type: string}
  /setup/validate-data-dir:
    post:
      operationId: setup.validate_data_dir
      tags: [setup]
      summary: Check a data directory for a new install
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  exists: {type: boolean}
                  is_dir: {type: boolean}
                  will_create: {type: boolean}
                  empty: {type: boolean, description: "The directory exists and holds nothing but setup mode's own files."}
                  fs_type: {type: string, description: Filesystem type of the mount that holds the path.}
                  total_bytes: {type: integer, format: int64}
                  free_bytes: {type: integer, format: int64}
                  parent_exists: {type: boolean}
                  status: {type: string, enum: [ok, warn, fail]}
                  issue:
                    type: string
                    description: The first problem found, for `fail` and `warn`.
                    enum: [not_absolute, bad_characters, inside_docker, system_dir, no_parent, unsafe_parent, symlink, not_a_directory, existing_install, foreign_owner, not_empty, network_share, no_unix_permissions, too_small, low_space, unreadable]
                  message: {type: string}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/validate-stacks-dir:
    post:
      operationId: setup.validate_stacks_dir
      tags: [setup]
      summary: Check a stacks directory for a new install
      description: |
        Checks the stacks directory as the service account, with the rules
        root's setup-apply applies before it creates the directory: outside
        the data directory, root creates only one new directory named
        `stacks` or `dockmesh-stacks…` directly in /srv, /opt, /data, /mnt or
        /media (or a disk mounted below one of them); anywhere else the
        directory must exist, be empty and belong to the service account.
        `<data_dir>/stacks` is always accepted.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_dir, path]
              properties:
                data_dir: {type: string}
                path: {type: string}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StacksDirCheck"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/check-ports:
    post:
      operationId: setup.check_ports
      tags: [setup]
      summary: Check whether the web and agent ports are free
      description: |
        Reports a port another program listens on. The ports setup mode
        listens on itself count as free, since the new config takes them
        over at the restart; a port the service may not bind is not
        reported.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [web_port, agent_port]
              properties:
                web_port: {type: integer}
                agent_port: {type: integer}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: One result per port.
          content:
            application/json:
              schema:
                type: object
                properties:
                  web: {$ref: "#/components/schemas/SetupPortCheck"}
                  agent: {$ref: "#/components/schemas/SetupPortCheck"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/check-cert:
    post:
      operationId: setup.check_cert
      tags: [setup]
      summary: Check an own certificate and key
      description: |
        Reads both files as the service account and reports whether it
        can read them, whether they are a matching pair and whether the
        certificate has expired (`fail`), or does not cover `host` or ends
        within 30 days (`warn`). Only facts of the certificate are
        returned, never file contents.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_file, key_file]
              properties:
                cert_file: {type: string}
                key_file: {type: string}
                host: {type: string, description: Host name of the base URL.}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, warn, fail]}
                  issue: {type: string, enum: [unreadable, missing, invalid, mismatch, expired, hostname, expiring]}
                  file: {type: string, description: The file an unreadable, missing or invalid issue is about.}
                  not_after: {type: string, format: date-time}
                  days: {type: integer, description: Days left, for `expiring`.}
                  message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/check-proxy:
    post:
      operationId: setup.check_proxy
      tags: [setup]
      summary: Check the reverse proxy step
      description: |
        Lists which of ports 80 and 443 another program listens on, with
        `pull` pulls the Caddy image a new install starts with (unless
        Docker has it),
        and with `host` (TLS mode caddy) resolves that name and says whether
        it points at an address of this server. Behind NAT a public name
        never does, so `local: false` is a hint, not an error.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: {type: string}
                pull: {type: boolean}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  busy_ports: {type: array, items: {type: integer}}
                  image: {type: string}
                  pulled: {type: boolean}
                  pull_error: {type: string}
                  dns:
                    type: object
                    properties:
                      host: {type: string}
                      resolves: {type: boolean}
                      addresses: {type: array, items: {type: string}}
                      local: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500":
          description: The listening ports could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/test-notification:
    post:
      operationId: setup.test_notification
      tags: [setup]
      summary: Send a test message to a channel that is not saved yet
      description: |
        Builds the channel from `type` and `config` (the fields of
        `POST /notifications/channels`) and sends one test message. Nothing
        is stored. Link-local and metadata addresses are refused; the error
        text never repeats a secret of the config.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: {type: string, enum: [webhook, ntfy, discord, slack, teams, gotify, email, pagerduty, pushover]}
                config: {type: object, additionalProperties: true}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "204": {description: Test message sent.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "502":
          description: The channel refused or could not be reached.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/validate-user:
    post:
      operationId: setup.validate_user
      tags: [setup]
      summary: Validate Step 3's service-user choice
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, username]
              properties:
                mode: {type: string, enum: [existing, create]}
                username: {type: string}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: {type: string}
                  exists: {type: boolean}
                  uid: {type: string}
                  gid: {type: string}
                  home_dir: {type: string}
                  in_docker_group: {type: boolean}
                  status: {type: string, enum: [ok, warn, fail]}
                  message: {type: string}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/test-url:
    post:
      operationId: setup.test_url
      tags: [setup]
      summary: Reachability probe for Step 5's public URL
      description: |
        Connects only to public addresses and to this server's own LAN
        addresses on the port it is served on, 80 or 443. Loopback,
        link-local, cloud metadata, NAT64 and other private addresses
        are refused after DNS resolution and on every redirect hop; the
        result is then `status: fail` with a "not tested" message.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}
                expect_health: {type: boolean}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "200":
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  reachable: {type: boolean}
                  latency_ms: {type: integer}
                  status: {type: string, enum: [ok, warn, fail]}
                  message: {type: string}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/commit:
    post:
      operationId: setup.commit
      tags: [setup]
      summary: Run the install with the wizard-collected config
      description: |
        Returns 202 Accepted with a `run_id`. The actual install runs
        in the background; subscribe to `/setup/stream/{run_id}` (SSE)
        to read each step's status as it happens. Only one install runs
        at a time. The service user is added to the `docker` group only
        when the wizard creates it (`mode: create`); existing accounts
        are never changed.
      security:
        - setupSession: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_dir, service_user, admin, public_url]
              properties:
                data_dir: {type: string}
                stacks_dir: {type: string, description: "Stacks directory, checked like in `POST /setup/validate-stacks-dir`; empty for `<data_dir>/stacks`."}
                service_user:
                  type: object
                  required: [mode, username]
                  properties:
                    mode: {type: string, enum: [existing, create]}
                    username: {type: string}
                    add_to_docker_group: {type: boolean}
                admin:
                  type: object
                  required: [username, password]
                  properties:
                    username: {type: string}
                    email: {type: string}
                    password: {type: string}
                public_url: {type: string, format: uri}
                tls:
                  type: object
                  description: What a new install serves after setup. Ignored for an install from 0.5.x that finishes its setup.
                  properties:
                    mode: {type: string, enum: [internal, file, caddy, proxy], description: "Defaults to internal: the setup certificate."}
                    http_addr: {type: string, description: "Listen address; defaults to :8080, or 127.0.0.1:8080 for caddy and proxy."}
                    cert_file: {type: string, description: Absolute PEM certificate path for mode file.}
                    key_file: {type: string, description: Absolute PEM key path for mode file.}
                    trusted_proxies: {type: string, description: "Mode proxy only: comma-separated addresses or networks to trust instead of the listen address; never every address."}
                notifications:
                  type: array
                  maxItems: 10
                  description: Notification channels to create, checked like `POST /setup/test-notification`. The secrets stay in the setup state only until the apply ends.
                  items:
                    type: object
                    required: [type, config]
                    properties:
                      type: {type: string}
                      name: {type: string}
                      config: {type: object, additionalProperties: true}
                proxy:
                  type: object
                  description: "The reverse proxy step. TLS mode caddy turns it on, needs `acme_email` and an https base URL with a DNS name, and stores a route for that name to this server."
                  properties:
                    enabled: {type: boolean}
                    acme_email: {type: string}
                agent:
                  type: object
                  description: The agent listener. Ignored for an install from 0.5.x that finishes its setup.
                  properties:
                    listen: {type: string, description: "`:<port>`; defaults to :8443."}
                    url: {type: string, description: "wss:// URL agents connect to; defaults to the one derived from public_url and the port. Saved as a setting."}
      responses:
        "403": {description: "Missing the `X-Dockmesh-Setup` header."}
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: {type: string}
                  stream_url: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: |
            Another install is already running or has just finished, or the
            install has a user account by now (setup then closes).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/restore:
    post:
      operationId: setup.restore
      tags: [setup]
      summary: Restore a system backup instead of setting up a new install
      description: |
        Only while setup mode is active. Takes a system backup archive
        (`file`) and, for an archive encrypted by the original install,
        the backup key file exported there (`key`, from
        `GET /system/backup-key/export`). The archive is extracted next to
        the live files and checked (database opens and migrates, an admin
        exists); then setup mode ends and the server restarts, swapping the
        restored files in before it opens the database. Sign in with an
        account of the restored install afterwards. The service manager
        has to restart the process (exit code 75).

        On a new install (setup mode over HTTPS) the checks run the same
        way, but the archive is kept in setup mode's state dir and restored
        into `data_dir` by the root updater's setup-apply, which also
        writes the config; the answer then carries a `run_id` to follow on
        `GET /setup/stream/{run_id}`, like `POST /setup/commit`.

        Requests must carry `X-Dockmesh-Setup: 1`; browsers only send it
        from a same-origin page, so another site can't post a backup here.
        Archives may unpack to at most 8 GiB / 200,000 entries.
      security:
        - setupSession: []
      parameters:
        - name: X-Dockmesh-Setup
          in: header
          required: true
          schema: {type: string, enum: ["1"]}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "System backup (.tar.gz or .tar.gz.age), up to 1 GiB."}
                key: {type: string, format: binary, description: Exported backup key file; needed for encrypted archives.}
                data_dir: {type: string, description: "New install only: the data directory to restore into, checked like in `POST /setup/validate-data-dir`."}
                stacks_dir: {type: string, description: "New install only: the stacks directory, checked like in `POST /setup/validate-stacks-dir`; empty for `<data_dir>/stacks`."}
                base_url: {type: string, description: "New install only: the base URL to store; optional."}
      responses:
        "202":
          description: Staged; the server restarts now. On a new install, accepted with a run to follow.
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarting: {type: boolean}
                  run_id: {type: string, description: New install only.}
                  stream_url: {type: string, description: New install only.}
                  counts: {type: object}
                  sanity: {type: object}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403":
          description: The X-Dockmesh-Setup header is missing or the request is cross-site.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: |
            Another install or restore is running, or the install has a
            user account by now (setup then closes). Checked again after
            the upload, right before setup mode ends.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401":
          description: No setup session that may write (`setup code required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "410":
          description: Setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {description: "Archive larger than 1 GiB, or it unpacks to more than the limit."}
        "422":
          description: Encrypted without a matching key, or the backup failed the restore checks (`sanity` lists them).
          content:
            application/json:
              schema: {type: object}
  /setup/stream/{run_id}:
    get:
      operationId: setup.stream
      tags: [setup]
      summary: Server-Sent Events stream of install steps
      description: |
        SSE stream — `event: line` frames carry one `Event` JSON per
        install step (timestamp, step id, message, status). When the
        runner finishes, an `event: end` frame closes the stream. The
        wizard's Step 7 terminal animation reads from this directly.
        Stays available after setup has ended, so a wizard that connects
        after a fast install still gets the full history; runs are
        dropped 10 minutes after they finish (then 404).
      security:
        - setupSession: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: {type: string}
        "404":
          description: Run not found or already evicted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /setup/status:
    get:
      operationId: setup.status
      tags: [setup]
      summary: Whether the server is in first-run setup mode
      description: |
        Answers without a setup session and says only what the code form
        needs. `active` is true for an install that was never set up or
        whose wizard never finished; any other install never opens setup
        mode. `code` is the state of the current setup code and `session`
        what the request's setup cookie is worth; both are left out when
        setup mode is not active.
      security: []
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: {type: boolean}
                  code:
                    type: string
                    enum: [no_code, ready, expired, locked]
                    description: "no_code: `dockmesh setup new-code` has not run; locked: 20 wrong attempts"
                  session:
                    type: string
                    enum: [none, valid, read_only, replaced]
                    description: "replaced: the code was entered in another browser, which took the session over"
  /setup/code:
    post:
      operationId: setup.code
      tags: [setup]
      summary: Enter the setup code and open the setup session
      description: |
        The code is printed by `sudo dockmesh setup new-code` on the server
        and is valid for 2 hours. Case, dashes and spaces are ignored. After
        5 wrong codes from one address the address waits 15 minutes; after
        20 wrong codes in total the code is locked until `new-code` runs
        again. A right code sets the `dm_setup` cookie (httpOnly,
        SameSite=Strict, Secure over HTTPS) and ends any earlier setup
        session. Needs the `X-Dockmesh-Setup` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: K7QD-3MXA-9PRT}
      responses:
        "204":
          description: Right code; the setup session cookie is set.
        "400":
          description: Body is not JSON.
        "401":
          description: Wrong code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCodeError"}
        "403":
          description: The X-Dockmesh-Setup header is missing or the request is cross-site.
        "409":
          description: No setup code has been created yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCodeError"}
        "410":
          description: The code expired, or setup mode is no longer active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCodeError"}
        "423":
          description: The code is locked after 20 wrong attempts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCodeError"}
        "429":
          description: Too many wrong codes from this address.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCodeError"}
components:
  schemas:
    SetupPortCheck:
      type: object
      properties:
        port: {type: integer}
        status: {type: string, enum: [ok, fail]}
        issue: {type: string, enum: [invalid, busy]}
    SetupCodeError:
      type: object
      properties:
        error: {type: string}
        code_state: {type: string, enum: [no_code, ready, expired, locked]}
        attempts_left: {type: integer, description: "wrong codes left before this address waits or the code locks"}
        retry_after_secs: {type: integer}
