paths:
  /oidc/providers:
    get:
      operationId: oidc.list_providers
      tags: [oidc]
      summary: List configured OIDC providers (includes disabled + secrets redacted)
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/OIDCProvider"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: oidc.create_provider
      tags: [oidc]
      summary: Add an OIDC provider
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCProviderInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OIDCProvider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Slug already in use.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /oidc/providers/reload:
    post:
      operationId: oidc.reload
      tags: [oidc]
      summary: Re-discover metadata for all enabled providers
      description: Forces a refresh of well-known endpoints (jwks, authorize, token URLs).
      responses:
        "200":
          description: Reload summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reloaded: {type: integer}
                  failed: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /oidc/providers/test-discovery:
    post:
      operationId: oidc.test_discovery
      tags: [oidc]
      summary: Validate an OIDC issuer URL without saving a provider
      description: |
        Fetches /.well-known/openid-configuration from the given issuer and
        verifies the `issuer` claim matches — catches typos and localhost/IP
        mismatches before the first real login attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_url]
              properties:
                issuer_url: {type: string, example: "https://login.example.com"}
      responses:
        "200":
          description: "Discovery result. `ok: false` carries the reason in `error`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  error: {type: string}
                  issuer: {type: string}
                  authorization_endpoint: {type: string}
                  token_endpoint: {type: string}
                  userinfo_endpoint: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /oidc/providers/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: oidc.update_provider
      tags: [oidc]
      summary: Update an OIDC provider
      description: Send an empty `client_secret` to keep the existing secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OIDCProviderInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OIDCProvider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: oidc.delete_provider
      tags: [oidc]
      summary: Delete an OIDC provider
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /oidc/providers/{id}/test:
    post:
      operationId: oidc.provider_test
      tags: [oidc]
      summary: Re-run discovery against a stored provider, persist result
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Result + endpoints (when ok).
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /saml/providers:
    get:
      operationId: saml.providers_list
      tags: [oidc]
      summary: Admin — list SAML providers
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
    post:
      operationId: saml.provider_create
      tags: [oidc]
      summary: Admin — create SAML provider (paste IdP metadata XML)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SAMLProviderInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /saml/providers/{id}:
    get:
      operationId: saml.provider_get
      tags: [oidc]
      summary: Admin — get one SAML provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      operationId: saml.provider_update
      tags: [oidc]
      summary: Admin — update SAML provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SAMLProviderInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    delete:
      operationId: saml.provider_delete
      tags: [oidc]
      summary: Admin — delete SAML provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "204": {description: Deleted.}
  /saml/providers/{id}/test:
    post:
      operationId: saml.provider_test
      tags: [oidc]
      summary: Re-parse stored IdP metadata + persist result
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /saml/rekey:
    get:
      operationId: saml.rekey_pending
      tags: [oidc]
      summary: Admin — accounts still waiting for their one-time SAML re-key
      description: |
        Accounts created through SAML before stable subjects may take their
        new subject once, at a sign-in from the same provider with the same
        email, until the date in `until` (30 days after the upgrade).
      responses:
        "200":
          description: Pending re-keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: {type: string}
                  until: {type: string, format: date-time, description: Latest end of the re-key window.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /saml/rekey/end:
    post:
      operationId: saml.rekey_end
      tags: [oidc]
      summary: Admin — end the one-time SAML re-key for all remaining accounts
      description: Clears every re-key mark and writes `auth.saml_rekey_end` to the audit log.
      responses:
        "200":
          description: Number of accounts whose re-key was ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ended: {type: integer, format: int64}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /ldap/providers:
    get:
      operationId: ldap.providers_list
      tags: [oidc]
      summary: Admin — list LDAP providers
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
    post:
      operationId: ldap.provider_create
      tags: [oidc]
      summary: Admin — create LDAP provider
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /ldap/providers/{id}:
    get:
      operationId: ldap.provider_get
      tags: [oidc]
      summary: Admin — get one LDAP provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      operationId: ldap.provider_update
      tags: [oidc]
      summary: Admin — update LDAP provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    delete:
      operationId: ldap.provider_delete
      tags: [oidc]
      summary: Admin — delete LDAP provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "204": {description: Deleted.}
  /ldap/providers/{id}/test:
    post:
      operationId: ldap.provider_test
      tags: [oidc]
      summary: Open connection + service bind to verify config
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /oauth2/providers:
    get:
      operationId: oauth2.providers_list
      tags: [oidc]
      summary: Admin — list OAuth2 providers
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
    post:
      operationId: oauth2.provider_create
      tags: [oidc]
      summary: Admin — create OAuth2 provider
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /oauth2/providers/{id}:
    get:
      operationId: oauth2.provider_get
      tags: [oidc]
      summary: Admin — get one OAuth2 provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    put:
      operationId: oauth2.provider_update
      tags: [oidc]
      summary: Admin — update OAuth2 provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    delete:
      operationId: oauth2.provider_delete
      tags: [oidc]
      summary: Admin — delete OAuth2 provider
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "204": {description: Deleted.}
  /oauth2/providers/{id}/test:
    post:
      operationId: oauth2.provider_test
      tags: [oidc]
      summary: Connectivity check against the userinfo URL
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
components:
  schemas:
    OIDCProvider:
      type: object
      required: [id, slug, display_name, issuer_url, client_id, default_role, enabled]
      description: Configured OIDC provider. `client_secret` is redacted.
      properties:
        id: {type: integer, format: int64}
        slug: {type: string, example: google}
        display_name: {type: string}
        issuer_url: {type: string, format: uri}
        client_id: {type: string}
        scopes: {type: string, example: "openid profile email"}
        group_claim: {type: string}
        group_mappings:
          type: array
          description: Each group in the claim that matches gives its role on its scope; with no match the default role applies on everything.
          items:
            type: object
            properties:
              group_value: {type: string}
              role_name: {type: string}
              scope: {$ref: "#/components/schemas/Scope"}
        default_role: {type: string}
        allow_email_link:
          type: boolean
          description: Attach a login to an existing account with the same email when the IdP marks the email verified. Off by default.
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SAMLProviderInput:
      type: object
      required: [slug, display_name]
      properties:
        slug: {type: string}
        display_name: {type: string}
        idp_metadata_xml:
          type: string
          description: IdP metadata XML. Required on create; empty on update keeps the stored metadata.
        nameid_format:
          type: string
          enum:
            - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
            - urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
            - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
          description: |
            NameID format requested from the IdP; the NameID keys the account
            unless `subject_attribute` is set. Empty means persistent.
            emailAddress changes when the user's email does.
        subject_attribute:
          type: string
          description: |
            Attribute whose value keys the account instead of the NameID, for
            example `http://schemas.microsoft.com/identity/claims/objectidentifier`
            for Microsoft Entra ID. Empty uses the NameID.
        username_attribute: {type: string}
        email_attribute: {type: string}
        groups_attribute: {type: string}
        default_role: {type: string}
        group_mappings:
          type: array
          description: Each matching group gives its role on its scope; with no match the default role applies on everything.
          items:
            type: object
            properties:
              group: {type: string}
              role: {type: string}
              scope: {$ref: "#/components/schemas/Scope"}
        allow_email_link: {type: boolean}
        enabled: {type: boolean}
        is_default: {type: boolean}
    OIDCProviderInput:
      type: object
      required: [slug, display_name, issuer_url, client_id, default_role]
      properties:
        slug: {type: string}
        display_name: {type: string}
        issuer_url: {type: string, format: uri}
        client_id: {type: string}
        client_secret:
          type: string
          format: password
          description: Omit / empty on update to keep the existing secret.
        scopes: {type: string}
        group_claim: {type: string}
        group_mappings:
          type: array
          description: Each group in the claim that matches gives its role on its scope; with no match the default role applies on everything.
          items:
            type: object
            properties:
              group_value: {type: string}
              role_name: {type: string}
              scope: {$ref: "#/components/schemas/Scope"}
        default_role: {type: string}
        allow_email_link:
          type: boolean
          description: Attach a login to an existing account with the same email when the IdP marks the email verified. Off by default.
        enabled: {type: boolean}
