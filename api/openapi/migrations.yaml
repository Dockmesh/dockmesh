paths:
  /migrations:
    get:
      operationId: migrations.list
      tags: [migrations]
      summary: Recent migrations across all stacks (history)
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 100}
      responses:
        "200":
          description: Migrations.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MigrationStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /migrations/active:
    get:
      operationId: migrations.active
      tags: [migrations]
      summary: Currently-running migrations
      responses:
        "200":
          description: In-flight migrations only.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MigrationStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /hosts/{id}/drain/plan:
    post:
      operationId: drain.plan
      tags: [migrations]
      summary: Dry-run a drain — list what would move and where
      description: |
        Given a set of candidate target hosts, produces a plan that maps
        each stack on the source host to a target host. Safe to call —
        does not start any migration.
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_host_ids:
                  type: array
                  items: {type: string, format: uuid}
                  description: Candidate target hosts. If omitted, all online hosts are considered.
                strategy:
                  type: string
                  enum: [least-loaded, explicit, round-robin]
                  default: least-loaded
      responses:
        "200":
          description: Plan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrainPlan"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /hosts/{id}/drain/execute:
    post:
      operationId: drain.execute
      tags: [migrations]
      summary: Start the drain — migrate stacks off the source host
      description: |
        Plans the drain again and migrates the stacks one after another.
        Every stack in the plan with hook commands needs their digest in
        `confirm_hooks` (from `entries[].hooks.digest` of the plan);
        otherwise the drain is refused (409 `hooks_unconfirmed`, listing
        those entries) and nothing runs.
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_hooks:
                  type: object
                  description: Stack name to the digest of its confirmed hook commands.
                  additionalProperties: {type: string}
      responses:
        "202":
          description: Drain accepted — poll `/hosts/{id}/drain/{drain_id}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  drain_id: {type: integer, format: int64}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Hook commands in the plan were not confirmed or changed (`code` `hooks_unconfirmed`).
          content:
            application/json:
              schema:
                type: object
                required: [error, code, entries]
                properties:
                  error: {type: string}
                  code: {type: string, enum: [hooks_unconfirmed]}
                  entries:
                    type: array
                    items: {$ref: "#/components/schemas/DrainPlanEntry"}
  /hosts/{id}/drain/{drain_id}:
    parameters:
      - $ref: "#/components/parameters/HostIDPath"
      - $ref: "#/components/parameters/DrainIDPath"
    get:
      operationId: drain.status
      tags: [migrations]
      summary: Poll drain progress
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrainStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /hosts/{id}/drain/{drain_id}/pause:
    post:
      operationId: drain.pause
      tags: [migrations]
      summary: Pause a running drain between stacks
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - $ref: "#/components/parameters/DrainIDPath"
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrainStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Drain is not in a state that can be paused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /hosts/{id}/drain/{drain_id}/resume:
    post:
      operationId: drain.resume
      tags: [migrations]
      summary: Resume a paused drain
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - $ref: "#/components/parameters/DrainIDPath"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrainStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /hosts/{id}/drain/{drain_id}/abort:
    post:
      operationId: drain.abort
      tags: [migrations]
      summary: Abort a drain; in-flight migrations are rolled back
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - $ref: "#/components/parameters/DrainIDPath"
      responses:
        "200":
          description: Aborted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrainStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  schemas:
    DrainPlan:
      type: object
      description: Map of source-host stacks to target hosts, returned by `/hosts/{id}/drain/plan`.
      required: [source_host_id, source_name, entries, feasible]
      properties:
        source_host_id: {type: string}
        source_name: {type: string}
        feasible: {type: boolean, description: Every entry is feasible.}
        entries:
          type: array
          items: {$ref: "#/components/schemas/DrainPlanEntry"}
    DrainPlanEntry:
      type: object
      required: [stack_name, target_host_id, target_name, weight_bytes, feasible]
      properties:
        stack_name: {type: string}
        target_host_id: {type: string}
        target_name: {type: string}
        weight_bytes: {type: integer, format: int64}
        feasible: {type: boolean}
        detail: {type: string}
        hooks:
          $ref: "#/components/schemas/MigrationHookCommands"
          description: Hook commands the stack's migration would run; absent when it has none.
    DrainStatus:
      type: object
      required: [id, source_host_id, status]
      properties:
        id: {type: integer, format: int64}
        source_host_id: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, running, paused, completed, failed, aborted]
        plan:
          type: array
          items: {$ref: "#/components/schemas/DrainPlanEntry"}
        progress:
          type: object
          properties:
            total: {type: integer}
            done: {type: integer}
            current_stack: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        message: {type: string}
