paths:
  /audit:
    get:
      operationId: audit.list
      tags: [audit]
      summary: Audit log entries, newest first
      description: |
        Needs Settings & audit: View on an assignment on everything; such
        callers see every entry.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 100, maximum: 1000}
        - name: action
          in: query
          schema: {type: string}
          description: Filter by action prefix (e.g. `container.`).
        - name: user_id
          in: query
          schema: {type: string}
          description: Only entries of this user (the user activity view).
        - name: category
          in: query
          schema: {type: string, enum: [changes, access, auth, system]}
          description: Only entries of this category; actions without a category count as `system`.
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /audit/retention:
    get:
      operationId: audit.retention_get
      tags: [audit]
      summary: Current retention config + preview of next prune run (P.11.13)
      responses:
        "200":
          description: Config + preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: {$ref: "#/components/schemas/AuditRetentionConfig"}
                  preview: {$ref: "#/components/schemas/AuditRetentionPreview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: audit.retention_set
      tags: [audit]
      summary: Update retention config
      description: |
        Stored in the settings table. Takes effect on the next scheduled
        run (03:00 server-local) or immediately via
        `POST /audit/retention/run`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuditRetentionConfig"}
      responses:
        "200":
          description: Updated config + fresh preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: {$ref: "#/components/schemas/AuditRetentionConfig"}
                  preview: {$ref: "#/components/schemas/AuditRetentionPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /audit/retention/run:
    post:
      operationId: audit.retention_run
      tags: [audit]
      summary: Trigger the retention job now (admin-only)
      description: |
        Runs the configured policy immediately. For `archive_local` /
        `archive_target` modes, writes the archive before pruning so a
        failure to write does not lose data. A `chain.bridge` audit
        entry is written before prune to document the transition.
      responses:
        "200":
          description: Run result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditRetentionResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502":
          description: Archive step failed (credentials, disk space, …).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /audit/webhook:
    get:
      operationId: audit.webhook_get
      tags: [audit]
      summary: Current audit-webhook config (P.11.14)
      description: The plaintext secret is never returned — the `has_secret` flag tells the UI whether one is stored.
      responses:
        "200":
          description: Config.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditWebhookConfig"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: audit.webhook_set
      tags: [audit]
      summary: Update audit-webhook config
      description: |
        URL must be http:// or https://. Empty `secret` with
        `clear_secret: false` keeps the existing secret; set
        `clear_secret: true` to wipe it. `filter_actions` accepts
        exact matches ("stack.deploy") or prefix wildcards
        ("stack.*"); empty = deliver every entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuditWebhookInput"}
      responses:
        "200":
          description: Updated config.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditWebhookConfig"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /audit/webhook/test:
    post:
      operationId: audit.webhook_test
      tags: [audit]
      summary: Send a synthetic test event to the configured URL
      description: |
        Bypasses the filter. Useful for verifying the receiver /
        HMAC signature before flipping on the live feed.
      responses:
        "200":
          description: Test dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502":
          description: Receiver rejected or was unreachable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /audit/verify:
    get:
      operationId: audit.verify
      tags: [audit]
      summary: Verify the hash chain from genesis to the latest entry
      description: |
        Re-computes each row's `row_hash` from the prior hash + canonical
        fields. A broken chain indicates tampering.
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, verified_rows]
                properties:
                  ok: {type: boolean}
                  verified_rows: {type: integer}
                  first_broken_id: {type: integer, format: int64}
                  message: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  schemas:
    AuditRetentionConfig:
      type: object
      required: [mode]
      description: Retention policy for the tamper-evident audit log (P.11.13).
      properties:
        mode:
          type: string
          enum: [forever, days, archive_local, archive_target]
          description: |
            `forever` never prunes; `days` keeps the last N days;
            `archive_local` writes older entries as NDJSON to a local
            directory before prune; `archive_target` writes them to a
            saved backup_target (SFTP/SMB/WebDAV/S3/local) before prune.
        days:
          type: integer
          minimum: 1
          description: Retention window in days (required unless mode=forever).
        target_id:
          type: integer
          format: int64
          description: backup_targets.id — required when mode=archive_target.
        local_dir:
          type: string
          description: Filesystem directory for `archive_local`. Default `./data/audit-archive`.
    AuditRetentionPreview:
      type: object
      properties:
        mode: {type: string}
        cutoff_at: {type: string, format: date-time}
        would_prune: {type: integer}
        total_rows: {type: integer}
        oldest_at: {type: string, format: date-time}
    AuditRetentionResult:
      type: object
      required: [mode, pruned, duration_ms]
      properties:
        mode: {type: string}
        cutoff_at: {type: string, format: date-time}
        pruned: {type: integer}
        archived: {type: boolean}
        archive_path: {type: string, description: "Local path or target-relative object name when archived."}
        bridge_row_id:
          type: integer
          format: int64
          description: The id of the `audit.chain_bridge` row inserted before the prune.
        duration_ms: {type: integer, format: int64}
    AuditWebhookConfig:
      type: object
      description: |
        Realtime webhook that posts every audit entry to an external URL
        (P.11.14). Payload = audit entry JSON; signed with HMAC-SHA256
        on `X-Audit-Signature` when a secret is configured.
      properties:
        url: {type: string, format: uri}
        has_secret: {type: boolean}
        filter_actions:
          type: array
          items: {type: string}
          description: Action names or prefix-wildcards (e.g. "stack.*"). Empty = deliver every entry.
    AuditWebhookInput:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri, description: "http:// or https:// — empty value disables dispatch."}
        secret:
          type: string
          format: password
          description: "HMAC shared secret. Empty on update keeps existing; use `clear_secret: true` to wipe."
        clear_secret: {type: boolean}
        filter_actions:
          type: array
          items: {type: string}
    AuditEntry:
      type: object
      required: [id, ts, action, category]
      description: |
        Tamper-evident: each row's `row_hash` chains to the previous
        entry's `prev_hash`. The genesis row anchors the chain against a
        file stored outside the DB.
      properties:
        id: {type: integer, format: int64}
        ts: {type: string, format: date-time}
        user_id: {type: string}
        username: {type: string}
        action: {type: string, example: container.start}
        category:
          type: string
          enum: [changes, access, auth, system]
          description: |
            Derived from `action`: `changes` created, changed or removed
            something; `access` read data (file browsing and reads, exec,
            backup downloads); `auth` sign-in, sessions, tokens, MFA, SSO
            and scope denials; `system` the server itself and the audit trail.
        target: {type: string}
        details: {type: string, description: JSON-encoded contextual metadata.}
        prev_hash: {type: string}
        row_hash: {type: string}
