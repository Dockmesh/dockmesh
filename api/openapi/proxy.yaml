paths:
  /proxy/status:
    get:
      operationId: proxy.status
      tags: [proxy]
      summary: Managed Caddy proxy state
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /proxy/enable:
    post:
      operationId: proxy.enable
      tags: [proxy]
      summary: Start the managed Caddy container + begin serving routes
      description: |
        Reconciles the `dockmesh-proxy` container: one created with the
        current spec (image, command, mounts) is kept and started if needed;
        an outdated or foreign one is replaced. The image is pinned by digest
        (the selected version from `/proxy/version`, or `DOCKMESH_PROXY_IMAGE`).
        Caddy resumes its last pushed config after a restart, and Dockmesh
        re-pushes the routes when the running config drifts from them.
      responses:
        "200":
          description: Enabled; the proxy state after starting.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          description: Docker unavailable — cannot start the container.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /proxy/disable:
    post:
      operationId: proxy.disable
      tags: [proxy]
      summary: Stop the embedded Caddy container
      responses:
        "204": {description: Disabled.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /proxy/routes:
    get:
      operationId: proxy.list_routes
      tags: [proxy]
      summary: List configured proxy routes
      description: |
        Callers without `proxy.update` get the values of `headers.request_set`
        and `headers.response_set` replaced by `********` and
        `access.forward_auth.url` without its query.
      responses:
        "200":
          description: Routes.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ProxyRoute"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: proxy.create_route
      tags: [proxy]
      summary: Add a new proxy route
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProxyRouteInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyRoute"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Hostname already taken by another route.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /proxy/import:
    post:
      operationId: proxy.import_caddyfile
      tags: [proxy]
      summary: Import sites from a Caddyfile
      description: |
        Converts the Caddyfile with the running Caddy's `/adapt` admin endpoint
        (the running config is not touched) and maps each site to a route with
        options. Sites whose directives all map get status `ready`; sites with
        directives that have no option get `partial` and list them in
        `unsupported`; sites that can't be imported (no reverse_proxy, a host
        that already has a route, an upstream or option that fails validation)
        get `skipped` with `error`. Without `dry_run`, every `ready` and
        `partial` site is created **disabled** and carries its `route_id`.
        A site block with several names becomes one site per name; a
        `www.<name>` block that only redirects to `<name>` becomes that site's
        `www_redirect`. `import <name>` of a snippet defined earlier in the
        same text is expanded before Caddy sees the file; imports of files or
        globs, imports with arguments, heredocs, client certificate files and `{$ENV}`
        substitution are rejected (400), as they would read files or the
        environment of the proxy container.
        Needs the proxy to be running (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caddyfile]
              properties:
                caddyfile: {type: string, maxLength: 262144}
                dry_run: {type: boolean, description: "Only report, create nothing."}
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyImportResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The proxy is not running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /proxy/routes/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: proxy.update_route
      tags: [proxy]
      summary: Update a proxy route
      description: |
        Replaces `upstream` and `tls_mode`. `enabled` and `options` are kept
        when omitted. Returns the updated route.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProxyRouteInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyRoute"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A www redirect onto a name that is a site of its own.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: proxy.delete_route
      tags: [proxy]
      summary: Remove a proxy route
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /proxy/routes/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    patch:
      operationId: proxy.set_route_enabled
      tags: [proxy]
      summary: Toggle a route's enabled flag without round-tripping upstream/tls_mode
      description: |
        Disabled routes stay in the database for editing but are
        filtered out when the Caddyfile is regenerated — traffic stops
        flowing without losing host/upstream/TLS-mode config.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "204": {description: Toggled.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /proxy/routes/{id}/config:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    get:
      operationId: proxy.route_config
      tags: [proxy]
      summary: Generated Caddy config for one site (read-only preview)
      description: |
        The Caddy JSON config Dockmesh generates for this site alone, as it
        would be served when enabled. Basic-auth password hashes are replaced
        by `REDACTED`, secret header values and the forward-auth query by
        `********` for every caller; the admin section is left out. `blocked` is true when
        the stored route fails validation and is not served. For callers
        without `proxy.update` the config is built with header values masked
        and the forward-auth URL's query removed, as in the route list.
      responses:
        "200":
          description: Preview.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxySitePreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /proxy/routes/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    get:
      operationId: proxy.route_metrics
      tags: [proxy]
      summary: Current Caddy metrics for one route
      description: |
        Returns the per-host slice of the latest metrics snapshot for
        the route's host. Cheaper than `/proxy/metrics` when only one
        row is being refreshed (expanded-route panel, etc.). Empty
        counters when Caddy hasn't scraped yet or the host has no
        traffic since the last scrape.
      responses:
        "200":
          description: Per-route metrics snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: {type: string}
                  requests: {type: integer}
                  requests_per_second: {type: number}
                  status_buckets:
                    type: object
                    additionalProperties: {type: integer}
                  p95_latency_ms: {type: number}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: route not found}
  /proxy/version:
    get:
      operationId: proxy.version
      tags: [proxy]
      summary: Running Caddy version and the tested versions to switch to
      description: Without `proxy.update`, `image` is empty while a custom image runs.
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyVersionInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      operationId: proxy.set_version
      tags: [proxy]
      summary: Switch Caddy to another tested version
      description: |
        Only versions listed in `available` are accepted. While the proxy runs,
        the container is recreated with the new image and must load the current
        config; if it doesn't, the previous image is started again and 502 is
        returned. The image of the version left behind is kept for a rollback,
        older tested images are removed. While the proxy is off only the
        selection is stored; 409 when the proxy is switched on but its container
        isn't running yet, and while `DOCKMESH_PROXY_IMAGE` is set. The switch
        finishes even when the client disconnects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, example: 2.11.7}
      responses:
        "200":
          description: Switched.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyVersionInfo"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Version management is read-only (`DOCKMESH_PROXY_IMAGE` set), or the proxy should run but isn't running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The new version did not come up with the config. It was rolled back, or the error says that starting the previous version failed too.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /proxy/version/rollback:
    post:
      operationId: proxy.rollback_version
      tags: [proxy]
      summary: Switch back to the Caddy version before the last switch
      description: Same checks and automatic rollback as `PUT /proxy/version`; 400 when there is no previous version.
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxyVersionInfo"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Version management is read-only (`DOCKMESH_PROXY_IMAGE` set), or the proxy should run but isn't running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The previous version did not come up with the config; the current one runs again.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /proxy/settings:
    get:
      operationId: proxy.settings
      tags: [proxy]
      summary: Proxy-wide options (ACME account, CA, trusted proxies)
      description: Without `proxy.update` the ACME email is returned as `***@<domain>`.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxySettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      operationId: proxy.update_settings
      tags: [proxy]
      summary: Store and apply the proxy-wide options
      description: Replaces all three fields; the config is pushed to Caddy right away when the proxy runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProxySettings"}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProxySettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /proxy/metrics:
    get:
      operationId: proxy.metrics
      tags: [proxy]
      summary: Per-host request rate, status-code distribution, p95 latency
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /proxy/acme-events:
    get:
      operationId: proxy.acme_events
      tags: [proxy]
      summary: Recent ACME issuance / renewal events parsed from Caddy logs
      responses:
        "200":
          description: Events newest last.
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
components:
  schemas:
    ProxyStatus:
      type: object
      required: [enabled, running, admin_ok]
      properties:
        enabled: {type: boolean, description: Dockmesh manages and pushes config to the proxy.}
        running: {type: boolean}
        admin_ok: {type: boolean, description: Caddy's admin API answers.}
        version: {type: string, description: Server header reported by Caddy.}
        container: {type: string, description: Short container ID.}
    ProxyVersionInfo:
      type: object
      required: [current, image, default, available, managed]
      properties:
        current: {type: string, description: Running tested version; empty when a custom image runs.}
        image: {type: string}
        default: {type: string, description: Version new installs and unpinned servers run.}
        previous: {type: string, description: Version a rollback goes back to.}
        available:
          type: array
          description: Caddy versions tested with this Dockmesh release, oldest first, pinned by digest.
          items:
            type: object
            required: [version, image]
            properties:
              version: {type: string}
              image: {type: string}
        managed: {type: boolean}
        read_only_reason: {type: string, description: Set when `managed` is false.}
    ProxySettings:
      type: object
      properties:
        acme_email:
          type: string
          description: Account email for certificate expiry notices. Required for ZeroSSL.
        acme_ca:
          type: string
          enum: ["", letsencrypt_staging, zerossl]
          description: Empty is Let's Encrypt. Applies to sites with tls_mode auto.
        trusted_proxies:
          type: string
          enum: ["", cloudflare]
          description: "`cloudflare` takes the client address from the CF-Connecting-IP header on requests from Cloudflare's published edge ranges; IP filters and logs then see the visitor, not Cloudflare."
    ProxyRoute:
      type: object
      required: [id, host, upstream, tls_mode, enabled]
      properties:
        id: {type: integer, format: int64}
        host: {type: string, example: app.example.com}
        upstream:
          type: string
          description: Dial address `host:port` the proxy forwards to, e.g. `127.0.0.1:8080`.
        tls_mode:
          type: string
          enum: [auto, internal, none]
          description: "`auto` gets a certificate via ACME, `internal` uses Caddy's own CA, `none` serves plain HTTP on port 80 only (no certificate, no redirect)."
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        cert_issuer: {type: string}
        cert_valid_from: {type: string, format: date-time}
        cert_valid_to: {type: string, format: date-time}
        cert_days_left: {type: integer}
        options: {$ref: "#/components/schemas/ProxySiteOptions"}
    ProxyRouteInput:
      type: object
      required: [upstream]
      properties:
        host:
          type: string
          description: Required on create; ignored on update. A domain name (optionally `*.` wildcard) or a non-loopback IP; `localhost`, `*.localhost`, loopback addresses and a bare `*` are rejected (400).
        upstream:
          type: string
          description: |
            `host:port` with a hostname or IP and a port from 1 to 65535. Schemes,
            paths, placeholders and unix sockets are rejected (400), as is the
            proxy's own admin API (port 2019 on a loopback address or any name).
            Stored routes that fail these checks are not served, raise an admin
            notice, and can't be re-enabled until edited.
        tls_mode:
          type: string
          enum: [auto, internal, none]
          description: Defaults to `auto` on create.
        enabled: {type: boolean}
        options:
          allOf:
            - $ref: "#/components/schemas/ProxySiteOptions"
          description: |
            Per-site options. Omitted on update: the stored options are kept.
            Sent: they replace the stored options and fields left out take their
            default. A basic-auth user sent without `password` keeps the stored
            password of the same username. A secret header sent with an empty
            `value` keeps the stored value of the same name in the same list,
            and a forward-auth `url` without a query keeps the stored query
            while it points at the same scheme and host (400 otherwise; send the
            query again or set `clear_query`). Invalid options are rejected with 400
            naming the field (`options.<section>.<field>: ...`); a www redirect
            onto a name that is a site of its own is rejected with 409.
    ProxySitePreview:
      type: object
      required: [route_id, enabled, blocked, config]
      properties:
        route_id: {type: integer, format: int64}
        enabled: {type: boolean}
        blocked: {type: boolean}
        config:
          type: object
          additionalProperties: true
          description: Caddy JSON config (`apps.http`, `apps.tls`) for this site.
    ProxySiteOptions:
      type: object
      description: |
        Structured per-site proxy options. Every field defaults to Caddy's
        behaviour, so an empty object serves the site as a plain reverse proxy
        with HTTP redirected to HTTPS. Values are never passed to Caddy as raw
        directives; strings containing `{`, `}` or control characters are
        rejected.
      properties:
        routing:
          type: object
          properties:
            extra_upstreams:
              type: array
              maxItems: 16
              items: {type: string}
              description: More `host:port` upstreams load-balanced with `upstream`; same rules as `upstream`.
            lb_policy:
              type: string
              enum: ["", round_robin, least_conn, first, client_ip_hash]
              description: Empty is Caddy's default (random).
            health_path:
              type: string
              description: Path for active health checks of every upstream, e.g. `/health`. Empty disables them.
            www_redirect:
              type: boolean
              description: Also serve `www.<host>` with a permanent redirect to `<host>`. Not allowed for wildcard, IP or `www.` hosts.
        https:
          type: object
          properties:
            allow_http:
              type: boolean
              description: Serve a TLS site on plain HTTP too instead of redirecting HTTP to HTTPS.
            hsts:
              type: boolean
              description: "Send `Strict-Transport-Security: max-age=31536000`. Needs `tls_mode` auto or internal."
        performance:
          type: object
          properties:
            flush_immediately:
              type: boolean
              description: Pass each chunk of the response on at once (`flush_interval -1`), for SSE, live logs and streaming downloads.
            buffer_requests:
              type: boolean
              description: Buffer up to 4 MiB of the request body before sending it upstream. Off (default) streams uploads.
            dial_timeout: {type: string, example: 30s, description: "Connect timeout, Go duration from 1s to 168h. Empty: Caddy default."}
            read_timeout: {type: string, example: 1h, description: "Upstream read timeout, Go duration from 1s to 168h. Empty: no limit."}
            write_timeout: {type: string, example: 1h, description: "Upstream write timeout, Go duration from 1s to 168h. Empty: no limit."}
            max_body_bytes:
              type: integer
              format: int64
              minimum: 0
              description: Largest request body accepted (413 above it). 0 means no limit.
            stream_close_delay:
              type: string
              example: 5m
              description: Keep WebSockets and other streams open this long after a config reload. Empty closes them on reload.
            compression: {type: boolean, description: Compress responses with zstd or gzip.}
        access:
          type: object
          properties:
            basic_auth:
              type: array
              maxItems: 32
              items:
                type: object
                required: [username]
                properties:
                  username: {type: string, maxLength: 64}
                  password:
                    type: string
                    writeOnly: true
                    minLength: 8
                    maxLength: 72
                    description: Stored as a bcrypt hash; never returned.
            ip_mode:
              type: string
              enum: ["", allow, deny]
              description: "`allow` answers 403 to clients outside `ip_ranges`, `deny` to clients inside. Uses the client address after trusted proxies."
            ip_ranges:
              type: array
              maxItems: 256
              items: {type: string, example: 198.51.100.0/24}
              description: IP addresses or CIDR ranges, stored in CIDR form.
            forward_auth:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: http://authelia:9091/api/verify?rd=https://auth.example.org
                  description: Auth service URL; a 2xx answer lets the request through, any other answer is returned to the client. Responses never include the query, since it can carry a token.
                query_set:
                  type: boolean
                  readOnly: true
                  description: The stored URL has a query.
                clear_query:
                  type: boolean
                  writeOnly: true
                  description: Drop the stored query when `url` is sent without one.
                copy_headers:
                  type: array
                  items: {type: string}
                  description: Headers copied from the auth answer onto the request, e.g. `Remote-User`.
        headers:
          type: object
          properties:
            security:
              type: boolean
              description: "Adds `X-Content-Type-Options: nosniff`, `X-Frame-Options: SAMEORIGIN` and `Referrer-Policy: strict-origin-when-cross-origin`."
            request_set:
              type: array
              items: {$ref: "#/components/schemas/ProxyHeader"}
            request_remove:
              type: array
              items: {type: string}
            response_set:
              type: array
              items: {$ref: "#/components/schemas/ProxyHeader"}
            response_remove:
              type: array
              items: {type: string}
        logs:
          type: object
          properties:
            access_log:
              type: boolean
              description: Write an access log line per request of this site to the proxy container's log.
    ProxyImportResult:
      type: object
      required: [sites, global_unsupported, warnings]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [host, upstream, tls_mode, options, status, unsupported]
            properties:
              host: {type: string}
              upstream: {type: string}
              tls_mode: {type: string, enum: [auto, internal, none]}
              options: {$ref: "#/components/schemas/ProxySiteOptions"}
              status: {type: string, enum: [ready, partial, skipped]}
              unsupported:
                type: array
                items: {type: string}
                description: Directives of this site that were not imported.
              error: {type: string, description: Why a skipped site was not imported.}
              route_id: {type: integer, format: int64, description: Set when the site was created (disabled).}
        global_unsupported:
          type: array
          items: {type: string}
          description: Global options and other parts of the file that apply to no single site and were not imported.
        warnings:
          type: array
          items: {type: string}
          description: Caddy's adapter warnings.
    ProxyHeader:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value:
          type: string
          maxLength: 4096
          description: Empty in responses for secret headers. Callers without `proxy.update` get `********` for every header.
        secret:
          type: boolean
          description: Write-only value, e.g. an `Authorization` header to the upstream. Also hidden from the config preview.
        value_set:
          type: boolean
          readOnly: true
          description: A secret header has a stored value.
