paths:
  /hosts/tags/all:
    get:
      operationId: host_tags.all
      tags: [host-tags]
      summary: Global distinct set of tags across all hosts
      description: Used by the UI chip-input to autocomplete existing tags.
      responses:
        "200":
          description: Tag list.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /hosts/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/HostIDPath"
    get:
      operationId: host_tags.list
      tags: [host-tags]
      summary: Tags assigned to one host
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      operationId: host_tags.set
      tags: [host-tags]
      summary: Replace the full tag list for a host
      description: |
        Canonicalises the input (lowercase, dedupes) and validates the
        `[a-z0-9][a-z0-9-]{0,31}` per-tag syntax. Max 20 tags per host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: The canonicalised tag list that was stored.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: Too many tags (max 20).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      operationId: host_tags.add
      tags: [host-tags]
      summary: Add a single tag to a host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: {type: string, example: prod}
      responses:
        "200":
          description: Updated tag list.
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /hosts/{id}/tags/{tag}:
    delete:
      operationId: host_tags.remove
      tags: [host-tags]
      summary: Remove one tag from a host
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - name: tag
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
