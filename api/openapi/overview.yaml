paths:
  /attention:
    get:
      operationId: attention.list
      tags: [overview]
      summary: What needs attention in the caller's scope
      description: |
        Aggregates, from existing state: offline hosts (`hosts.view`),
        restarting, unhealthy and non-zero exited containers
        (`containers.view`), the failed last run of each enabled backup job
        (`backups.view`), proxy certificates expiring within 30 days
        (`proxy.view`), firing alerts (`alerts.view`) and the caller's open
        action-required notices, plus agents on a different build than the
        server (`hosts.view`) and image updates (`images.view`) as `info`.
        A firing alert is left out when another source lists the same
        problem for the same object. A source is skipped when the caller
        lacks its permission, and items outside the caller's host or role
        scope are left out; scoped callers see no alerts of the kinds that
        belong to no host (backups, certificates), as in the alert history.
        Any authenticated caller may call this. Sorted by severity, then
        newest first; items without `since` come last within their
        severity.
      responses:
        "200":
          description: Items, most severe first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AttentionItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  schemas:
    AttentionItem:
      type: object
      required: [id, kind, severity, title, link, object]
      properties:
        id: {type: string, description: "Stable per condition, e.g. `backup_failed:3`."}
        kind:
          type: string
          enum: [host_offline, agent_outdated, container_restarting, container_unhealthy, container_exited, backup_failed, alert_firing, image_update, cert_expiring, notice]
        severity: {type: string, enum: [critical, warning, info]}
        title: {type: string}
        detail: {type: string, description: One line of context.}
        link: {type: string, description: "In-app path, e.g. /hosts/abc or /containers/123?host=abc."}
        object:
          type: object
          required: [type, id]
          properties:
            type: {type: string, enum: [host, container, mount, backup_job, image, proxy_route, domain, notice]}
            id: {type: string}
            name: {type: string}
            host_id: {type: string}
        since: {type: string, format: date-time, description: When the condition started or was last observed; absent when unknown.}
