          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      operationId: ldap.provider_update
      tags: [oidc]
      summary: Admin — update LDAP provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: ldap.provider_delete
      tags: [oidc]
      summary: Admin — delete LDAP provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Deleted. }

  /ldap/providers/{id}/test:
    post:
      operationId: ldap.provider_test
