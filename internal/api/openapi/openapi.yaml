openapi: 3.1.0
info:
  title: Dockmesh API
  summary: Container management platform — HTTP API
  description: |
    REST API for Dockmesh. All endpoints are versioned under `/api/v1`.

    ## Authentication

    Two bearer-token flavours are accepted on the `Authorization` header:

    - **User JWTs** — obtained via `POST /auth/login`, short-lived (15 min),
      refreshable via `POST /auth/refresh`. Use for interactive UI / CLI sessions.
    - **API tokens** — prefix `dmt_`, long-lived, created under
      Settings → API Tokens. Use for CI, scripts, external integrations.

    Both share the same permission model — a token's role dictates what it can do.

    ## Versioning

    Version `v1` is stable in the sense that we don't remove fields or change
    response shapes without warning. New fields may be added at any time, so
    clients should ignore unknown fields gracefully.

    ## Errors

    Non-2xx responses use a uniform shape: `{"error": "<human-readable message>"}`.
    HTTP status carries the category (400/401/403/404/409/500).

    ## Maintenance

    This spec is hand-maintained. `TestOpenAPIDriftAgainstRoutes` compares the
    registered chi routes against the operations declared here and fails CI on
    mismatch — so every PR that touches a route must also touch this file.
  version: "1.0.0"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Dockmesh
    url: https://dockmesh.dev

servers:
  - url: /api/v1
    description: Relative path — served by the same process that renders the UI.

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login, logout, refresh, MFA, OIDC redirects.
  - name: health
    description: Liveness + readiness.
  - name: users
    description: Local-user CRUD, scope-tag assignment, password reset.
  - name: roles
    description: Custom role definitions and permission grants.
  - name: oidc
    description: OpenID Connect provider configuration.
  - name: api-tokens
    description: Long-lived bearer tokens for CI / scripts.
  - name: hosts
    description: Local daemon + remote agents (read-only host inventory).
  - name: host-tags
    description: Free-form host tagging used for RBAC + scope filtering.
  - name: agents
    description: Remote-agent enrollment and revocation.
  - name: containers
    description: Docker container lifecycle — list, inspect, start/stop/restart/pause/kill, logs, stats, exec.
  - name: stacks
    description: Compose-stack CRUD and deploy/stop/status.
  - name: images
    description: Image list, pull (with registry-auth), remove, prune.
  - name: volumes
    description: Volume CRUD, prune, content browse (P.11.8).
  - name: networks
    description: Network list and inspect.
  - name: registries
    description: Stored registry credentials (P.11.7), test-login.
  - name: backups
    description: Backup jobs, runs, targets, scheduling.
  - name: alerts
    description: Alert rules, channels, history.
  - name: audit
    description: Tamper-evident audit log readout.
  - name: metrics
    description: Historical per-container metrics + the Prometheus /metrics endpoint.
  - name: settings
    description: Server-wide runtime settings (DB-backed).
  - name: global-env
    description: Shared environment variables available to all stacks.
  - name: migrations
    description: Cross-host stack migration + drain (P.9 / P.10).
  - name: proxy
    description: Embedded Caddy reverse-proxy configuration.
  - name: templates
    description: Stack templates with parameter substitution (P.11.12) — built-in library + user-created.
  - name: secrets
    description: age-encrypted secrets service state.
  - name: overview
    description: Aggregated views for the overview page.

paths:
  # -----------------------------------------------------------------------
  # setup — install wizard (P.14). Public; runs before auth exists.
  # -----------------------------------------------------------------------
  /setup/preflight:
    get:
      operationId: setup.preflight
      tags: [setup]
      summary: Host + Docker preflight checks for the wizard's first page
      security: []
      responses:
        "200":
          description: Preflight snapshot with one row per check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, description: "true when no check is fail" }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        value: { type: string }
                        status: { type: string, enum: [ok, warn, fail] }
                        message: { type: string }
                        hint: { type: string }

  /setup/server-info:
    get:
      operationId: setup.server_info
      tags: [setup]
      summary: Top-bar facts (version · os · ip · docker)
      description: Polled by the wizard top-bar every ~10s while setup is open.
      security: []
      responses:
        "200":
          description: Server info snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  os: { type: string }
                  ip: { type: string }
                  docker_version: { type: string }
                  uptime_secs: { type: integer }

  /setup/validate-data-dir:
    post:
      operationId: setup.validate_data_dir
      tags: [setup]
      summary: Live-validate Step 2's data-directory input
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "403": { description: "Missing the `X-Dockmesh-Setup` header." }
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  exists: { type: boolean }
                  is_dir: { type: boolean }
                  writable: { type: boolean }
                  will_create: { type: boolean }
                  total_bytes: { type: integer, format: int64 }
                  free_bytes: { type: integer, format: int64 }
                  parent_exists: { type: boolean }
                  parent_writable: { type: boolean }
                  status: { type: string, enum: [ok, warn, fail] }
                  message: { type: string }
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /setup/validate-user:
    post:
      operationId: setup.validate_user
      tags: [setup]
      summary: Validate Step 3's service-user choice
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, username]
              properties:
                mode: { type: string, enum: [existing, create] }
                username: { type: string }
      responses:
        "403": { description: "Missing the `X-Dockmesh-Setup` header." }
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  exists: { type: boolean }
                  uid: { type: string }
                  gid: { type: string }
                  home_dir: { type: string }
                  in_docker_group: { type: boolean }
                  status: { type: string, enum: [ok, warn, fail] }
                  message: { type: string }
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /setup/test-url:
    post:
      operationId: setup.test_url
      tags: [setup]
      summary: Reachability probe for Step 5's public URL
      description: |
        Connects only to public addresses and to this server's own LAN
        addresses on the port it is served on, 80 or 443. Loopback,
        link-local, cloud metadata, NAT64 and other private addresses
        are refused after DNS resolution and on every redirect hop; the
        result is then `status: fail` with a "not tested" message.
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                expect_health: { type: boolean }
      responses:
        "403": { description: "Missing the `X-Dockmesh-Setup` header." }
        "200":
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  reachable: { type: boolean }
                  latency_ms: { type: integer }
                  status: { type: string, enum: [ok, warn, fail] }
                  message: { type: string }
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /setup/commit:
    post:
      operationId: setup.commit
      tags: [setup]
      summary: Run the install with the wizard-collected config
      description: |
        Returns 202 Accepted with a `run_id`. The actual install runs
        in the background; subscribe to `/setup/stream/{run_id}` (SSE)
        to read each step's status as it happens. Only one install runs
        at a time. The service user is added to the `docker` group only
        when the wizard creates it (`mode: create`); existing accounts
        are never changed.
      security: []
      parameters:
        - $ref: "#/components/parameters/SetupHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_dir, service_user, admin, public_url]
              properties:
                data_dir: { type: string }
                service_user:
                  type: object
                  required: [mode, username]
                  properties:
                    mode: { type: string, enum: [existing, create] }
                    username: { type: string }
                    add_to_docker_group: { type: boolean }
                admin:
                  type: object
                  required: [username, password]
                  properties:
                    username: { type: string }
                    email: { type: string }
                    password: { type: string }
                public_url: { type: string, format: uri }
      responses:
        "403": { description: "Missing the `X-Dockmesh-Setup` header." }
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  stream_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            Another install is already running or has just finished, or an
            account that can administer Dockmesh already exists (setup then
            closes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Setup window expired or setup already complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /setup/restore:
    post:
      operationId: setup.restore
      tags: [setup]
      summary: Restore a system backup instead of setting up a new install
      description: |
        Only while setup mode is active. Takes a system backup archive
        (`file`) and, for an archive encrypted by the original install,
        the backup key file exported there (`key`, from
        `GET /system/backup-key/export`). The archive is extracted next to
        the live files and checked (database opens and migrates, an admin
        exists); then setup mode ends and the server restarts, swapping the
        restored files in before it opens the database. Sign in with an
        account of the restored install afterwards. The service manager
        has to restart the process (exit code 75).

        Requests must carry `X-Dockmesh-Setup: 1`; browsers only send it
        from a same-origin page, so another site can't post a backup here.
        Archives may unpack to at most 8 GiB / 200,000 entries.
      security: []
      parameters:
        - name: X-Dockmesh-Setup
          in: header
          required: true
          schema: { type: string, enum: ["1"] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: System backup (.tar.gz or .tar.gz.age), up to 1 GiB. }
                key: { type: string, format: binary, description: Exported backup key file; needed for encrypted archives. }
      responses:
        "202":
          description: Staged; the server restarts now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarting: { type: boolean }
                  counts: { type: object }
                  sanity: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: The X-Dockmesh-Setup header is missing or the request is cross-site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Another restore is being staged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Setup mode is not active or its window expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { description: Archive larger than 1 GiB, or it unpacks to more than the limit. }
        "422":
          description: Encrypted without a matching key, or the backup failed the restore checks (`sanity` lists them).
          content:
            application/json:
              schema: { type: object }

  /setup/stream/{run_id}:
    get:
      operationId: setup.stream
      tags: [setup]
      summary: Server-Sent Events stream of install steps
      description: |
        SSE stream — `event: line` frames carry one `Event` JSON per
        install step (timestamp, step id, message, status). When the
        runner finishes, an `event: end` frame closes the stream. The
        wizard's Step 7 terminal animation reads from this directly.
      security: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          description: Run not found or already evicted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /setup/status:
    get:
      operationId: setup.status
      tags: [setup]
      summary: Whether the server is in first-run setup mode
      description: |
        Returns `active: true` when the server has no admin user and
        the install wizard is the only thing that should be reachable.
        The wizard frontend polls this on every page load to decide
        whether to redirect to the dashboard once setup is complete.

        `expired: true` means the 30-minute setup window passed without
        the wizard being completed — the operator restarts the service
        to get a fresh window. Refusing to seed admins past the window
        is a Portainer-style drive-by protection.
      security: []
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [active, started_at, expires_at, expired, window_secs]
                properties:
                  active: { type: boolean }
                  started_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  expired: { type: boolean }
                  window_secs: { type: integer }

  # -----------------------------------------------------------------------
  # auth — session flow, MFA, OIDC redirects
  # -----------------------------------------------------------------------
  /auth/login:
    post:
      operationId: auth.login
      tags: [auth]
      summary: Log in with username + password
      description: |
        Exchanges a username + password for a session. If the user has MFA
        enabled, the response contains `mfa_required: true` and an
        `mfa_token` — clients must then call `POST /auth/mfa` with the
        token plus the 6-digit code to finish the login.

        Failed attempts are limited per account: 10 failures within 15
        minutes block the username for 15 minutes, whether or not it exists
        and independent of the lockout policy. Wrong codes at
        `POST /auth/mfa` count toward the same limit. Per client IP (IPv6 by
        /64) the limit is 100 failures within 15 minutes, blocking for 15
        minutes. A successful login clears the account counter, never the IP
        one. Each block that starts is written to the audit log as
        `auth.lockout`. A 429 response includes `Retry-After`.

        The lockout policy (`/auth/policy`) additionally locks an existing
        account after its configured number of failures; that answers 423.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 256, example: admin }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login succeeded. For MFA users, `mfa_required=true` and the client must complete `/auth/mfa`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Account locked by the lockout policy.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Too many failed attempts for this account (10 per 15 minutes) or
            from this IP (100 per 15 minutes).
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the block expires.

  /auth/logout:
    post:
      operationId: auth.logout
      tags: [auth]
      summary: Invalidate a refresh token
      description: Revokes the refresh token's entire session family. Idempotent.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out. }

  /auth/refresh:
    post:
      operationId: auth.refresh
      tags: [auth]
      summary: Rotate an access token
      description: |
        Exchanges a refresh token for a fresh access+refresh pair. Refresh
        tokens are rotated on every use. Reusing a previously-rotated token
        revokes the whole session family. Invalid tokens are rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Invalid, expired, or reused refresh token. A refresh token issued
            before the per-purpose token keys returns `code: session_outdated`
            so clients can tell the user they were signed out by an update.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [session_outdated] }
        "429":
          description: Too many invalid refresh tokens from this IP (300 per 5 minutes).
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/sso/exchange:
    post:
      operationId: auth.ssoExchange
      tags: [auth]
      summary: Exchange an SSO one-time code for a session
      description: |
        Final step of OIDC, OAuth2 and SAML sign-in. The callback redirects
        to `/login?sso_code=...` and sets an httpOnly cookie with the same
        code; this call needs both. A code works once and expires after
        60 seconds, so a code from a link someone else sends signs nobody in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Session tokens and user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unknown, expired, already used code, or the cookie is missing or does not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/mfa:
    post:
      operationId: auth.login_mfa
      tags: [auth]
      summary: Complete a two-factor login
      description: |
        Second step of the login flow when the user has MFA enabled.
        Accepts a 6-digit TOTP code or a recovery code. Each TOTP code is
        accepted once. Wrong codes count as failed logins of the account:
        they raise the lockout-policy counter and the per-account limit of
        `POST /auth/login` (10 per 15 minutes), and the counters are only
        reset once this step succeeds. Per client IP, 20 wrong codes within
        15 minutes block for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token:
                  type: string
                  description: Short-lived token issued by `/auth/login` when MFA is required.
                code:
                  type: string
                  description: 6-digit TOTP or a recovery code.
                  example: "123456"
      responses:
        "200":
          description: MFA succeeded — session issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid or expired MFA token / code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Account locked by the lockout policy.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts for this account or wrong codes from this IP.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oidc/providers:
    get:
      operationId: auth.oidc_providers
      tags: [auth]
      summary: List SSO providers available on the login screen
      description: Public — used by the login page to render SSO buttons.
      security: []
      responses:
        "200":
          description: Enabled OIDC providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [slug, display_name]
                  properties:
                    slug: { type: string, example: google }
                    display_name: { type: string, example: Sign in with Google }

  /auth/oidc/{slug}/login:
    get:
      operationId: auth.oidc_login
      tags: [auth]
      summary: Start an OIDC authorization flow
      description: Redirects to the provider's authorization URL with a signed state cookie.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to provider.
          headers:
            Location:
              schema: { type: string, format: uri }
        "503":
          description: OIDC is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oidc/{slug}/callback:
    get:
      operationId: auth.oidc_callback
      tags: [auth]
      summary: Consume the OIDC callback and mint a Dockmesh session
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to `/login?sso_code=...`; the SPA exchanges the one-time code at `/auth/sso/exchange`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: State mismatch or code exchange failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mfa/enroll/start:
    post:
      operationId: auth.mfa_enroll_start
      tags: [auth]
      summary: Begin TOTP enrollment for the current user
      description: |
        Generates a fresh TOTP secret and returns the QR URL. The secret is
        NOT active until `/mfa/enroll/verify` succeeds.
      responses:
        "200":
          description: Enrollment in progress.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret: { type: string, description: Base32-encoded TOTP secret. }
                  otpauth_url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: MFA already enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mfa/enroll/verify:
    post:
      operationId: auth.mfa_enroll_verify
      tags: [auth]
      summary: Finalise TOTP enrollment and reveal recovery codes
      description: |
        Validates the first 6-digit code. On success, activates MFA and
        returns single-use recovery codes — shown ONCE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: MFA active. Recovery codes shown once only.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mfa:
    delete:
      operationId: auth.mfa_disable
      tags: [auth]
      summary: Disable MFA for the current user
      description: |
        Requires a current TOTP code or an unused recovery code. An
        enrollment that was started but never verified is cleared without a
        code. Successful and failed attempts are audited.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: TOTP code or recovery code. }
      responses:
        "204": { description: MFA disabled. }
        "400":
          description: Missing or invalid code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many wrong codes (5 per 15 minutes per user); see Retry-After.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # sessions — list / revoke own login sessions (P.12.1)
  # -----------------------------------------------------------------------
  /sessions:
    get:
      operationId: auth.sessions_list
      tags: [auth]
      summary: List the caller's own login sessions
      description: |
        Returns every session family-id the current user owns with
        user_agent + IP + created_at + expires_at + revoked_at. No
        cross-user view — admins see only their own, not everyone's.
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{family_id}:
    delete:
      operationId: auth.sessions_revoke
      tags: [auth]
      summary: Revoke one of the caller's sessions
      description: |
        Idempotent — calling on an already-revoked session returns 404 so
        callers can distinguish "not mine" from "already done" without
        leaking which case it was. Revoking the current session logs
        the caller out on the next refresh.
      parameters:
        - name: family_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Session not found or not owned by the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # auth/policy — password complexity + lockout + rotation (P.12.1)
  # -----------------------------------------------------------------------
  /auth/policy:
    get:
      operationId: auth.policy_get
      tags: [auth]
      summary: Current password + lockout + rotation policy
      description: Admin-only. The numbers themselves hint at the deployment's hardening level.
      responses:
        "200":
          description: Policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: auth.policy_set
      tags: [auth]
      summary: Update password / lockout / rotation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordPolicy" }
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}/unlock:
    post:
      operationId: users.unlock
      tags: [users]
      summary: "Admin: clear a user's lockout state"
      description: |
        After too many failed logins a user's account is locked. This
        endpoint clears the lockout, the failed-attempts counter and the
        per-account login limit so they can log in again. Admin-only —
        call after verifying via another channel that the real user is
        who asked for the unlock.
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "204": { description: Unlocked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # hosts — inventory of the local daemon + registered agents
  # -----------------------------------------------------------------------
  /hosts:
    get:
      operationId: hosts.list
      tags: [hosts]
      summary: List all hosts visible to the caller
      description: |
        Returns the local docker daemon plus every registered agent (online
        or offline), decorated with host tags. Scoped users (P.11.3) see
        only hosts whose tags match their scope.
      responses:
        "200":
          description: Host list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HostInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -----------------------------------------------------------------------
  # host-tags — free-form host tagging
  # -----------------------------------------------------------------------
  /hosts/tags/all:
    get:
      operationId: host_tags.all
      tags: [host-tags]
      summary: Global distinct set of tags across all hosts
      description: Used by the UI chip-input to autocomplete existing tags.
      responses:
        "200":
          description: Tag list.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /hosts/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/HostIDPath"
    get:
      operationId: host_tags.list
      tags: [host-tags]
      summary: Tags assigned to one host
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: host_tags.set
      tags: [host-tags]
      summary: Replace the full tag list for a host
      description: |
        Canonicalises the input (lowercase, dedupes) and validates the
        `[a-z0-9][a-z0-9-]{0,31}` per-tag syntax. Max 20 tags per host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The canonicalised tag list that was stored.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Too many tags (max 20).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: host_tags.add
      tags: [host-tags]
      summary: Add a single tag to a host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: { type: string, example: prod }
      responses:
        "200":
          description: Updated tag list.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /hosts/{id}/tags/{tag}:
    delete:
      operationId: host_tags.remove
      tags: [host-tags]
      summary: Remove one tag from a host
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - name: tag
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -----------------------------------------------------------------------
  # agents — remote-host lifecycle (enroll, list, revoke, self-upgrade)
  # -----------------------------------------------------------------------
  /agents:
    get:
      operationId: agents.list
      tags: [agents]
      summary: List all registered remote agents
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: agents.create
      tags: [agents]
      summary: Register a new agent and issue a one-time install token
      description: |
        Allocates the agent row in `pending` state and returns a one-time
        enrollment token the admin pastes into the agent host's install
        command. The plaintext token is shown ONCE — lose it and you
        revoke + recreate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: prod-01 }
      responses:
        "201":
          description: Agent registered; install hint returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCreateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Name already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: agents.get
      tags: [agents]
      summary: Inspect one agent
      responses:
        "200":
          description: Agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: agents.delete
      tags: [agents]
      summary: Revoke an agent
      description: |
        Removes the DB row. The agent's client cert is no longer recognised
        by the mTLS listener on the next reconnect. Host tags are dropped
        automatically.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/upgrade:
    post:
      operationId: agents.upgrade
      tags: [agents]
      summary: Trigger a self-upgrade on a connected agent
      description: |
        The agent downloads a fresh `dockmesh-agent-linux-<arch>` binary
        from the agent listener over mTLS (agents older than this release
        use the server's `/install/` path), verifies it against the SHA-256
        sent over the mTLS channel and restarts its systemd unit. Agent
        must be currently connected. Automatic upgrades back off after
        three attempts per target binary; this endpoint always dispatches.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Upgrade dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: upgrading }
                  version: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Agent is too old to self-upgrade; re-run the installer once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Agent is not currently connected, or no agent binary for its architecture is bundled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{id}/rotate-token:
    post:
      operationId: agents.rotate_enroll_token
      tags: [agents]
      summary: Rotate the enrollment token of an existing agent
      description: |
        Generates a new enrollment token (the previous one stops working)
        with the configured lifetime. Running the returned install command
        re-enrolls the host under the same ID: stacks, tags and backup jobs
        stay attached; when the new enrollment completes the old client
        cert stops working and its live session is closed. Requires
        `hosts.create` and host scope for the host, for pending and enrolled
        hosts alike. Revoked hosts return 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: New enrollment token and install command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCreateResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/upgrade-policy:
    get:
      operationId: agents.upgrade_policy_get
      tags: [agents]
      summary: Current fleet-wide upgrade policy + snapshot (P.11.16)
      responses:
        "200":
          description: Policy + fleet snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradePolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: agents.upgrade_policy_set
      tags: [agents]
      summary: Update the fleet-wide upgrade mode
      description: |
        `auto` pushes FrameReqAgentUpgrade to every drifted agent on
        every evaluation (60s tick). `staged` upgrades N% of drifted
        agents per tick so an incompatible binary can't take down
        the whole fleet at once. `manual` (default) only upgrades
        when the admin hits the per-agent Upgrade button.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpgradeInput" }
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradePolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /agents/upgrade-policy/run:
    post:
      operationId: agents.upgrade_policy_run
      tags: [agents]
      summary: Force one evaluation pass now (no waiting for the 60s tick)
      responses:
        "200":
          description: Evaluation completed; snapshot reflects any just-dispatched upgrades.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpgradePolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /agents/enroll:
    post:
      operationId: agents.enroll
      tags: [agents]
      summary: "Public: swap a one-time token for an agent client cert (legacy)"
      description: |
        Kept for agents installed by older installers. Current agents enroll
        at `/enroll` on the agent listener (the `enroll_url` of
        `AgentCreateResult`), where the TLS chain is signed by the pinned
        agents CA. There is NO Bearer auth on this route — the one-time
        token IS the authentication. Tokens are single-use and expire.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEnrollRequest" }
      responses:
        "200":
          description: Enrollment successful — cert issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnrollResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid, expired or already-used token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # containers — lifecycle, logs, stats, exec (WS endpoints live separately)
  # -----------------------------------------------------------------------
  /containers:
    get:
      operationId: containers.list
      tags: [containers]
      summary: List containers across one or all hosts
      description: |
        Fan-out capable via `?host=all`. Each row is a Docker SDK
        `Container` summary plus `host_id` / `host_name` when fanning out.
      parameters:
        - $ref: "#/components/parameters/HostQuery"
        - name: all
          in: query
          schema: { type: boolean, default: false }
          description: Include stopped containers.
      responses:
        "200":
          description: Container list. Shape differs between single-host (array) and fan-out (FanOutResponse).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/Container" }
                  - $ref: "#/components/schemas/FanOutResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Docker daemon is unreachable on the target host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /containers/summary:
    get:
      operationId: containers.summary
      tags: [containers]
      summary: Aggregated container counts + per-stack rollup
      description: |
        Server-side aggregation of container state used by the dashboard's
        auto-refresh — cuts a ~15 KB full-list response down to ~1 KB of
        counts. Fan-out capable via `?host=all`: merges per-host rollups
        into a single summary.
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Summary snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:     { type: integer }
                  running:   { type: integer }
                  stopped:   { type: integer }
                  unhealthy: { type: integer }
                  by_stack:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total:     { type: integer }
                        running:   { type: integer }
                        unhealthy: { type: integer }
                        hosts:     { type: array, items: { type: string } }
                        services:  { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Docker daemon is unreachable on the target host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /containers/{id}:
    parameters:
      - $ref: "#/components/parameters/ContainerIDPath"
      - $ref: "#/components/parameters/HostQuery"
    get:
      operationId: containers.inspect
      tags: [containers]
      summary: Inspect one container
      description: The container must be within the caller's host scope and role scope (403 otherwise).
      responses:
        "200":
          description: Full container inspect response from the Docker daemon.
          content:
            application/json:
              schema: { type: object, description: Passthrough of the Docker SDK container.InspectResponse. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: containers.remove
      tags: [containers]
      summary: Remove a container
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Kill running containers before removing.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/start:
    post:
      operationId: containers.start
      tags: [containers]
      summary: Start a container
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "204": { description: Started. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/stop:
    post:
      operationId: containers.stop
      tags: [containers]
      summary: Stop a container (SIGTERM, then SIGKILL after timeout)
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/restart:
    post:
      operationId: containers.restart
      tags: [containers]
      summary: Restart a container
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "204": { description: Restarted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/pause:
    post:
      operationId: containers.pause
      tags: [containers]
      summary: Freeze all processes via the cgroup freezer
      description: |
        Pauses the container without losing state — useful for incident
        inspection. Unpause with `/containers/{id}/unpause`. P.11.4.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "204": { description: Paused. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/unpause:
    post:
      operationId: containers.unpause
      tags: [containers]
      summary: Resume a paused container
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "204": { description: Resumed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/kill:
    post:
      operationId: containers.kill
      tags: [containers]
      summary: Send a signal to a container
      description: |
        Default signal is SIGKILL. Accepts any signal name Docker accepts
        (SIGTERM, SIGHUP, SIGUSR1, …) in the request body. P.11.4.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signal: { type: string, example: SIGTERM, default: SIGKILL }
      responses:
        "204": { description: Signal sent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/update:
    post:
      operationId: containers.update
      tags: [containers]
      summary: Pull a newer image tag and recreate the container
      description: |
        Pulls the container's image tag and, when it resolves to a new
        image, replaces the container. A container that belongs to a
        managed stack is rebuilt from the stack's compose.yaml (all
        replicas of its service) and the change is recorded in the stack's
        deploy history; other containers are rebuilt from their own config.
        Volumes, including anonymous ones, are carried over. The old
        container is only removed once the new one is running; on failure
        the old one is restored and the old image stays tagged as the
        rollback target. Older rollback tags beyond the configured count
        (`DOCKMESH_UPDATE_ROLLBACK_KEEP`, default 3) are pruned.
        Because a stack container is rebuilt from compose.yaml, updating
        one also needs `stacks.deploy`.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
      responses:
        "200":
          description: Update complete, or `updated=false` when already up to date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerUpdateResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An update of this container or its stack is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Pull or swap failed; the previous container is kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /containers/{id}/rollback:
    post:
      operationId: containers.rollback
      tags: [containers]
      summary: Roll a container back to its previous image
      description: |
        Recreates the container from the rollback tag stored in the given
        update-history entry of this container, with the same swap and volume handling as
        `/containers/{id}/update`. Stack containers keep their compose.yaml
        config; the stack's deploy history notes that the next deploy uses
        the image compose.yaml names again.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [history_id]
              properties:
                history_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerUpdateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already rolled back, the rollback image was pruned or removed, or an update of this container or its stack is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /containers/{id}/update-info:
    get:
      operationId: containers.update_info
      tags: [containers]
      summary: Check whether a newer image is available for this container
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
      responses:
        "200":
          description: Update availability — registry/release metadata for the container's image.
          content:
            application/json:
              schema:
                type: object
                required: [image]
                properties:
                  image: { type: string }
                  current_digest: { type: string }
                  current_created: { type: string, format: date-time }
                  local_size: { type: integer, format: int64 }
                  remote_last_updated: { type: string, format: date-time }
                  remote_size: { type: integer, format: int64 }
                  docker_hub_url: { type: string, format: uri }
                  github_url: { type: string, format: uri }
                  latest_release:
                    type: object
                    properties:
                      tag: { type: string }
                      name: { type: string }
                      url: { type: string, format: uri }
                      body: { type: string }
                      published: { type: string, format: date-time }
                  warnings:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/update-history:
    get:
      operationId: containers.update_history
      tags: [containers]
      summary: List prior image updates for this container
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
      responses:
        "200":
          description: Update history entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    old_image: { type: string }
                    new_image: { type: string }
                    updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # stacks — compose-file CRUD, deploy/stop, status, scaling, migration
  # -----------------------------------------------------------------------
  /stacks:
    get:
      operationId: stacks.list
      tags: [stacks]
      summary: List all stacks known to the filesystem
      description: Enriched with deployment info (host + status) when deployed.
      responses:
        "200":
          description: Stacks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StackListEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: stacks.create
      tags: [stacks]
      summary: Create a new stack (compose.yaml + optional .env)
      description: |
        Writes the stack to the filesystem under `<stacks_root>/<name>/`.
        Name must match `[a-z0-9][a-z0-9-]*[a-z0-9]` (2..63 chars, not a
        reserved word). `.env` is encrypted at rest via the age key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A stack with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/discovered:
    get:
      operationId: stacks.discovered
      tags: [stacks]
      summary: List compose projects running without a managed stack
      description: |
        Scans all running containers on the target host for the
        `com.docker.compose.project` label and returns projects that are
        not already tracked by dockmesh. These are candidates for
        `POST /stacks/adopt`.
      parameters:
        - name: host
          in: query
          description: Target host ID. Defaults to the local host.
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Discovered unmanaged compose projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoveredStack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stacks/adopt:
    post:
      operationId: stacks.adopt
      tags: [stacks]
      summary: Adopt a running compose project into dockmesh's management
      description: |
        Takes an existing running compose project (typically started via
        plain `docker compose up`) and hands its management over to
        dockmesh — writes compose.yaml + optional supporting files to
        `<stacks_root>/<name>/`, binds the running containers via their
        `com.docker.compose.project` label, and records the adoption in
        the audit log. **Does not stop, recreate, or otherwise modify
        the running containers.** The next explicit deploy is the only
        operation that might trigger container recreation, and that is
        gated by the client and shown in the `drift_services` field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackAdoptInput" }
      responses:
        "201":
          description: Adopted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackAdoptResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A stack with this name is already managed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            Adoption rejected by server-side validator. Typically:
            no running containers with this project label on the target
            host, service names in the compose don't match the running
            state, or the bundle tarball is malformed / too large.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
    get:
      operationId: stacks.get
      tags: [stacks]
      summary: Fetch compose.yaml + .env for one stack
      responses:
        "200":
          description: Detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: stacks.update
      tags: [stacks]
      summary: Update compose.yaml and/or .env for an existing stack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: stacks.delete
      tags: [stacks]
      summary: Remove a stack's files, optionally cleaning up docker resources
      description: |
        Removes `compose.yaml` from disk. Without any cleanup flags,
        containers / networks / volumes / images keep running (they can
        be re-adopted later). With the cleanup flags the caller chooses
        per-category what else to remove — volumes and images are opt-in
        because they cause data loss or re-pull cost respectively.

        Safety: external volumes are never removed; images still used by
        containers outside this project are skipped.
      parameters:
        - in: query
          name: force
          required: false
          schema: { type: boolean, default: false }
          description: Delete anyway when other stacks depend on this one (purges their edges).
        - in: query
          name: stop
          required: false
          schema: { type: boolean, default: false }
          description: Stop and remove the stack's containers before deleting the files.
        - in: query
          name: networks
          required: false
          schema: { type: boolean, default: false }
          description: Remove project-scoped networks (`com.docker.compose.project=<name>`).
        - in: query
          name: volumes
          required: false
          schema: { type: boolean, default: false }
          description: Remove project-scoped volumes. External volumes are skipped. Data loss is unrecoverable.
        - in: query
          name: images
          required: false
          schema: { type: boolean, default: false }
          description: Remove images used by this project. Skips images still referenced by other projects.
      responses:
        "200":
          description: Deleted with cleanup result (only when cleanup flags are set).
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleanup: { $ref: "#/components/schemas/StackCleanupResult" }
                  cleanup_error: { type: string }
        "204": { description: Deleted (files only, no cleanup requested). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stack has dependents; re-send with `?force=true` to override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/recover:
    post:
      operationId: stacks.recover
      tags: [stacks]
      summary: Reconstruct compose.yaml from running containers
      description: |
        When a stack's compose.yaml is missing or empty on disk but
        containers carrying the project label are still running (e.g.
        after a Docker reset wiped the stacks dir but kept the data
        volume), this endpoint inspects the live containers and writes
        a best-effort compose.yaml back to disk.

        Non-destructive: containers are not touched. The reconstructed
        YAML is returned in the response with a list of warnings the
        operator should review before redeploying. Anything Docker's
        inspect data can't represent (comments, x-* extensions, build:,
        secrets:, configs:) shows up as a warning rather than a silent
        loss.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      responses:
        "200":
          description: Compose reconstructed and written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack: { $ref: "#/components/schemas/StackDetail" }
                  warnings:
                    type: array
                    items: { type: string }
                  recovered_from:
                    type: object
                    properties:
                      host_id: { type: string }
                      container_count: { type: integer }
                      reconstructed_at: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No running containers carry the project label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Could not reconstruct compose from inspect data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/discard:
    post:
      operationId: stacks.discard
      tags: [stacks]
      summary: Drop a ghost stack record without touching containers
      description: |
        Removes the deployment row + dependency edges for a stack whose
        compose file is gone from disk. Running containers are not
        touched — use this when the operator decides the stack should
        be forgotten by dockmesh but the workload should keep running
        (or will be cleaned up via `docker` directly).
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      responses:
        "204": { description: Discarded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stacks/{name}/cleanup-preview:
    get:
      operationId: stacks.cleanup_preview
      tags: [stacks]
      summary: List project-scoped docker resources that Delete would touch
      description: |
        Read-only enumeration of the networks / volumes / images that
        `DELETE /stacks/{name}` would remove if called with the matching
        cleanup flags. External volumes and shared images are already
        filtered out of the plan. Used by the UI to render an informed
        confirmation dialog before the user commits.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      responses:
        "200":
          description: Plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackCleanupPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: Cleanup is not supported for this stack's host yet (e.g. remote agents).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/deploy:
    post:
      operationId: stacks.deploy
      tags: [stacks]
      summary: Deploy a stack onto a target host
      description: |
        Ships the compose + env to the target host and runs `docker compose
        up -d` via the embedded compose executor. On a fresh deploy the
        deployment record is created; on an existing one, containers are
        updated in place.

        When `?environment=<name>` is supplied (P.12.8), Dockmesh merges
        `compose.yaml` with `compose.<name>.yaml` via the compose-spec
        multi-file overlay rules and deploys the merged result. Without
        the query param, falls back to `active_environment` in
        `.dockmesh.meta.json`; without that, deploys the base compose.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - $ref: "#/components/parameters/HostQuery"
        - in: query
          name: environment
          required: false
          schema: { type: string }
          description: Optional overlay name — overrides the stack's default `active_environment`.
        - $ref: "#/components/parameters/ConfirmExternalQuery"
      responses:
        "200":
          description: Deploy result with created/updated/unchanged services.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StackModifiedOutside" }
        "422":
          description: Compose validation failed — see message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/deployments:
    get:
      operationId: stacks.deployments_list
      tags: [stacks]
      summary: Past deploys of this stack (P.12.6)
      description: |
        Newest first. Each successful deploy creates one row. Compose YAML
        is NOT included in list responses — fetch a specific entry via
        `GET /deployments/{id}` to see the full snapshot.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: History entries (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeployHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stacks/{name}/deployments/{id}:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: stacks.deployment_get
      tags: [stacks]
      summary: Full snapshot of a single past deploy, including compose YAML
      responses:
        "200":
          description: History entry with compose_yaml populated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/deployments/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
      - $ref: "#/components/parameters/HostQuery"
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: stacks.deployment_rollback
      tags: [stacks]
      summary: Roll back the stack to a specific past deploy (P.12.6)
      description: |
        Overwrites `compose.yaml` with the snapshot from the given history
        row and re-runs Deploy. Env is deliberately kept as-is so current
        secrets aren't clobbered. The rollback itself becomes a new
        history row tagged "rollback to #ID".
      parameters:
        - $ref: "#/components/parameters/ConfirmExternalQuery"
      responses:
        "200":
          description: Rollback completed.
          content:
            application/json:
              schema:
                type: object
                required: [rolled_back_to, result]
                properties:
                  rolled_back_to:   { type: integer, format: int64 }
                  deployed_at_orig: { type: string, format: date-time }
                  result:           { $ref: "#/components/schemas/DeployResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StackModifiedOutside" }
        "500":
          description: Redeploy failed — the compose.yaml has already been swapped, inspect and retry or roll forward.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/dependencies:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
    get:
      operationId: stacks.dependencies_get
      tags: [stacks]
      summary: Direct deps + reverse deps for this stack (P.12.7)
      description: |
        `depends_on` is what this stack needs up before it can deploy.
        `dependents` is what will break if this stack goes down.
      responses:
        "200":
          description: Dependency state.
          content:
            application/json:
              schema:
                type: object
                required: [stack_name, depends_on, dependents]
                properties:
                  stack_name: { type: string }
                  depends_on:
                    type: array
                    items: { type: string }
                  dependents:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: stacks.dependencies_set
      tags: [stacks]
      summary: Replace the dependency list for this stack (P.12.7)
      description: |
        Replaces the full `depends_on` set. Cycle detection runs against
        the post-write graph — a request that would close a loop returns
        422. Unknown stack names are allowed (you can declare edges before
        the depending stacks exist); they fail at deploy time, not at
        declaration time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depends_on]
              properties:
                depends_on:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated dependency list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack_name: { type: string }
                  depends_on:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Request would create a dependency cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/environments:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
    get:
      operationId: stacks.environments_list
      tags: [stacks]
      summary: Available compose overlay files + active default (P.12.8)
      description: |
        Discovers every `compose.<name>.yaml` overlay next to the base
        `compose.yaml` in the stack directory, plus the
        `active_environment` from `.dockmesh.meta.json` if set.
      responses:
        "200":
          description: Environment state for this stack.
          content:
            application/json:
              schema:
                type: object
                required: [stack_name, available]
                properties:
                  stack_name: { type: string }
                  active:
                    type: string
                    description: Currently-active overlay name (empty means the base compose is used as-is).
                  available:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/environments/active:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
    put:
      operationId: stacks.environment_set_active
      tags: [stacks]
      summary: Set the default environment overlay for this stack (P.12.8)
      description: |
        Writes `active_environment` into `.dockmesh.meta.json`. Empty
        string clears the default. Subsequent deploys without an
        explicit `?environment=` query param use this value.

        The name is validated against the filesystem-safe pattern
        (lowercase letters, digits, `-`, `_`) but NOT checked against
        existing overlay files — git-synced stacks often have the meta
        file update arrive before the overlay file lands in the same
        sync cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: string }
      responses:
        "200":
          description: Updated active environment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack_name: { type: string }
                  active:     { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/stop:
    post:
      operationId: stacks.stop
      tags: [stacks]
      summary: Stop a deployed stack (docker compose down without -v)
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/status:
    get:
      operationId: stacks.status
      tags: [stacks]
      summary: Current per-service status on the deployed host
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: One row per service.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    service: { type: string }
                    container_id: { type: string }
                    state: { type: string, enum: [running, exited, paused, restarting, dead, created] }
                    status: { type: string }
                    image: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/scale:
    get:
      operationId: stacks.scale_overview
      tags: [stacks]
      summary: Replica count per service
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Scale snapshot per service.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    service: { type: string }
                    replicas: { type: integer }
                    desired: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/services/{service}/scale:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
      - $ref: "#/components/parameters/ServicePath"
      - $ref: "#/components/parameters/HostQuery"
    get:
      operationId: stacks.scale_check
      tags: [stacks]
      summary: Pre-flight check before scaling a service
      description: Returns a list of blockers (container_name, hard ports, singleton volumes) that would prevent the scale, or an empty list if safe.
      responses:
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  safe: { type: boolean }
                  blockers:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: stacks.scale_set
      tags: [stacks]
      summary: Scale a single service to N replicas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas]
              properties:
                replicas: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Scale result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  replicas: { type: integer }
                  created: { type: array, items: { type: string } }
                  removed: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Scale blocked by a safety check (singleton port/volume).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/services/{service}/rolling-update:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
      - $ref: "#/components/parameters/ServicePath"
      - $ref: "#/components/parameters/HostQuery"
    post:
      operationId: stacks.rolling_update
      tags: [stacks]
      summary: Roll every replica of a service onto the current compose image (P.12.5b)
      description: |
        Replaces replicas in parallelism-sized batches. Each new replica is
        gated behind a healthcheck wait (P.12.5a). Body fields override the
        service's compose `deploy.update_config`; omitted fields fall back to
        compose and then to engine defaults (parallelism=1, order=stop-first,
        failure_action=pause).

        Rolling on a remote host is **not yet supported** — remote hosts
        return 500 with a clear message until the agent protocol carries the
        matching frame type. Run the stack on the dockmesh server host to
        use this endpoint.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollingUpdateRequest" }
      responses:
        "200":
          description: Rolling update result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollingUpdateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: Rollout paused or failed. When the engine produced a partial result it is returned inside `result`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:  { type: string }
                  result: { $ref: "#/components/schemas/RollingUpdateResult" }

  /stacks/{name}/scaling-rules:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
    get:
      operationId: stacks.scaling_rules_get
      tags: [stacks]
      summary: Auto-scaling rules configured for this stack (P.8)
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScalingRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: stacks.scaling_rules_set
      tags: [stacks]
      summary: Replace the auto-scaling rule set for this stack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items: { $ref: "#/components/schemas/ScalingRule" }
      responses:
        "200":
          description: Stored rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScalingRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: stacks.scaling_rules_clear
      tags: [stacks]
      summary: Remove all auto-scaling rules for this stack
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stacks/{name}/migrate:
    post:
      operationId: stacks.migrate
      tags: [stacks, migrations]
      summary: Start a cross-host migration (P.9)
      description: |
        Snapshots volumes on the source host, ships them over the agent
        mTLS tunnel to the target host, deploys the stack there, and
        finally stops the source containers. The source files are kept
        for rollback until `/migrate/{id}/source` is called.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_host_id]
              properties:
                target_host_id: { type: string, format: uuid }
                include_volumes: { type: boolean, default: true }
      responses:
        "202":
          description: Migration accepted — poll `/migrate/{id}` for progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration_id: { type: integer, format: int64 }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The stack uses named volumes. Volume data can't be transferred
            yet, so the migration is refused instead of starting the stack
            with empty volumes on the target. Preflight reports the same
            as the failing `named_volumes` check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/migrate/preflight:
    post:
      operationId: stacks.migrate_preflight
      tags: [stacks, migrations]
      summary: Dry-run migration check — returns blockers without starting
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_host_id]
              properties:
                target_host_id: { type: string, format: uuid }
      responses:
        "200":
          description: Preflight result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  safe: { type: boolean }
                  blockers:
                    type: array
                    items: { type: string }
                  volumes:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size_bytes: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/migrate/{id}:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: Migration id returned by `/stacks/{name}/migrate`.
    get:
      operationId: stacks.migrate_status
      tags: [stacks, migrations]
      summary: Poll a running migration
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stacks/{name}/migrate/{id}/rollback:
    post:
      operationId: stacks.migrate_rollback
      tags: [stacks, migrations]
      summary: Roll back a migration (restart source, drop target)
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Migration in a state that cannot be rolled back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/from-git:
    post:
      operationId: stacks.create_from_git
      tags: [stacks]
      summary: Create a new stack from a git repository in one shot
      description: |
        Configures the git source and runs the initial sync, which
        creates the stack directory on disk from the repo contents.
        Returns the saved git source plus the sync result + drift report.
        On a failed initial sync the row is still saved (HTTP 422) so the
        caller can fix credentials and retry without re-entering everything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, git]
              properties:
                name: { type: string, description: "Stack name (kebab-case)." }
                git:  { $ref: "#/components/schemas/StackGitSourceInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422":
          description: Row saved but initial sync failed (e.g. bad credentials).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stacks/{name}/git:
    parameters:
      - $ref: "#/components/parameters/StackNamePath"
    get:
      operationId: stacks.git_get
      tags: [stacks]
      summary: Inspect the git source configured for a stack (P.11.11)
      responses:
        "200":
          description: Git source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackGitSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No git source configured for this stack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: stacks.git_configure
      tags: [stacks]
      summary: Configure / update the git source and do an initial sync
      description: |
        Upsert semantics: creates the source on first call, updates on
        subsequent. Always kicks off an initial sync so the stack FS is
        populated — the response includes a `sync` or `sync_error` field.
        Passwords / SSH keys are age-encrypted at rest; leave those fields
        empty on update to keep the existing values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackGitSourceInput" }
      responses:
        "200":
          description: Configured. The sync result is embedded inline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { $ref: "#/components/schemas/StackGitSource" }
                  sync: { $ref: "#/components/schemas/StackGitSyncResult" }
                  sync_error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: stacks.git_disconnect
      tags: [stacks]
      summary: Disconnect the stack from its git source
      description: Does NOT delete the stack's compose.yaml — only the sync config + the clone cache.
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No git source configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/git/sync:
    post:
      operationId: stacks.git_sync
      tags: [stacks]
      summary: Manually pull the latest compose.yaml from the git source
      description: |
        Pulls the configured branch, copies compose.yaml (+ optional .env)
        into the stack FS, and if the source has `auto_deploy: true` AND
        the SHA changed, kicks off a deploy of the stack as well.

        If the stack's compose.yaml or .env changed outside Dockmesh, the
        new commit is not copied (409) until a deploy with
        `confirm_external=1` accepts the changes.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackGitSyncResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No git source configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/StackModifiedOutside" }
        "502":
          description: "Sync failed — see message (auth rejected, branch not found, compose missing in repo, …)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/git/webhook:
    post:
      operationId: stacks.git_webhook
      tags: [stacks]
      summary: "Public: provider-triggered sync (GitHub / GitLab / Gitea)"
      description: |
        Public endpoint — no Bearer auth, since GitHub / GitLab / Gitea
        can't send Authorization headers. The source must have a
        `webhook_secret`, and the request must carry a matching signature:

        * **GitHub** / **Gitea** — `X-Hub-Signature-256` / `X-Gitea-Signature` (`sha256=<hex>`)
        * **GitLab** — plain shared secret on `X-Gitlab-Token`

        Without a secret the webhook is disabled; polling and manual sync
        keep working. Returns 202 on success; the sync runs in the
        background, detached from the request, so providers don't time out
        on slow clones. Syncs of one stack run one at a time, and deliveries
        arriving during a sync are merged into a single follow-up sync.
      security: []
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific push payload (ignored — only used for signature verification).
      responses:
        "202":
          description: Sync queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "sync queued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Webhook rejected — unknown stack or no git source, no webhook secret set, or signature mismatch. The reasons share one response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stacks/{name}/migrate/{id}/source:
    delete:
      operationId: stacks.migrate_finalize
      tags: [stacks, migrations]
      summary: Finalise a successful migration (remove source files + volumes)
      description: |
        Called by the operator once they've verified the target is healthy.
        Removes the source host's stack files and (optionally) volumes,
        giving up the rollback option.
      parameters:
        - $ref: "#/components/parameters/StackNamePath"
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Source cleaned up. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # images — list, pull (with registry-auth), remove, prune, CVE scan
  # -----------------------------------------------------------------------
  /images:
    get:
      operationId: images.list
      tags: [images]
      summary: List images on one or all hosts
      parameters:
        - $ref: "#/components/parameters/HostQuery"
        - name: all
          in: query
          schema: { type: boolean, default: false }
          description: Include intermediate / dangling image layers.
      responses:
        "200":
          description: Image list (passthrough of Docker SDK image.Summary plus host_id/host_name in fan-out mode).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object }
                  - $ref: "#/components/schemas/FanOutResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /images/updates:
    get:
      operationId: images.updates
      tags: [images]
      summary: Map of cached image-update availability
      description: |
        Returns the snapshot of the background update watcher: for every
        image reference a running container on the local host used in the
        last 30 days, whether a newer manifest is available upstream.
        Refreshed every 30 minutes and kept across restarts. Private
        images are checked with the matching registry credential. Images
        without a registry digest (built or loaded locally) report an
        `error` instead of an update. Map key is the normalized image ref
        (e.g. `nginx:1.27`).
      responses:
        "200":
          description: Update info per image ref.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    image: { type: string }
                    update_available: { type: boolean }
                    local_digest: { type: string }
                    remote_digest: { type: string }
                    checked_at: { type: string, format: date-time }
                    error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /images/pull:
    post:
      operationId: images.pull
      tags: [images]
      summary: Pull an image (streams progress as ndjson)
      description: |
        Streams Docker's pull-progress lines as `application/x-ndjson`.
        Registry credentials from Settings → Registries (P.11.7) are
        applied automatically based on the image reference. Only hits
        the central server's local daemon; agent-side pulls with creds
        are tracked as P.12.28.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, example: "ghcr.io/foo/bar:tag" }
      responses:
        "200":
          description: Streaming ndjson of progress frames.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON — one progress frame per line.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Docker daemon unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /images/{id}:
    get:
      operationId: images.inspect
      tags: [images]
      summary: Inspect an image
      description: |
        Returns the full Docker `ImageInspect` payload (RepoTags, RepoDigests,
        Config, RootFS layers, Architecture, Os, Created, Size, Labels, …).
        Remote agents currently respond 501 — image inspect is not yet
        carried over the agent protocol.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Image id (sha256:…) or repo:tag.
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Docker ImageInspect.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: Inspect not yet supported on this host (remote agent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: images.remove
      tags: [images]
      summary: Remove an image
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Image id or name:tag.
        - $ref: "#/components/parameters/HostQuery"
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of layers / references deleted.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Image is in use by a container.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /images/prune:
    post:
      operationId: images.prune
      tags: [images]
      summary: Remove dangling images
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Prune report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  space_reclaimed: { type: integer, format: int64 }
                  images_deleted:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /images/{id}/scan:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Image id or name:tag.
    post:
      operationId: images.scan_start
      tags: [images]
      summary: Kick off a Grype vulnerability scan
      responses:
        "202":
          description: Scan queued — poll `GET /images/{id}/scan` for results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Scanner is disabled (grype not installed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: images.scan_result
      tags: [images]
      summary: Fetch the latest scan result for an image
      responses:
        "200":
          description: "Scan summary, or just {\"scanned\": false} when the image has not been scanned yet."
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned: { type: boolean, description: Present and false only when no scan exists. }
                  image: { type: string }
                  scanned_at: { type: string, format: date-time }
                  critical: { type: integer }
                  high: { type: integer }
                  medium: { type: integer }
                  low: { type: integer }
                  negligible: { type: integer }
                  vulnerabilities:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -----------------------------------------------------------------------
  # volumes — CRUD + prune + content browse (P.11.8)
  # -----------------------------------------------------------------------
  /volumes:
    get:
      operationId: volumes.list
      tags: [volumes]
      summary: List volumes (fan-out capable)
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Volume list.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object }
                  - $ref: "#/components/schemas/FanOutResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: volumes.create
      tags: [volumes]
      summary: Create a volume on the central daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                driver: { type: string, default: local }
                labels:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /volumes/prune:
    post:
      operationId: volumes.prune
      tags: [volumes]
      summary: Remove unused volumes
      responses:
        "200":
          description: Prune report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  space_reclaimed: { type: integer, format: int64 }
                  volumes_deleted:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /volumes/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/HostQuery"
    get:
      operationId: volumes.inspect
      tags: [volumes]
      summary: Inspect one volume
      responses:
        "200":
          description: Volume.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: volumes.remove
      tags: [volumes]
      summary: Remove a volume (must be unused unless forced)
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Volume is in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /volumes/{name}/browse:
    get:
      operationId: volumes.browse
      tags: [volumes]
      summary: List one directory level inside a volume (P.11.8)
      description: Admin-only; every call is audited. Read-only.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/HostQuery"
        - name: path
          in: query
          schema: { type: string, default: "/" }
          description: Path relative to the volume root.
      responses:
        "200":
          description: Directory entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VolumeEntry" }
        "400":
          description: |
            Path leaves the volume root (`..` or a symlink pointing outside
            the volume), is too long, or is not a directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Volume driver doesn't expose a host-filesystem mountpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /volumes/{name}/browse/file:
    get:
      operationId: volumes.browse_file
      tags: [volumes]
      summary: Read a single file inside a volume, capped at 1 MiB
      description: |
        Returns up to 1 MiB of content. `truncated: true` signals the file
        is larger — the UI then offers a download link instead of an inline
        preview. `binary: true` is set when a NUL byte is found in the
        first 8 KiB (same heuristic git uses).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/HostQuery"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFileResult" }
        "400":
          description: |
            `path` is missing, leaves the volume root (`..` or a symlink
            pointing outside the volume), is too long, or is not a regular file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Volume driver doesn't expose a host-filesystem mountpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # networks — CRUD + topology view + prune
  # -----------------------------------------------------------------------
  /networks:
    get:
      operationId: networks.list
      tags: [networks]
      summary: List networks (fan-out capable)
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Networks.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object }
                  - $ref: "#/components/schemas/FanOutResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: networks.create
      tags: [networks]
      summary: Create a network on the central daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                driver: { type: string, default: bridge }
                labels:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /networks/prune:
    post:
      operationId: networks.prune
      tags: [networks]
      summary: Remove unused networks
      responses:
        "200":
          description: Prune report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks_deleted:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /networks/topology:
    get:
      operationId: networks.topology
      tags: [networks]
      summary: Network → containers graph for the topology view
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Nodes + edges ready for the d3 force graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        driver: { type: string }
                        containers:
                          type: array
                          items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /networks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/HostQuery"
    get:
      operationId: networks.inspect
      tags: [networks]
      summary: Inspect one network
      responses:
        "200":
          description: Network.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: networks.remove
      tags: [networks]
      summary: Remove a network
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Network still has active endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # backups — jobs, runs, targets (P.3.4)
  # -----------------------------------------------------------------------
  /backups/jobs:
    get:
      operationId: backups.list_jobs
      tags: [backups]
      summary: List all backup jobs
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: backups.create_job
      tags: [backups]
      summary: Create a new backup job
      description: >-
        Jobs with a `system` source are admin-only (`system.update` with no
        host or role scope); other jobs need their host, before and after
        the change, in the caller's scope (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupJobInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backups/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    get:
      operationId: backups.get_job
      tags: [backups]
      summary: Inspect one backup job
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: backups.update_job
      tags: [backups]
      summary: Update a backup job
      description: >-
        Same access rules as create. Target secrets sent empty keep the
        stored value; changing the server, URL or user while keeping a
        stored secret returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupJobInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: backups.delete_job
      tags: [backups]
      summary: Delete a backup job (does not delete existing runs)
      description: >-
        Jobs with a `system` source are admin-only (`system.update` with no
        host or role scope); other jobs need their host in the caller's
        scope (403).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/jobs/{id}/review/{mode}:
    post:
      operationId: backups.acknowledge_review
      tags: [backups]
      summary: Acknowledge a needs_review backup job
      description: |
        Clears the `needs_review` flag on a backup job that was
        auto-created by an older dockmesh version. Mode `keep`
        preserves the job's current enabled state; mode `disable`
        also flips `enabled = false` so the scheduler stops firing
        it. Idempotent: clearing an already-cleared flag is a no-op.
        Jobs with a `system` source are admin-only; other jobs need
        their host in the caller's scope (403).
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
        - in: path
          name: mode
          required: true
          schema:
            type: string
            enum: [keep, disable]
      responses:
        "204": { description: Acknowledged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/jobs/{id}/accept-host-key:
    post:
      operationId: backups.accept_host_key
      tags: [backups]
      summary: Trust the changed SFTP host key a job last saw
      description: |
        SFTP jobs record the server's host key on their first connection
        and fail when it later changes; the new key is kept as
        `target_config.host_key_pending`. This moves it to `host_key`.

        Jobs with a `system` source are admin-only (`system.update` with no
        host or role scope); other jobs need their host in the caller's
        scope (403).
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "204": { description: Accepted; the next run uses the new key. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No changed host key is waiting for approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/jobs/{id}/run:
    post:
      operationId: backups.run_job
      tags: [backups]
      summary: Trigger a job to run immediately
      description: >-
        Jobs with a `system` source are admin-only (`system.update` with no
        host or role scope); other jobs need their host in the caller's
        scope (403).
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "202":
          description: Run started in the background (status `running`); poll `/backups/runs/{id}` for the outcome. The run is not tied to this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Job is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/schedule:
    get:
      operationId: backups.schedule_info
      tags: [backups]
      summary: Time zone backup schedules are evaluated in
      description: Set with the `backups.timezone` setting (IANA name); empty means the server's time zone.
      responses:
        "200":
          description: Scheduler time zone.
          content:
            application/json:
              schema:
                type: object
                required: [timezone, source, server_timezone]
                properties:
                  timezone: { type: string, example: Europe/Berlin }
                  source: { type: string, enum: [setting, server] }
                  server_timezone: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /backups/runs:
    get:
      operationId: backups.list_runs
      tags: [backups]
      summary: Recent backup runs, newest first
      parameters:
        - name: job_id
          in: query
          schema: { type: integer, format: int64 }
          description: Optional filter to one job's runs.
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /backups/runs/{id}/restore-stack:
    post:
      operationId: backups.restore_stack
      tags: [backups]
      summary: Restore a stack-typed backup run
      description: |
        Verifies the whole archive first (hash, structure, every volume the
        backup recorded); a failing check returns 422 and changes nothing.
        Then writes `stack/*` into the stacks directory (`/stacks/<target>/`)
        and streams every `volumes/<vol>.tar.gz` entry into that volume on
        `host_id` (default: the host the backup was taken on; remote hosts
        need an agent of this version).

        `target_stack` restores under another name (default: the source
        stack). `mode: replace` empties each volume first and is refused
        with 409 while running containers use one of them; `merge` (default)
        overwrites the archived files and keeps everything else.

        Requires the job's host and the destination host within the
        caller's scope (403). Stack runs write the target stack's files, so
        they also need `stacks.update` (`stacks.create` for a new name), the
        stack in the caller's role scope, and the host the stack is deployed
        on in scope (403). Runs whose job was deleted are admin-only
        (`system.update` with no host or role scope). System runs are never
        restored here (409); they are restored with `POST /restore/system`,
        the setup wizard or `dockmesh restore`.
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRestoreRequest" }
      responses:
        "200":
          description: Restore complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestoreReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Run is a system backup or not restorable (failed, pruned); a volume to replace is in use; another restore writes the same volume or stack, or too many restores run; replace was asked for a run without a recorded checksum; or the destination agent is too old.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The archive failed verification or no longer matches the recorded checksum; nothing was restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/runs/{id}/restore:
    post:
      operationId: backups.restore_run
      tags: [backups]
      summary: Restore a volume or stack backup run
      description: |
        Same flow as `restore-stack`. For volume backups the archive goes
        into `dest_volume` (default: the backed-up volume) on `host_id`.
        For stack backups `target_stack` (or, for older clients,
        `dest_volume`) names the stack.

        Requires the job's host and the destination host within the
        caller's scope (403). Stack runs write the target stack's files, so
        they also need `stacks.update` (`stacks.create` for a new name), the
        stack in the caller's role scope, and the host the stack is deployed
        on in scope (403). Runs whose job was deleted are admin-only
        (`system.update` with no host or role scope). System runs are never
        restored here (409); they are restored with `POST /restore/system`,
        the setup wizard or `dockmesh restore`.
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRestoreRequest" }
      responses:
        "200":
          description: Restore complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestoreReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Run is a system backup or not restorable (failed, pruned); the volume to replace is in use; another restore writes the same volume, or too many restores run; replace was asked for a run without a recorded checksum; or the destination agent is too old.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The archive failed verification or no longer matches the recorded checksum; nothing was restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/runs/{id}/verify:
    post:
      operationId: backups.verify_run
      tags: [backups]
      summary: Verify that a saved backup run is restorable
      description: |
        System runs are streamed into a temp directory and checked with
        the same post-restore sanity checks as `dockmesh restore`; stack
        and volume runs get a structural check of the archive. Never
        touches the live install.

        Requires the job's host within the caller's scope (403). System
        runs, and runs whose job was deleted, are admin-only
        (`system.update` with no host or role scope).
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "200":
          description: Verification passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerifyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: "Verification failed — see `sanity.checks` for the failed check(s) or `encrypted: true` if the archive is encrypted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerifyResult" }

  /restore/system:
    get:
      operationId: restore.system_staged
      tags: [backups]
      summary: The system restore waiting for the next start, if any
      description: Needs `system.upgrade`.
      responses:
        "200":
          description: Staged restore or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  staged:
                    oneOf:
                      - { $ref: "#/components/schemas/StagedRestore" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: restore.system_stage
      tags: [backups]
      summary: Stage a system restore
      description: |
        Needs `system.upgrade`. Source is a saved system-backup run
        (JSON `{"run_id": N}`, decrypted with this server's keys and checked
        against the run's hash) or an uploaded archive (multipart `file`,
        plus `key` for an archive encrypted by another install). The archive
        is extracted next to the live files and checked; the live install
        is not touched until `POST /restore/system/apply`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id: { type: integer, format: int64 }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                key: { type: string, format: binary }
      responses:
        "200":
          description: Staged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  staged: { $ref: "#/components/schemas/StagedRestore" }
                  counts: { type: object }
                  sanity: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Run not restorable, or another restore is being staged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { description: Upload larger than 1 GiB, or the archive unpacks to more than 8 GiB / 200,000 entries. }
        "422":
          description: Encrypted without a matching key, hash mismatch, or the backup failed the restore checks.
          content:
            application/json:
              schema: { type: object }
    delete:
      operationId: restore.system_discard
      tags: [backups]
      summary: Drop a staged system restore
      description: Needs `system.upgrade`.
      responses:
        "204": { description: Discarded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The swap has already started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restore/system/apply:
    post:
      operationId: restore.system_apply
      tags: [backups]
      summary: Restart and swap the staged system restore in
      description: |
        Needs `system.upgrade`. Answers 202, then shuts down and exits with
        code 75 so the service manager restarts the server; at start the
        staged files replace the live database, data and stacks before the
        database is opened. Replaced files stay under `<data>/.pre-restore/`
        and `<stacks>.pre-restore-<time>`.
      responses:
        "202":
          description: Restarting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarting: { type: boolean }
                  staged: { $ref: "#/components/schemas/StagedRestore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Nothing staged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restore/verify:
    post:
      operationId: restore.verify_upload
      tags: [backups]
      summary: Upload a system backup tarball and verify it's restorable
      description: |
        Multipart upload with a single `file` part containing a gzipped
        tar produced by the `dockmesh-system` backup job. Server
        extracts to a temp dir, runs the post-restore sanity checks,
        tears down. Never touches the live install. Use this to
        answer "is our backup actually restorable?" without spinning
        up a separate Dockmesh host.

        Rejects age-encrypted tarballs — the server's own age key is
        inside the tarball, so self-encrypted system backups can't
        self-verify. Uploads are limited to 1 GiB. Symlink and hardlink
        entries are never extracted (Dockmesh backups contain none).

        Admin-only (`system.update` with no host or role scope; 403).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Gzipped tar system backup (~MB scale).
      responses:
        "200":
          description: Backup is restorable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerifyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Upload larger than 1 GiB, or the archive unpacks to more than 8 GiB or 200,000 entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Verification failed, sanity check broke, or tarball is encrypted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerifyResult" }

  /backups/local-path:
    get:
      operationId: backups.local_path
      tags: [backups]
      summary: Suggested directory for a new local backup target
      description: |
        The data directory's `backups` folder when it lies inside an allowed
        local root, otherwise the first allowed root. Empty when none is
        configured.
      responses:
        "200":
          description: Suggested path.
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backups/targets:
    get:
      operationId: backups.list_targets
      tags: [backups]
      summary: List saved backup targets (SFTP, SMB, WebDAV, S3, local)
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: backups.create_target
      tags: [backups]
      summary: Create a new backup target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /backups/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: backups.update_target
      tags: [backups]
      summary: Update a backup target
      description: >-
        Secrets sent empty keep the stored value; changing the server, URL
        or user while keeping a stored secret returns 400 (re-enter it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: backups.delete_target
      tags: [backups]
      summary: Delete a backup target
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Target is referenced by one or more jobs (including deleted jobs whose archives are still on it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/targets/{id}/test:
    post:
      operationId: backups.test_target
      tags: [backups]
      summary: Verify connectivity to a saved target
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "200":
          description: Connection OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Connection failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetTestResult" }

  /backups/targets/{id}/accept-host-key:
    post:
      operationId: backups.accept_target_host_key
      tags: [backups]
      summary: Trust the changed SFTP host key a saved target last saw
      description: |
        Saved SFTP targets record the server's host key on their first
        connection and refuse a different key later; the new key is kept
        as `config.host_key_pending`. This moves it to `host_key`.
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "204": { description: Accepted; the next connection uses the new key. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No changed host key is waiting for approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/targets/test-config:
    post:
      operationId: backups.test_target_config
      tags: [backups]
      summary: Verify an unsaved target config (pre-create smoke test)
      description: |
        `host_key` fields in the config are ignored. With `target_id`
        set to the saved target being edited, an SFTP server must present
        that target's recorded host key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BackupTargetInput"
                - type: object
                  properties:
                    target_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Connection OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Connection failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetTestResult" }

  /backups/targets/discover-shares:
    post:
      operationId: backups.discover_shares
      tags: [backups]
      summary: List SMB shares on a host (pre-create helper)
      description: Used by the target-create dialog to autocomplete share names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, username, password]
              properties:
                host: { type: string }
                username: { type: string }
                password: { type: string, format: password }
                domain: { type: string }
      responses:
        "200":
          description: Shares.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Connection failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/system/enabled:
    put:
      operationId: backups.toggle_system
      tags: [backups]
      summary: Enable / disable the default daily system backup
      description: >-
        Admin-only (`system.update` with no host or role scope; 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: New backup status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -----------------------------------------------------------------------
  # alerts + notifications
  # -----------------------------------------------------------------------
  /alerts/rules:
    get:
      operationId: alerts.list_rules
      tags: [alerts]
      summary: List alert rules (built-in + user-defined)
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: alerts.create_rule
      tags: [alerts]
      summary: Create a user-defined alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /alerts/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: alerts.update_rule
      tags: [alerts]
      summary: Update an alert rule (including enabled flag on built-ins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: alerts.delete_rule
      tags: [alerts]
      summary: Delete a user-defined alert rule
      description: Built-in rules cannot be deleted — disable them instead (P.11.5). Returns 409 for built-ins.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Rule is built-in and cannot be deleted — disable instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /alerts/history:
    get:
      operationId: alerts.history
      tags: [alerts]
      summary: Recent alert events (fire + resolve), newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/channels:
    get:
      operationId: notifications.list_channels
      tags: [alerts]
      summary: List configured notification channels
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: notifications.create_channel
      tags: [alerts]
      summary: Create a notification channel (webhook, email, slack, …)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /notifications/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: notifications.update_channel
      tags: [alerts]
      summary: Update a notification channel
      description: >-
        Secrets sent empty keep the stored value; changing the server, URL
        or user while keeping a stored secret returns 400 (re-enter it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: notifications.delete_channel
      tags: [alerts]
      summary: Delete a notification channel
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/channels/{id}/test:
    post:
      operationId: notifications.test_channel
      tags: [alerts]
      summary: Send a test notification through the channel
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "204": { description: Test sent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Delivery failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # audit log (tamper-evident)
  # -----------------------------------------------------------------------
  /audit:
    get:
      operationId: audit.list
      tags: [audit]
      summary: Audit log entries, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: action
          in: query
          schema: { type: string }
          description: Filter by action prefix (e.g. `container.`).
        - name: user_id
          in: query
          schema: { type: string }
          description: Only entries of this user (the user activity view).
        - name: category
          in: query
          schema: { type: string, enum: [changes, access, auth, system] }
          description: Only entries of this category; actions without a category count as `system`.
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/retention:
    get:
      operationId: audit.retention_get
      tags: [audit]
      summary: Current retention config + preview of next prune run (P.11.13)
      responses:
        "200":
          description: Config + preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { $ref: "#/components/schemas/AuditRetentionConfig" }
                  preview: { $ref: "#/components/schemas/AuditRetentionPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: audit.retention_set
      tags: [audit]
      summary: Update retention config
      description: |
        Stored in the settings table. Takes effect on the next scheduled
        run (03:00 server-local) or immediately via
        `POST /audit/retention/run`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditRetentionConfig" }
      responses:
        "200":
          description: Updated config + fresh preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { $ref: "#/components/schemas/AuditRetentionConfig" }
                  preview: { $ref: "#/components/schemas/AuditRetentionPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/retention/run:
    post:
      operationId: audit.retention_run
      tags: [audit]
      summary: Trigger the retention job now (admin-only)
      description: |
        Runs the configured policy immediately. For `archive_local` /
        `archive_target` modes, writes the archive before pruning so a
        failure to write does not lose data. A `chain.bridge` audit
        entry is written before prune to document the transition.
      responses:
        "200":
          description: Run result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRetentionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Archive step failed (credentials, disk space, …).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /audit/webhook:
    get:
      operationId: audit.webhook_get
      tags: [audit]
      summary: Current audit-webhook config (P.11.14)
      description: The plaintext secret is never returned — the `has_secret` flag tells the UI whether one is stored.
      responses:
        "200":
          description: Config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditWebhookConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: audit.webhook_set
      tags: [audit]
      summary: Update audit-webhook config
      description: |
        URL must be http:// or https://. Empty `secret` with
        `clear_secret: false` keeps the existing secret; set
        `clear_secret: true` to wipe it. `filter_actions` accepts
        exact matches ("stack.deploy") or prefix wildcards
        ("stack.*"); empty = deliver every entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditWebhookInput" }
      responses:
        "200":
          description: Updated config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditWebhookConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/webhook/test:
    post:
      operationId: audit.webhook_test
      tags: [audit]
      summary: Send a synthetic test event to the configured URL
      description: |
        Bypasses the filter. Useful for verifying the receiver /
        HMAC signature before flipping on the live feed.
      responses:
        "200":
          description: Test dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Receiver rejected or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /audit/verify:
    get:
      operationId: audit.verify
      tags: [audit]
      summary: Verify the hash chain from genesis to the latest entry
      description: |
        Re-computes each row's `row_hash` from the prior hash + canonical
        fields. A broken chain indicates tampering.
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, verified_rows]
                properties:
                  ok: { type: boolean }
                  verified_rows: { type: integer }
                  first_broken_id: { type: integer, format: int64 }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -----------------------------------------------------------------------
  # system — server-wide runtime info and host metrics
  # -----------------------------------------------------------------------
  /system/info:
    get:
      operationId: system.info
      tags: [metrics]
      summary: Dockmesh version + build info
      responses:
        "200":
          description: Instance info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  build_date: { type: string }
                  go_version: { type: string }
                  os: { type: string }
                  arch: { type: string }
                  uptime_seconds: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/metrics:
    get:
      operationId: system.metrics
      tags: [metrics]
      summary: Host-level CPU / memory / disk / uptime snapshot
      description: Used by the dashboard's System Health panel. Works across local and remote hosts.
      parameters:
        - $ref: "#/components/parameters/HostQuery"
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpu_percent: { type: number }
                  cpu_cores: { type: integer }
                  cpu_used_cores: { type: number }
                  mem_percent: { type: number }
                  mem_total: { type: integer, format: int64 }
                  mem_used: { type: integer, format: int64 }
                  disk_percent: { type: number }
                  disk_total: { type: integer, format: int64 }
                  disk_used: { type: integer, format: int64 }
                  disk_path:
                    type: string
                    description: Mount the disk_* figures describe. With per-mount data this is the fullest mount holding Docker, containerd, stacks or Dockmesh data.
                  uptime_seconds: { type: integer, format: int64 }
                  mounts:
                    type: array
                    description: Every real filesystem of the host, fullest first.
                    items: { $ref: "#/components/schemas/DiskMount" }
                  mounts_unsupported:
                    type: boolean
                    description: True when the host's agent is too old to report per-mount usage.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/backup-status:
    get:
      operationId: system.backup_status
      tags: [metrics]
      summary: Default system backup summary for the sidebar pill
      responses:
        "200":
          description: Backup status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/health:
    get:
      operationId: system.health
      tags: [metrics]
      summary: Aggregated system health for the HealthDot popover
      description: |
        One-shot fetch of every passive health signal (backup, proxy,
        agents, disk, CVE scanner) so the UI can render the HealthDot
        badge + its click popover without N parallel requests.
      responses:
        "200":
          description: Health summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall: { type: string, enum: [ok, warn, fail, off] }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:    { type: string }
                        label:   { type: string }
                        status:  { type: string, enum: [ok, warn, fail, off] }
                        detail:  { type: string }
                        link_to: { type: string }
                        message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/update-status:
    get:
      operationId: system.update_status
      tags: [metrics]
      summary: Cached self-update check result
      description: |
        Returns the last poll of the Dockmesh GitHub Releases API. The
        checker runs once every 24h in the background; `POST /system/update-check`
        forces an immediate refresh. `update_available` is computed against
        the running binary's version — "dev" builds never show as upgradable.
      responses:
        "200":
          description: Update status snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version:  { type: string }
                  latest_version:   { type: string }
                  update_available: { type: boolean }
                  release_url:      { type: string }
                  release_notes:    { type: string }
                  published_at:     { type: string, format: date-time }
                  checked_at:       { type: string, format: date-time }
                  enabled:          { type: boolean }
                  error:            { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/whats-new:
    get:
      operationId: system.whats_new
      tags: [metrics]
      summary: Release notes of the running version and of a newer release
      description: |
        `current` is the running version's section of the changelog embedded
        in the binary; null for builds that are not a release. `latest` is
        the newer release found by the update check, read from its
        `release-manifest.json`; null when there is none, it has no
        manifest, or the caller lacks `system.view`. `highlights` is empty when the changelog section has no
        `### Highlights` list. `unseen` is true while the caller has not
        marked the running version as seen; API tokens always get false.
        Any authenticated caller.
      responses:
        "200":
          description: Release notes.
          content:
            application/json:
              schema:
                type: object
                required: [current, latest, last_seen_version, unseen]
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/ReleaseNotes"
                      - type: "null"
                  latest:
                    oneOf:
                      - $ref: "#/components/schemas/ReleaseNotes"
                      - type: "null"
                  last_seen_version: { type: string, description: Empty when the caller never marked a version as seen. }
                  unseen: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/whats-new/seen:
    post:
      operationId: system.whats_new_seen
      tags: [metrics]
      summary: Mark the running version's release notes as seen
      description: Per user. Requires a user session; API tokens get 404.
      responses:
        "204": { description: Marked (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /system/update-check:
    post:
      operationId: system.update_check
      tags: [metrics]
      summary: Force an immediate GitHub Releases lookup
      description: |
        Manual refresh button for the Settings → System panel. Returns the
        refreshed status synchronously. Admin-only.
      responses:
        "200":
          description: Refreshed update status (same schema as GET).
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/backup-key/export:
    get:
      operationId: system.backup_key_export
      tags: [metrics]
      summary: Download the age identity used for system-backup encryption
      description: |
        Returns the age private key used to encrypt system backups, so the
        admin can store it offline for disaster recovery. Without this
        key, an encrypted system backup cannot be restored on a fresh
        host. Requires `backups.restore` plus admin (`system.update` with
        no host or role scope); every export is audited.
      responses:
        "200":
          description: age key file (text/plain).
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Age encryption not configured on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /system/secrets/rotate:
    post:
      operationId: system.secrets_rotate
      tags: [metrics]
      summary: Rotate the age encryption key used for stack .env files
      description: |
        Generates a new age key, re-encrypts every stack `.env.age` against
        it, atomically swaps the in-memory key on the running server, and
        archives the previous key to `<path>.old` so legacy external
        backups can still be decrypted out-of-band. Equivalent to
        `dockmesh secrets rotate` but safe to run on a live server.
      responses:
        "200":
          description: Rotation summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reencrypted:   { type: integer }
                  old_recipient: { type: string }
                  new_recipient: { type: string }
        "400":
          description: Secrets encryption disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Another key rotation is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Secrets or stacks service not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # users — local-user CRUD + self-profile
  # -----------------------------------------------------------------------
  /me:
    get:
      operationId: users.me
      tags: [users]
      summary: The authenticated user's own profile
      description: |
        Includes role, scope_tags, and MFA state — used by the UI to gate
        buttons. For an API token, `permissions` lists only what both the
        token's role and its owner's current role allow, and `scope_tags`
        are the owner's.
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -----------------------------------------------------------------------
  # invite-link flow — Coolify-style one-time tokens, no SMTP
  # -----------------------------------------------------------------------
  /invites:
    get:
      operationId: invites.list
      tags: [users]
      summary: List recent invites (admin overview)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Invite list.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
    post:
      operationId: invites.create
      tags: [users]
      summary: Mint a one-time invite link
      description: |
        The role must exist (400) and may not exceed the caller's rights;
        a caller with host scope tags must give the invite tags within
        its own (403).
        Returns the raw token + accept URL exactly once. The admin
        copies the URL out and shares it manually. No SMTP dependency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string }
                scope_tags:
                  type: array
                  items: { type: string }
                email_hint: { type: string }
                ttl_hours: { type: integer, minimum: 1, maximum: 168 }
      responses:
        "201":
          description: Invite minted.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /invites/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    delete:
      operationId: invites.revoke
      tags: [users]
      summary: Revoke a pending invite
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /invite/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    get:
      operationId: invites.preview
      tags: [auth]
      summary: Preview an invite (public — used by the accept page)
      security: []
      responses:
        "200":
          description: Invite preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  scope_tags: { type: array, items: { type: string } }
                  email_hint: { type: string }
                  expires_at: { type: string, format: date-time }
        "404": { description: invite not found }
        "410": { description: expired or already used }

  /invite/{token}/accept:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    post:
      operationId: invites.accept
      tags: [auth]
      summary: Redeem an invite — create the user + return a session
      description: >-
        Returns 410 when the invite is used or expired, its role no longer
        exists, or its creator can no longer grant its role and scope.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: User created + signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  access_token: { type: string }
                  refresh_token: { type: string }
        "404": { description: invite not found }
        "409": { description: username or email already taken }
        "410": { description: expired or already used }
        "429":
          description: Too many failed attempts from this IP (10 per 15 minutes) or for this invite (5).
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users:
    get:
      operationId: users.list
      tags: [users]
      summary: List all local users
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: users.create
      tags: [users]
      summary: Create a new local user
      description: The role may not exceed the caller's rights, and callers with host scope tags create users through scoped invites instead (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role:
                  type: string
                  description: Role name — `admin`, `operator`, `viewer`, or a custom role.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    put:
      operationId: users.update
      tags: [users]
      summary: Update user email, role, and scope tags
      description: |
        The caller must hold every permission of both the user's current
        role and the new one, and a scoped caller can only assign scope
        tags within its own (403). Demoting the last account that holds
        `system.update` and all `users.*` permissions returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                role: { type: string, description: Omitted or empty keeps the current role. }
                display_name: { type: string }
                scope_tags:
                  type: array
                  items: { type: string }
                  description: Host tag scope. Omitted keeps the current tags; empty = access to all hosts.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: users.delete
      tags: [users]
      summary: Delete a local user
      description: Same rules as update; deleting the last admin-capable account returns 409.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}/password:
    put:
      operationId: users.change_password
      tags: [users]
      summary: Admin-set a user's password
      description: Minimum 8 chars. Admin-only — regular users change their own password via a (future) self-service endpoint.
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Password updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/mfa:
    delete:
      operationId: users.mfa_reset
      tags: [users]
      summary: "Admin: clear MFA for a user"
      description: |
        Used when a user has lost access to their TOTP device and recovery
        codes. Not for the caller's own account (400): turning off your own
        MFA goes through `DELETE /mfa` with a code.
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "204": { description: MFA cleared. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # roles — custom role definitions + permission catalogue
  # -----------------------------------------------------------------------
  /roles:
    get:
      operationId: roles.list
      tags: [roles]
      summary: List roles (built-in + custom)
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: roles.create
      tags: [roles]
      summary: Create a custom role
      description: Permissions and scopes may not exceed the caller's own (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Role name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /roles/permissions:
    get:
      operationId: roles.permissions
      tags: [roles]
      summary: Catalogue of permissions that can be granted to a role
      description: |
        Returns all `Perm` values the server knows about with a
        human-readable description. Used by the role-create dialog to
        render the permission-picker.
      responses:
        "200":
          description: Permission catalogue.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, display_name, description, category, verb, danger_level]
                  properties:
                    name:
                      type: string
                      description: Backend identifier in `category.verb` dot-notation.
                      example: containers.exec
                    display_name:
                      type: string
                      description: Short human-readable label shown on the matrix cell tooltip and in Edit Role rows.
                      example: Shell into container
                    description:
                      type: string
                      description: One-line plain-language explanation. Renders as the `?` info-button tooltip.
                    category:
                      type: string
                      description: Resource group the permissions matrix renders this row under.
                      example: Containers
                    verb:
                      type: string
                      description: Matrix column header within the category — e.g., view / deploy / update / delete or per-resource sensitive verb.
                      example: exec
                    danger_level:
                      type: string
                      enum: [low, medium, high]
                      description: Drives UI tinting on dangerous grants.
                    sensitive:
                      type: boolean
                      description: When true the permission belongs in the matrix's "Sensitive operations" sub-section rather than the standard verb columns.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /roles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: roles.get
      tags: [roles]
      summary: Inspect one role
      responses:
        "200":
          description: Role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: roles.update
      tags: [roles]
      summary: Update a custom role's display name + permissions
      description: |
        The caller must be unscoped (no host scope tags, no role scope) and
        hold every permission of the role before and after the change (403). Taking admin rights from a role whose holders
        are the last admins returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Role is built-in (cannot be renamed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: roles.delete
      tags: [roles]
      summary: Delete a custom role
      description: |
        Built-in roles cannot be deleted — returns 409, as does deleting
        the role of the last admins. The caller must be unscoped and hold
        every permission of the role (403).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Role is built-in or still referenced by users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -----------------------------------------------------------------------
  # unified auth providers — single fetch across all four kinds
  # -----------------------------------------------------------------------
  /auth/providers:
    get:
      operationId: auth.providers
      tags: [auth]
      summary: All configured identity providers (OIDC + OAuth2 + SAML + LDAP)
      description: |
        Returns one mixed list with a `kind` discriminator so the
        Authentication page can render every provider without four
        round-trips. The `raw` field carries the underlying record
        verbatim — callers that need kind-specific fields read it,
        others ignore it.
      responses:
        "200":
          description: Provider list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [kind, id, slug, display_name, enabled]
                  properties:
                    kind:
                      type: string
                      enum: [oidc, oauth2, saml, ldap]
                    id: { type: integer, format: int64 }
                    slug: { type: string }
                    display_name: { type: string }
                    enabled: { type: boolean }
                    raw: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -----------------------------------------------------------------------
  # oidc — provider configuration (admin-only)
  # -----------------------------------------------------------------------
  /oidc/providers:
    get:
      operationId: oidc.list_providers
      tags: [oidc]
      summary: List configured OIDC providers (includes disabled + secrets redacted)
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OIDCProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: oidc.create_provider
      tags: [oidc]
      summary: Add an OIDC provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCProviderInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Slug already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /oidc/providers/reload:
    post:
      operationId: oidc.reload
      tags: [oidc]
      summary: Re-discover metadata for all enabled providers
      description: Forces a refresh of well-known endpoints (jwks, authorize, token URLs).
      responses:
        "200":
          description: Reload summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reloaded: { type: integer }
                  failed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /oidc/providers/test-discovery:
    post:
      operationId: oidc.test_discovery
      tags: [oidc]
      summary: Validate an OIDC issuer URL without saving a provider
      description: |
        Fetches /.well-known/openid-configuration from the given issuer and
        verifies the `issuer` claim matches — catches typos and localhost/IP
        mismatches before the first real login attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_url]
              properties:
                issuer_url: { type: string, example: "https://login.example.com" }
      responses:
        "200":
          description: "Discovery result. `ok: false` carries the reason in `error`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:                     { type: boolean }
                  error:                  { type: string }
                  issuer:                 { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint:         { type: string }
                  userinfo_endpoint:      { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /oidc/providers/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: oidc.update_provider
      tags: [oidc]
      summary: Update an OIDC provider
      description: Send an empty `client_secret` to keep the existing secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCProviderInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: oidc.delete_provider
      tags: [oidc]
      summary: Delete an OIDC provider
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # api-tokens — long-lived bearer tokens for CI (P.11.1)
  # -----------------------------------------------------------------------
  /settings/api-tokens:
    get:
      operationId: api_tokens.list
      tags: [api-tokens]
      summary: List API tokens (plaintext is NOT returned — only the prefix)
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: api_tokens.create
      tags: [api-tokens]
      summary: Create a new API token
      description: |
        The plaintext token is returned ONCE in the `token` field. It is
        never retrievable afterwards — lose it and you must revoke +
        recreate.

        The new token is owned by the signed-in user, or by the owner of
        the API token making the request. Legacy tokens (no owner) can't
        create tokens (403). The role may not grant more than the caller
        effectively holds. A token created with an API token never expires
        later than that token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, example: github-deploy }
                role: { type: string, example: operator }
                expires_in_days:
                  type: integer
                  minimum: 0
                  default: 90
                  description: 0 = never expires.
      responses:
        "201":
          description: Created with one-time plaintext.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiToken"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: Full plaintext `dmt_…` value. Save it now.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/api-tokens/{id}:
    delete:
      operationId: api_tokens.revoke
      tags: [api-tokens]
      summary: Revoke an API token (soft delete — sets revoked_at)
      description: |
        Without `tokens.manage_others`, a signed-in user can revoke their
        own tokens and an API token can revoke only itself; anything else
        is 404.
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # registries — private-image credentials (P.11.7)
  # -----------------------------------------------------------------------
  /settings/registries:
    get:
      operationId: registries.list
      tags: [registries]
      summary: List saved registry credentials (passwords redacted)
      responses:
        "200":
          description: Registries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Registry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: registries.create
      tags: [registries]
      summary: Save a new registry credential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A registry with this URL already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /settings/registries/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: registries.update
      tags: [registries]
      summary: Update a saved registry
      description: |
        `password` empty = keep existing. Set `clear_password: true` to
        explicitly wipe the stored password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another registry already has this URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: registries.delete
      tags: [registries]
      summary: Delete a registry entry
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings/registries/{id}/test:
    post:
      operationId: registries.test
      tags: [registries]
      summary: Verify credentials by calling docker RegistryLogin
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                  identity: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Registry rejected the credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string }

  # -----------------------------------------------------------------------
  # settings — server-wide runtime config (DB-backed)
  # -----------------------------------------------------------------------
  /settings:
    get:
      operationId: settings.list
      tags: [settings]
      summary: Effective server settings (runtime-overridable key/value pairs)
      description: |
        The audit webhook keys (`audit.webhook_url`,
        `audit.webhook_hmac_secret`, `audit.webhook_filter_actions`) are
        omitted; read them through `GET /audit/webhook`.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [key, value]
                  properties:
                    key: { type: string }
                    value: { type: string }
                    from_env: { type: boolean, description: True when the value was read from env vars instead of DB. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: settings.update
      tags: [settings]
      summary: Update one or more settings
      description: |
        `trusted_proxies` is a comma-separated list of IPs or CIDRs whose
        X-Forwarded-For / X-Real-IP / X-Forwarded-Proto headers are
        believed (empty = loopback only); invalid entries are rejected with
        400 and nothing is saved.

        The audit webhook keys are rejected with 400; configure them via
        `PUT /audit/webhook`. The response omits them like `GET /settings`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [key, value]
                properties:
                  key: { type: string }
                  value: { type: string }
              example:
                - { key: base_url, value: "https://dockmesh.example.com" }
                - { key: trusted_proxies, value: "10.0.0.5, 172.16.0.0/12" }
      responses:
        "200":
          description: Saved; all settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    value: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -----------------------------------------------------------------------
  # global-env — shared env variables available to every stack deploy
  # -----------------------------------------------------------------------
  /global-env:
    get:
      operationId: global_env.list
      tags: [global-env]
      summary: List shared env variables across all groups
      responses:
        "200":
          description: Variables.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlobalEnvItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: global_env.create
      tags: [global-env]
      summary: Add a shared env variable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalEnvInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalEnvItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Key already exists within the group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /global-env/groups:
    get:
      operationId: global_env.list_groups
      tags: [global-env]
      summary: Distinct group names defined on the global-env items
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /global-env/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: global_env.update
      tags: [global-env]
      summary: Update a shared env variable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalEnvInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlobalEnvItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: global_env.delete
      tags: [global-env]
      summary: Remove a shared env variable
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # migrations — stack migration listings (detail lives under /stacks)
  # -----------------------------------------------------------------------
  /migrations:
    get:
      operationId: migrations.list
      tags: [migrations]
      summary: Recent migrations across all stacks (history)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Migrations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MigrationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /migrations/active:
    get:
      operationId: migrations.active
      tags: [migrations]
      summary: Currently-running migrations
      responses:
        "200":
          description: In-flight migrations only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MigrationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -----------------------------------------------------------------------
  # drain — safely evacuate a host before maintenance (P.10)
  # -----------------------------------------------------------------------
  /hosts/{id}/drain/plan:
    post:
      operationId: drain.plan
      tags: [migrations]
      summary: Dry-run a drain — list what would move and where
      description: |
        Given a set of candidate target hosts, produces a plan that maps
        each stack on the source host to a target host. Safe to call —
        does not start any migration.
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_host_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Candidate target hosts. If omitted, all online hosts are considered.
                strategy:
                  type: string
                  enum: [least-loaded, explicit, round-robin]
                  default: least-loaded
      responses:
        "200":
          description: Plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/{id}/drain/execute:
    post:
      operationId: drain.execute
      tags: [migrations]
      summary: Start the drain — migrate stacks off the source host
      description: |
        Kicks off sequential stack migrations according to the plan (or
        a computed default plan). Returns a drain id for progress polling.
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { $ref: "#/components/schemas/DrainPlan" }
                target_host_ids:
                  type: array
                  items: { type: string, format: uuid }
                strategy:
                  type: string
                  enum: [least-loaded, explicit, round-robin]
      responses:
        "202":
          description: Drain accepted — poll `/hosts/{id}/drain/{drain_id}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  drain_id: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A drain is already running for this host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /hosts/{id}/drain/{drain_id}:
    parameters:
      - $ref: "#/components/parameters/HostIDPath"
      - $ref: "#/components/parameters/DrainIDPath"
    get:
      operationId: drain.status
      tags: [migrations]
      summary: Poll drain progress
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/{id}/drain/{drain_id}/pause:
    post:
      operationId: drain.pause
      tags: [migrations]
      summary: Pause a running drain between stacks
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - $ref: "#/components/parameters/DrainIDPath"
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Drain is not in a state that can be paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /hosts/{id}/drain/{drain_id}/resume:
    post:
      operationId: drain.resume
      tags: [migrations]
      summary: Resume a paused drain
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - $ref: "#/components/parameters/DrainIDPath"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/{id}/drain/{drain_id}/abort:
    post:
      operationId: drain.abort
      tags: [migrations]
      summary: Abort a drain; in-flight migrations are rolled back
      parameters:
        - $ref: "#/components/parameters/HostIDPath"
        - $ref: "#/components/parameters/DrainIDPath"
      responses:
        "200":
          description: Aborted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # templates — stack templates with parameter substitution (P.11.12)
  # -----------------------------------------------------------------------
  /templates:
    get:
      operationId: templates.list
      tags: [templates]
      summary: List stack templates (built-in + user-created)
      responses:
        "200":
          description: Templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StackTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: templates.create
      tags: [templates]
      summary: Create a user-defined template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackTemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Slug already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    get:
      operationId: templates.get
      tags: [templates]
      summary: Inspect a template (compose body, parameters, etc.)
      responses:
        "200":
          description: Template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: templates.update
      tags: [templates]
      summary: Update a user-defined template (built-ins rejected with 409)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackTemplateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Template is built-in or slug conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: templates.delete
      tags: [templates]
      summary: Delete a user-defined template
      description: Built-in templates cannot be deleted — returns 409.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Template is built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates/{id}/deploy:
    post:
      operationId: templates.deploy
      tags: [templates]
      summary: Render the template with the given values and deploy as a new stack
      description: |
        Renders `{{param}}` placeholders with the supplied `values`,
        auto-generates any `secret: true` parameter the caller left
        blank, creates a stack on the filesystem, and runs
        `docker compose up -d` against the chosen host. The response
        echoes the rendered compose + the resolved values with secrets
        redacted as `<generated>`.
        The caller needs access to the target host and a role scope that covers
        the new stack; the deployment is recorded in the stack's deploy history.
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stack_name]
              properties:
                stack_name: { type: string, description: Name for the new stack. }
                host_id: { type: string, description: Target host; empty / "local" for the central daemon. }
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: Parameter values, keyed by the parameter's name.
      responses:
        "201":
          description: Deployed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack: { type: string }
                  compose: { type: string, description: The rendered compose.yaml. }
                  values:
                    type: object
                    additionalProperties: { type: string }
                    description: Resolved values; secrets show as `<generated>`.
                  deploy_result: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A stack with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates/{id}/export:
    get:
      operationId: templates.export
      tags: [templates]
      summary: Download the template as YAML (same shape as built-in files)
      parameters:
        - $ref: "#/components/parameters/IntIDPath"
      responses:
        "200":
          description: YAML.
          content:
            application/yaml:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # proxy — embedded Caddy reverse-proxy configuration
  # -----------------------------------------------------------------------
  /proxy/status:
    get:
      operationId: proxy.status
      tags: [proxy]
      summary: Embedded Caddy proxy state
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  container_state: { type: string, enum: [running, stopped, missing] }
                  routes_count: { type: integer }
                  last_sync_at: { type: string, format: date-time }
                  last_error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxy/enable:
    post:
      operationId: proxy.enable
      tags: [proxy]
      summary: Start the managed Caddy container + begin serving routes
      description: |
        Reconciles the `dockmesh-proxy` container: one created with the
        current spec (image, command, mounts) is kept and started if needed;
        an outdated or foreign one is replaced. The image is pinned by digest
        (`caddy:2.11.7@sha256:…`, override with `DOCKMESH_PROXY_IMAGE`). Caddy resumes its last pushed
        config after a restart, and Dockmesh re-pushes the routes when the
        running config drifts from them.
      responses:
        "204": { description: Enabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Docker unavailable — cannot start the container.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /proxy/disable:
    post:
      operationId: proxy.disable
      tags: [proxy]
      summary: Stop the embedded Caddy container
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /proxy/routes:
    get:
      operationId: proxy.list_routes
      tags: [proxy]
      summary: List configured proxy routes
      description: |
        Callers without `proxy.update` get the values of `headers.request_set`
        and `headers.response_set` replaced by `********` and
        `access.forward_auth.url` without its query.
      responses:
        "200":
          description: Routes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxyRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: proxy.create_route
      tags: [proxy]
      summary: Add a new proxy route
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxyRouteInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Hostname already taken by another route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /proxy/import:
    post:
      operationId: proxy.import_caddyfile
      tags: [proxy]
      summary: Import sites from a Caddyfile
      description: |
        Converts the Caddyfile with the running Caddy's `/adapt` admin endpoint
        (the running config is not touched) and maps each site to a route with
        options. Sites whose directives all map get status `ready`; sites with
        directives that have no option get `partial` and list them in
        `unsupported`; sites that can't be imported (no reverse_proxy, a host
        that already has a route, an upstream or option that fails validation)
        get `skipped` with `error`. Without `dry_run`, every `ready` and
        `partial` site is created **disabled** and carries its `route_id`.
        A site block with several names becomes one site per name; a
        `www.<name>` block that only redirects to `<name>` becomes that site's
        `www_redirect`. `import`, client certificate files and `{$ENV}`
        substitution are rejected (400), as they would read files or the
        environment of the proxy container.
        Needs the proxy to be running (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caddyfile]
              properties:
                caddyfile: { type: string, maxLength: 262144 }
                dry_run: { type: boolean, description: Only report, create nothing. }
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The proxy is not running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /proxy/routes/{id}:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    put:
      operationId: proxy.update_route
      tags: [proxy]
      summary: Update a proxy route
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxyRouteInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: proxy.delete_route
      tags: [proxy]
      summary: Remove a proxy route
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /proxy/routes/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    patch:
      operationId: proxy.set_route_enabled
      tags: [proxy]
      summary: Toggle a route's enabled flag without round-tripping upstream/tls_mode
      description: |
        Disabled routes stay in the database for editing but are
        filtered out when the Caddyfile is regenerated — traffic stops
        flowing without losing host/upstream/TLS-mode config.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Toggled. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /proxy/routes/{id}/config:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    get:
      operationId: proxy.route_config
      tags: [proxy]
      summary: Generated Caddy config for one site (read-only preview)
      description: |
        The Caddy JSON config Dockmesh generates for this site alone, as it
        would be served when enabled. Basic-auth password hashes are replaced
        by `REDACTED`; the admin section is left out. `blocked` is true when
        the stored route fails validation and is not served. For callers
        without `proxy.update` the config is built with header values masked
        and the forward-auth URL's query removed, as in the route list.
      responses:
        "200":
          description: Preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySitePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /proxy/routes/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/IntIDPath"
    get:
      operationId: proxy.route_metrics
      tags: [proxy]
      summary: Current Caddy metrics for one route
      description: |
        Returns the per-host slice of the latest metrics snapshot for
        the route's host. Cheaper than `/proxy/metrics` when only one
        row is being refreshed (expanded-route panel, etc.). Empty
        counters when Caddy hasn't scraped yet or the host has no
        traffic since the last scrape.
      responses:
        "200":
          description: Per-route metrics snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { type: string }
                  requests: { type: integer }
                  requests_per_second: { type: number }
                  status_buckets:
                    type: object
                    additionalProperties: { type: integer }
                  p95_latency_ms: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: route not found }

  # -----------------------------------------------------------------------
  # convert — docker-run command → compose translation
  # -----------------------------------------------------------------------
  /convert/run-to-compose:
    post:
      operationId: convert.run_to_compose
      tags: [stacks]
      summary: Translate a `docker run ...` CLI command into a compose service
      description: Used by the "paste docker run" helper in the new-stack dialog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  description: Full `docker run ...` command line.
                  example: "docker run -d --name nginx -p 8080:80 nginx:alpine"
      responses:
        "200":
          description: Parsed result — a service name + a compose snippet.
          content:
            application/json:
              schema:
                type: object
                required: [service, compose]
                properties:
                  service: { type: string }
                  compose:
                    type: string
                    description: YAML for one service, ready to paste into compose.yaml.
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -----------------------------------------------------------------------
  # ws — websocket endpoints (documented here for discoverability)
  # -----------------------------------------------------------------------
  /ws/ticket:
    post:
      operationId: ws.ticket
      tags: [auth]
      summary: Mint a single-use, 30-second ticket for WebSocket upgrade URLs
      description: |
        WebSocket upgrade requests cannot carry custom Authorization
        headers from browsers. Clients POST here with a normal Bearer
        token plus a `?for=<perm>` query parameter that names the
        permission the ticket should grant (one of `containers.view`,
        `containers.logs`, `containers.exec`, `system.view`). The server
        verifies the caller holds that permission and issues a 30s ticket
        bound to it and to the caller's identity (user, role, host scope,
        API token). Each WS endpoint accepts a ticket once, asserts the
        bound permission matches its own, re-checks it, and applies the
        caller's host and role scope. Mint a new ticket for every connect
        and reconnect.
      parameters:
        - name: for
          in: query
          required: true
          description: Permission the ticket should grant.
          schema:
            type: string
            enum: [containers.view, containers.logs, containers.exec, system.view]
      responses:
        "200":
          description: Ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        "400": { description: missing or invalid for=<perm> }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: caller's role lacks the requested permission }

  /ws/logs/{id}:
    get:
      operationId: ws.logs
      tags: [containers]
      summary: WebSocket stream of container stdout/stderr
      description: |
        Upgrade path for container log streaming. Pass `?ticket=<jwt>`
        for auth (see `POST /ws/ticket`). Server writes lines as text
        frames. The HTTP response code only shows up if the upgrade
        fails — otherwise it's 101 Switching Protocols.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Container id.
        - $ref: "#/components/parameters/HostQuery"
        - name: ticket
          in: query
          required: true
          schema: { type: string }
        - name: tail
          in: query
          schema: { type: string, default: "100" }
          description: "`all` or an integer — number of existing lines to send before following."
        - name: follow
          in: query
          schema: { type: boolean, default: true }
      responses:
        "101":
          description: Upgraded to WebSocket.
        "401":
          description: Missing / invalid ticket.
        "404": { $ref: "#/components/responses/NotFound" }

  /ws/stats/{id}:
    get:
      operationId: ws.stats
      tags: [containers]
      summary: WebSocket stream of per-container stats samples
      description: Ticket auth via `?ticket=`. Server emits JSON frames (cpu %, mem, network, block IO) at docker's cadence.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/HostQuery"
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Upgraded to WebSocket.
        "401":
          description: Missing / invalid ticket.
        "404": { $ref: "#/components/responses/NotFound" }

  /ws/exec/{id}:
    get:
      operationId: ws.exec
      tags: [containers]
      summary: Interactive exec session (pty) over WebSocket
      description: |
        Bidirectional: server writes merged stdout/stderr as binary
        frames; client writes stdin the same way. Control frames
        (JSON) carry tty-resize events.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/HostQuery"
        - name: ticket
          in: query
          required: true
          description: Single-use ticket from `POST /ws/ticket?for=containers.exec`.
          schema: { type: string }
        - name: cmd
          in: query
          schema: { type: string, default: "/bin/sh" }
          description: Command to exec. `sh` or `bash` are the usual picks.
      responses:
        "101":
          description: Upgraded to WebSocket.
        "401":
          description: Missing, invalid or already used ticket.
        "403":
          description: Ticket not minted for exec, permission lost, or container outside the caller's host or role scope.
        "404": { $ref: "#/components/responses/NotFound" }

  /ws/events:
    get:
      operationId: ws.events
      tags: [containers]
      summary: WebSocket fan-out of container / stack change events
      description: |
        Global event stream — container state transitions, stack file
        changes (fsnotify), deploy completions. The UI subscribes once
        and invalidates its client-side caches as events arrive.
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Upgraded to WebSocket.
        "401":
          description: Missing / invalid ticket.

  /containers/{id}/metrics:
    get:
      operationId: containers.metrics
      tags: [containers]
      summary: Historical CPU / memory / network / disk samples
      description: |
        Returns time-series samples from the internal metrics collector
        (30s raw, 1m, 1h retention per concept §15.4). Used by the
        container detail page's charts.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - name: resolution
          in: query
          schema: { type: string, enum: [raw, 1m, 1h], default: raw }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Metric samples.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ts: { type: string, format: date-time }
                    cpu_percent: { type: number }
                    mem_bytes: { type: integer, format: int64 }
                    mem_percent: { type: number }
                    net_rx_bytes: { type: integer, format: int64 }
                    net_tx_bytes: { type: integer, format: int64 }
                    block_read_bytes: { type: integer, format: int64 }
                    block_write_bytes: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # Container filesystem browser — list dir / read text preview / stream
  # raw download / upload. All four endpoints walk the daemon's
  # CopyFromContainer / CopyToContainer tars so they work against scratch
  # and distroless images (no shell inside the container required).
  # -----------------------------------------------------------------------
  /containers/{id}/files:
    get:
      operationId: containers.files.browse
      tags: [containers]
      summary: List one directory level inside a container's filesystem
      description: |
        Tar-streams the requested path out of the container and walks
        the archive at depth 1. Path must be absolute. Requires
        `containers.exec`, like every container file endpoint, and is
        audited on every call.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
        - name: path
          in: query
          schema: { type: string, default: "/" }
          description: Absolute path inside the container.
      responses:
        "200":
          description: Directory entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VolumeEntry" }
        "400":
          description: Path is empty, not absolute, or points to a non-directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: containers.files.write
      tags: [containers]
      summary: Upload a single file into the container at an absolute path
      description: |
        Requires `containers.exec` because writing a file into a running
        container is effectively code injection. Parent directory must
        already exist. Content is base64-encoded so binary uploads work
        over plain JSON.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path:
                  type: string
                  description: Absolute path inside the container.
                content:
                  type: string
                  description: Base64-encoded file content.
                mode:
                  type: integer
                  description: Unix permission bits; defaults to 0644 (420).
      responses:
        "200":
          description: File written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  bytes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/files/content:
    get:
      operationId: containers.files.read
      tags: [containers]
      summary: Read a file inside the container as a text/binary preview
      description: |
        Requires `containers.exec`; audited.
        Returns up to 1 MiB of content. `truncated: true` signals the
        file is larger — the UI then offers a download link. `binary:
        true` is set when a NUL byte appears in the first 8 KiB (same
        heuristic git uses) so the UI can avoid rendering garbage.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFileResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /containers/{id}/files/download:
    get:
      operationId: containers.files.download
      tags: [containers]
      summary: Stream a file's raw bytes out of the container for download
      description: |
        Streams `application/octet-stream` with `Content-Disposition:
        attachment` so the browser triggers a file save. Used for binary
        files and files larger than the preview cap. Requires
        `containers.exec`; audited.
      parameters:
        - $ref: "#/components/parameters/ContainerIDPath"
        - $ref: "#/components/parameters/HostQuery"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Raw file bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------
  # SSO additions (Tier C) — SAML, LDAP, OAuth2 alongside existing OIDC.
  # Plus auth-policy + avatar + alerts/global-env enhancements from Tier A/B.
  # -----------------------------------------------------------------------

  /auth/signin:
    get:
      operationId: auth.signin_config_get
      tags: [auth]
      summary: Read the sign-in policy (session TTLs and limits)
      description: |
        `session_idle_ttl_min`, `session_absolute_ttl_hr` and
        `session_max_per_user` are enforced. `allow_local_password`,
        `require_tfa_for_admin`, `allow_self_register`,
        `session_remember_me_days` and `password_forbid_reuse_count` are
        stored and returned, not enforced.
      responses:
        "200":
          description: Current sign-in policy.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      operationId: auth.signin_config_update
      tags: [auth]
      summary: Update the sign-in policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /sessions/revoke-all:
    post:
      operationId: sessions.revoke_all
      tags: [auth]
      summary: Revoke every active session of the caller
      responses:
        "204": { description: Revoked. }

  /users/{id}/avatar:
    get:
      operationId: users.avatar_get
      tags: [users]
      summary: Serve a user's avatar bytes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Avatar bytes.
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: users.avatar_upload
      tags: [users]
      summary: Upload (or replace) the user's avatar — png/jpeg/webp, ≤1 MiB
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "204": { description: Stored. }
    delete:
      operationId: users.avatar_delete
      tags: [users]
      summary: Remove the user's avatar
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed. }

  /global-env/{id}/refs:
    get:
      operationId: global_env.refs
      tags: [global-env]
      summary: List stacks referencing the given global-env key (compose ${VAR} scan)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Stack names that reference this global env entry.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /stacks/{name}/deploy/progress:
    get:
      operationId: stacks.deploy_progress
      tags: [stacks]
      summary: Live phase + service + elapsed for an in-flight deploy
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Progress snapshot, or null when no deploy is tracked.
          content:
            application/json:
              schema:
                oneOf:
                  - { type: "null" }
                  - { type: object, additionalProperties: true }

  /notifications:
    get:
      operationId: notifications.list
      tags: [settings]
      summary: List the caller's notifications (own + broadcast), newest first
      parameters:
        - in: query
          name: unread
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /notifications/unread-count:
    get:
      operationId: notifications.unread_count
      tags: [settings]
      summary: Bell-icon badge count — unread notifications for the caller
      responses:
        "200":
          description: Count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }

  /notifications/{id}/read:
    post:
      operationId: notifications.mark_read
      tags: [settings]
      summary: Mark a single notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Marked. }
        "403": { description: Not your notification. }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/read-all:
    post:
      operationId: notifications.mark_all_read
      tags: [settings]
      summary: Clear the unread badge for the caller (own + broadcast)
      responses:
        "204": { description: Cleared. }

  /notifications/{id}:
    delete:
      operationId: notifications.delete
      tags: [settings]
      summary: Hard-delete a notification from the caller's feed
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Deleted. }
        "403": { description: Not your notification. }
        "404": { $ref: "#/components/responses/NotFound" }

  /notices:
    get:
      operationId: notices.list
      tags: [settings]
      summary: Open action-required notices for the caller
      description: |
        Notices that need someone to act, typically after an upgrade (for
        example "webhook disabled, secret missing"). Only notices whose
        audience includes the caller are returned; they disappear once the
        server resolves the condition. `dismissed` reflects the caller's own
        banner dismissal.
      responses:
        "200":
          description: Open notices, critical first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notice" }

  /attention:
    get:
      operationId: attention.list
      tags: [overview]
      summary: What needs attention in the caller's scope
      description: |
        Aggregates, from existing state: offline hosts (`hosts.view`),
        restarting, unhealthy and non-zero exited containers
        (`containers.view`), the failed last run of each enabled backup job
        (`backups.view`), proxy certificates expiring within 30 days
        (`proxy.view`), firing alerts (`alerts.view`) and the caller's open
        action-required notices, plus agents on a different build than the
        server (`hosts.view`) and image updates (`images.view`) as `info`.
        A firing alert is left out when another source lists the same
        problem for the same object. A source is skipped when the caller
        lacks its permission, and items outside the caller's host or role
        scope are left out; scoped callers see no alerts of the kinds that
        belong to no host (backups, certificates), as in the alert history.
        Any authenticated caller may call this. Sorted by severity, then
        newest first; items without `since` come last within their
        severity.
      responses:
        "200":
          description: Items, most severe first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttentionItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notices/{id}/dismiss:
    post:
      operationId: notices.dismiss
      tags: [settings]
      summary: Hide a non-critical notice from the caller's banner
      description: |
        Per user. The notice stays listed until it is resolved, and is shown
        again if the condition is resolved and comes back. Requires a user
        session; API tokens get 404.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Dismissed (idempotent). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /alerts/rules/{id}/stats:
    get:
      operationId: alerts.rule_stats
      tags: [alerts]
      summary: Per-rule firing stats (last 24h, last fire, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Stats snapshot.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /hosts/{id}/stats/containers:
    get:
      operationId: hosts.batch_container_stats
      tags: [containers]
      summary: Latest CPU + memory sample per container (used by list view)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Array of latest samples.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /oidc/providers/{id}/test:
    post:
      operationId: oidc.provider_test
      tags: [oidc]
      summary: Re-run discovery against a stored provider, persist result
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Result + endpoints (when ok).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  # ---------------------- backups: single-run + archive ------------------
  /backups/runs/{id}:
    get:
      operationId: backups.run_get
      tags: [backups]
      summary: Get a single run
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Run row.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/runs/{id}/log:
    get:
      operationId: backups.run_log
      tags: [backups]
      summary: Captured log lines for a backup run (phase narration + hook output)
      description: |
        Returns lines emitted by the executor for one run in
        chronological order. Each entry has `stream` set to one of
        `info` / `warn` / `error` / `hook_stdout` / `hook_stderr`. Hook
        output is verbatim and capped at 16 KB per hook to keep the
        table from growing without bound on noisy hooks.

        Requires the job's host within the caller's scope (403). System
        runs, and runs whose job was deleted, are admin-only
        (`system.update` with no host or role scope).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Log entries (empty array if the run hasn't logged anything yet).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, ts, stream, line]
                  properties:
                    id: { type: integer, format: int64 }
                    ts: { type: string, format: date-time }
                    stream:
                      type: string
                      enum: [info, warn, error, hook_stdout, hook_stderr]
                    line: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/runs/{id}/archive:
    get:
      operationId: backups.run_archive
      tags: [backups]
      summary: Download the archive for a successful run (tar.gz stream, transparent decryption)
      description: |
        Requires `backups.download` and the job's host within the caller's
        scope. System archives, and runs whose job was deleted, are
        admin-only (`system.update` with no host or role scope). Every
        download is audited as `backup.download`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Archive bytes.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Run not in success state.
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------- SAML -------------------------------------------
  /auth/saml/providers:
    get:
      operationId: saml.providers_public
      tags: [auth]
      summary: Public list of enabled SAML providers (for login-page buttons)
      security: []
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug: { type: string }
                    display_name: { type: string }

  /auth/saml/{slug}/login:
    get:
      operationId: saml.login_start
      tags: [auth]
      summary: Begin SAML AuthnRequest — redirects to IdP
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirect to IdP. }

  /auth/saml/{slug}/acs:
    post:
      operationId: saml.acs
      tags: [auth]
      summary: Assertion-consumer endpoint — receives the signed SAMLResponse
      description: |
        Needs the state cookie set by `/auth/saml/{slug}/login` and a response to a sign-in
        request this server issued; each request can be answered once.
        Over HTTPS the state cookie is `SameSite=None; Secure` so the
        identity provider's cross-site POST carries it. Over plain HTTP it
        stays `Lax` and only an identity provider on the same site works.
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "302":
          description: |
            Redirect to `/login?sso_code=...` (one-time code for `/auth/sso/exchange`), or to
            `/login?sso_error=...` when the sign-in failed (for example no
            state cookie, a reused response, or no stable subject).

  /auth/saml/{slug}/metadata:
    get:
      operationId: saml.sp_metadata
      tags: [auth]
      summary: SP metadata XML (admin pastes URL into the IdP)
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SP metadata.
          content:
            application/samlmetadata+xml:
              schema: { type: string }

  /saml/providers:
    get:
      operationId: saml.providers_list
      tags: [oidc]
      summary: Admin — list SAML providers
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
    post:
      operationId: saml.provider_create
      tags: [oidc]
      summary: Admin — create SAML provider (paste IdP metadata XML)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SAMLProviderInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /saml/providers/{id}:
    get:
      operationId: saml.provider_get
      tags: [oidc]
      summary: Admin — get one SAML provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      operationId: saml.provider_update
      tags: [oidc]
      summary: Admin — update SAML provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SAMLProviderInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: saml.provider_delete
      tags: [oidc]
      summary: Admin — delete SAML provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Deleted. }

  /saml/providers/{id}/test:
    post:
      operationId: saml.provider_test
      tags: [oidc]
      summary: Re-parse stored IdP metadata + persist result
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /saml/rekey:
    get:
      operationId: saml.rekey_pending
      tags: [oidc]
      summary: Admin — accounts still waiting for their one-time SAML re-key
      description: |
        Accounts created through SAML before stable subjects may take their
        new subject once, at a sign-in from the same provider with the same
        email, until the date in `until` (30 days after the upgrade).
      responses:
        "200":
          description: Pending re-keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { type: string }
                  until: { type: string, format: date-time, description: Latest end of the re-key window. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /saml/rekey/end:
    post:
      operationId: saml.rekey_end
      tags: [oidc]
      summary: Admin — end the one-time SAML re-key for all remaining accounts
      description: Clears every re-key mark and writes `auth.saml_rekey_end` to the audit log.
      responses:
        "200":
          description: Number of accounts whose re-key was ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ended: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------- LDAP -------------------------------------------
  /auth/ldap/providers:
    get:
      operationId: ldap.providers_public
      tags: [auth]
      summary: Public list of enabled LDAP providers
      security: []
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug: { type: string }
                    display_name: { type: string }

  /auth/ldap/{slug}/login:
    post:
      operationId: ldap.login
      tags: [auth]
      summary: Authenticate against an LDAP provider (bind-and-search)
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session pair.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401":
          description: Bad credentials.
        "429":
          description: Too many failed logins from this IP or for this username (10 per 15 minutes each).
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ldap/providers:
    get:
      operationId: ldap.providers_list
      tags: [oidc]
      summary: Admin — list LDAP providers
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
    post:
      operationId: ldap.provider_create
      tags: [oidc]
      summary: Admin — create LDAP provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
