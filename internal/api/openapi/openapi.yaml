components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "JWT or dmt_<40-char-base64url>"
      description: |
        Accepts either a user session JWT (from `POST /auth/login`) or an API
        token (prefix `dmt_`, from Settings → API Tokens). The route layer
        checks role permissions after authentication.

  # Schemas used across multiple groups live here. Group-specific schemas
  # live inline under the operation to keep the spec readable when new
  # groups get added.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid credentials

    ReleaseNotes:
      type: object
      required: [version, highlights, added, changed, fixed, security]
      properties:
        version: { type: string, example: 0.5.0 }
        date: { type: string, format: date }
        severity: { type: string, enum: [security, recommended, normal] }
        summary: { type: string }
        highlights: { type: array, items: { type: string }, description: 3-4 plain-language lines; may be empty. }
        added: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
        fixed: { type: array, items: { type: string } }
        security: { type: array, items: { type: string }, description: Security entries, advisories as "GHSA-… (severity): title". }
    AttentionItem:
      type: object
      required: [id, kind, severity, title, link, object]
      properties:
        id: { type: string, description: "Stable per condition, e.g. `backup_failed:3`." }
        kind:
          type: string
          enum: [host_offline, agent_outdated, container_restarting, container_unhealthy, container_exited, backup_failed, alert_firing, image_update, cert_expiring, notice]
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string }
        detail: { type: string, description: One line of context. }
        link: { type: string, description: "In-app path, e.g. /hosts/abc or /containers/123?host=abc." }
        object:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [host, container, mount, backup_job, image, proxy_route, domain, notice] }
            id: { type: string }
            name: { type: string }
            host_id: { type: string }
        since: { type: string, format: date-time, description: When the condition started or was last observed; absent when unknown. }

    Notice:
      type: object
      required: [id, key, severity, title, created_at, dismissible, dismissed]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: Stable identifier of the condition. }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        body: { type: string, description: Plain text instructions. }
        link: { type: string, description: In-app path where the action is taken, e.g. /stacks/web. }
        created_at: { type: string, format: date-time }
        dismissible: { type: boolean, description: False for critical notices. }
        dismissed: { type: boolean }

    Empty:
      type: object
      description: Empty body — use for 204 No Content endpoints.

    Session:
      type: object
      required: [family_id, created_at, expires_at, is_current]
      description: One active login session — owned by the caller.
      properties:
        family_id: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        is_current:
          type: boolean
          description: True when this is the session the request came from.

    PasswordPolicy:
      type: object
      description: |
        Password-complexity + account-lockout + rotation config
        (P.12.1). All fields are optional — omitted values keep their
        current stored value on PUT. Defaults on a fresh install:
        min_length=8, no class requirements, lockout_max_attempts=5
        after 15-minute window.
      properties:
        min_length: { type: integer, minimum: 1, maximum: 256 }
        require_upper: { type: boolean }
        require_lower: { type: boolean }
        require_digit: { type: boolean }
        require_symbol: { type: boolean }
        rotation_days:
          type: integer
          minimum: 0
          description: Stored and returned, not enforced.
        lockout_max_attempts:
          type: integer
          minimum: 0
          description: 0 = disabled. Consecutive failed logins before the account is locked.
        lockout_duration_minutes:
          type: integer
          minimum: 0
          description: 0 = disabled. How long the account stays locked once the threshold is hit.

    User:
      type: object
      required: [id, username, role, mfa_enabled]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: operator }
        scope_tags:
          type: array
          items: { type: string }
          description: Host tags this user is scoped to. Empty / omitted = access to all hosts.
        mfa_enabled: { type: boolean }
        locked_until:
          type: string
          format: date-time
          description: Only in the user list, while the account is blocked by failed sign-ins. Clear it with the unlock endpoint.

    StackInput:
      type: object
      required: [name, compose]
      description: Payload for create / update.
      properties:
        name: { type: string, example: my-app }
        compose:
          type: string
          description: Full compose.yaml content.
        env:
          type: string
          description: Optional plaintext .env content. Stored age-encrypted when secrets encryption is enabled.

    StackDetail:
      type: object
      required: [name, compose]
      properties:
        name: { type: string }
        compose: { type: string }
        env: { type: string }
        modified_outside:
          type: array
          items: { type: string }
          description: Stack files changed outside Dockmesh since it last wrote them; the next deploy needs `confirm_external=1`.
        mounts_stack_dir:
          type: boolean
          description: A service bind-mounts the stack directory writable and can change compose.yaml and .env.

    StackDeployment:
      type: object
      description: Where and when a stack was last deployed.
      properties:
        host_id: { type: string }
        host_name: { type: string }
        deployed_at: { type: string, format: date-time }
        status: { type: string, enum: [deployed, failed, stopped, unknown] }

    StackListEntry:
      type: object
      properties:
        name: { type: string }
        compose_path: { type: string }
        deployment: { $ref: "#/components/schemas/StackDeployment" }

    DiscoveredStack:
      type: object
      description: |
        A running compose project (grouped by `com.docker.compose.project`
        label) that has no matching stack directory under the server's
        stacks root. Returned by `GET /stacks/discovered`.
      required: [project_name, host_id, service_count]
      properties:
        project_name:
          type: string
          description: Value of the `com.docker.compose.project` label.
          example: audiobookshelf
        host_id: { type: string }
        host_name: { type: string }
        service_count:
          type: integer
          description: Number of distinct services (unique `com.docker.compose.service` values) in this project.
        services:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredStackService" }
        first_seen:
          type: string
          format: date-time
          description: Earliest container creation time in this project (best-effort).

    DiscoveredStackService:
      type: object
      required: [name, container_id, state]
      properties:
        name:
          type: string
          description: Value of the `com.docker.compose.service` label.
        container_id: { type: string }
        container_name: { type: string }
        state:
          type: string
          enum: [running, exited, created, paused, restarting, dead, removing]
        image: { type: string }

    StackAdoptInput:
      type: object
      required: [name, host_id, compose]
      description: Payload for `POST /stacks/adopt`.
      properties:
        name:
          type: string
          description: |
            Stack name under which to track this project. Must match the
            `com.docker.compose.project` label on the running containers
            — otherwise binding fails and no containers end up managed.
          example: audiobookshelf
        host_id:
          type: string
          description: Host on which the running project lives.
        compose:
          type: string
          description: Full compose.yaml content.
        env:
          type: string
          description: Optional plaintext .env content. Stored age-encrypted at rest.
        bundle:
          type: string
          description: |
            Optional base64-encoded tar.gz archive of supporting files
            relative to the compose.yaml (e.g. build contexts, config
            files referenced via `./relative/path` bind mounts). Extracted
            into `<stacks_root>/<name>/` alongside compose.yaml. If omitted,
            adoption proceeds in metadata-only mode and any relative
            path references will break on the first restart.
        accepted_warnings:
          type: array
          items: { type: string }
          description: |
            Warning codes the client has surfaced to the user and they
            explicitly acknowledged (e.g. "build-context", "relative-paths",
            "config-drift"). Recorded in the audit log so the adoption
            decision is reviewable after the fact.

    StackAdoptResult:
      type: object
      required: [name, host_id, bound_containers]
      properties:
        name: { type: string }
        host_id: { type: string }
        bound_containers:
          type: integer
          description: Number of running containers linked to this stack via `com.docker.compose.project` label.
        warnings:
          type: array
          items: { type: string }
          description: Warning codes the server surfaced during adoption (superset of what client sent).
        drift_services:
          type: array
          items: { type: string }
          description: |
            Services where the compose-computed config-hash differs from
            what's running on the host. A future explicit deploy will
            recreate these containers; an empty list means the next
            deploy is a no-op.

    DeployResult:
      type: object
      properties:
        stack: { type: string }
        created:
          type: array
          items: { type: string }
          description: Services whose containers were created fresh.
        updated:
          type: array
          items: { type: string }
        unchanged:
          type: array
          items: { type: string }
        skipped:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    StackCleanupPlan:
      type: object
      description: |
        Enumerates resources that would be removed by the matching
        DELETE cleanup flags. External volumes and shared images are
        already filtered out.
      properties:
        networks:
          type: array
          items: { type: string }
        volumes:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string }
        skipped_external:
          type: array
          items: { type: string }
          description: Human-readable entries for resources intentionally skipped (e.g. external volumes).
        skipped_in_use:
          type: array
          items: { type: string }
          description: Resources skipped because they are still referenced outside this project (e.g. shared images).

    StackCleanupResult:
      type: object
      description: Actually-removed resources from a cleanup pass.
      properties:
        networks:
          type: array
          items: { type: string }
        volumes:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { type: string }

    ScalingRule:
      type: object
      required: [service, metric, operator, threshold]
      properties:
        service: { type: string }
        metric: { type: string, enum: [cpu_percent, mem_percent] }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        min_replicas: { type: integer }
        max_replicas: { type: integer }
        cooldown_seconds: { type: integer }
        duration_seconds: { type: integer }

    OIDCProvider:
      type: object
      required: [id, slug, display_name, issuer_url, client_id, default_role, enabled]
      description: Configured OIDC provider. `client_secret` is redacted.
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, example: google }
        display_name: { type: string }
        issuer_url: { type: string, format: uri }
        client_id: { type: string }
        scopes: { type: string, example: "openid profile email" }
        group_claim: { type: string }
        admin_group: { type: string }
        operator_group: { type: string }
        default_role: { type: string }
        allow_email_link:
          type: boolean
          description: Attach a login to an existing account with the same email when the IdP marks the email verified. Off by default.
        default_scope_tags:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SAMLProviderInput:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string }
        display_name: { type: string }
        idp_metadata_xml:
          type: string
          description: IdP metadata XML. Required on create; empty on update keeps the stored metadata.
        nameid_format:
          type: string
          enum:
            - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
            - urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
            - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
          description: |
            NameID format requested from the IdP; the NameID keys the account
            unless `subject_attribute` is set. Empty means persistent.
            emailAddress changes when the user's email does.
        subject_attribute:
          type: string
          description: |
            Attribute whose value keys the account instead of the NameID, for
            example `http://schemas.microsoft.com/identity/claims/objectidentifier`
            for Microsoft Entra ID. Empty uses the NameID.
        username_attribute: { type: string }
        email_attribute: { type: string }
        groups_attribute: { type: string }
        default_role: { type: string }
        group_mappings:
          type: array
          items:
            type: object
            properties:
              group: { type: string }
              role: { type: string }
        allow_email_link: { type: boolean }
        enabled: { type: boolean }
        is_default: { type: boolean }

    OIDCProviderInput:
      type: object
      required: [slug, display_name, issuer_url, client_id, default_role]
      properties:
        slug: { type: string }
        display_name: { type: string }
        issuer_url: { type: string, format: uri }
        client_id: { type: string }
        client_secret:
          type: string
          format: password
          description: Omit / empty on update to keep the existing secret.
        scopes: { type: string }
        group_claim: { type: string }
        admin_group: { type: string }
        operator_group: { type: string }
        default_role: { type: string }
        allow_email_link:
          type: boolean
          description: Attach a login to an existing account with the same email when the IdP marks the email verified. Off by default.
        enabled: { type: boolean }

    ApiToken:
      type: object
      description: |
        Long-lived bearer token. Plaintext is NEVER returned except the
        one-time create response. A token belongs to the user who created
        it (`created_by`): requests need the token's role AND the owner's
        current role to allow them, and run with the owner's host scope.
        Tokens created before owners were recorded are `legacy`: they keep
        their role and have no owner.
      required: [id, prefix, name, role, legacy, created_at]
      properties:
        id: { type: integer, format: int64 }
        prefix: { type: string, example: "dmt_A7f3X9c4" }
        name: { type: string }
        role: { type: string }
        created_by: { type: string, description: Owning user id. }
        legacy: { type: boolean, description: No owner on record; works with its pinned role. }
        owner_missing:
          type: boolean
          description: The owner was deleted; the token no longer authenticates.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        last_used_ip: { type: string }
        revoked_at: { type: string, format: date-time }

    Registry:
      type: object
      description: Saved private-registry credentials (P.11.7).
      required: [id, name, url, has_password, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url: { type: string, example: ghcr.io }
        username: { type: string }
        has_password:
          type: boolean
          description: True when a password is stored. The plaintext is never returned.
        scope_tags:
          type: array
          items: { type: string }
          description: Host tag scope. Empty = apply to all hosts.
        last_tested_at: { type: string, format: date-time }
        last_test_ok: { type: boolean }
        last_test_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegistryInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        username: { type: string }
        password:
          type: string
          format: password
          description: Omit / empty on update to keep the existing password.
        clear_password:
          type: boolean
          description: Explicitly wipe the stored password. Takes precedence over `password`.
        scope_tags:
          type: array
          items: { type: string }

    GlobalEnvItem:
      type: object
      required: [id, key, value, group_name, encrypted]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string }
        value:
          type: string
          description: Empty for secret (`encrypted`) variables; their value is never returned.
        group_name: { type: string }
        encrypted:
          type: boolean
          description: True when the variable is marked secret; its value is write-only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GlobalEnvInput:
      type: object
      required: [key, value, group_name]
      properties:
        key: { type: string }
        value:
          type: string
          description: On update of a secret variable, empty keeps the stored value.
        group_name: { type: string, example: production }
        encrypted:
          type: boolean
          description: Marks the value as secret so it is never returned by the API.

    CustomRole:
      type: object
      required: [name, display, permissions]
      properties:
        name: { type: string, example: operator }
        display: { type: string, example: "Operator" }
        description:
          type: string
          description: One-line human blurb shown under the role name in the Roles UI.
          example: "Deploy and operate stacks. No editing of compose files, no user management."
        builtin:
          type: boolean
          description: "Built-in roles cannot be renamed or deleted (the five v2 roles: viewer, operator, deployer, host-admin, admin)."
        permissions:
          type: array
          items: { type: string }
        scopes:
          type: array
          description: Per-role scope rows. Empty = unscoped (acts on everything its permissions allow). Each row narrows scope to a specific host, stack, or all hosts carrying a tag. Effective scope is the UNION of all rows for the role.
          items: { $ref: "#/components/schemas/RoleScope" }

    RoleScope:
      type: object
      required: [scope_type, scope_value]
      properties:
        scope_type:
          type: string
          enum: [host, stack, host_tag]
        scope_value:
          type: string
          description: Host id, stack name, or host-tag string depending on scope_type.

    RoleInput:
      type: object
      required: [name, display, permissions]
      properties:
        name: { type: string, example: deploy-bot }
        display: { type: string }
        description:
          type: string
          description: Optional one-line human blurb. Shown under the role name in the Roles UI.
        permissions:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/RoleScope" }

    BackupSource:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [volume, stack, system]
          description: "`system` snapshots the Dockmesh server's own DB + stacks tree."
        name: { type: string, description: "Ignored for system source." }

    BackupHook:
      type: object
      description: docker-exec invocation used to quiesce a container before the snapshot (e.g. pg_dump).
      required: [container, cmd]
      properties:
        container: { type: string }
        cmd:
          type: array
          items: { type: string }

    BackupJob:
      type: object
      required: [id, name, target_type, sources, schedule, enabled]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        target_id: { type: integer, format: int64, description: Saved target (backup_targets) the job writes to. }
        target_type: { type: string, enum: [local, sftp, smb, webdav, s3], description: Type of the referenced target. }
        target_config:
          type: object
          description: >-
            Empty for jobs that reference a saved target; the configuration lives on the target.
            For a job not yet moved to a saved target, secret fields (`password`, `secret_key`, `private_key`) are
            returned as `""` with a sibling `<field>_set: true` when a value is stored.
        sources:
          type: array
          items: { $ref: "#/components/schemas/BackupSource" }
        schedule: { type: string, description: Cron expression. }
        retention_count: { type: integer, minimum: 0 }
        retention_days: { type: integer, minimum: 0 }
        encrypt: { type: boolean, description: Encrypt the tarball with the age key. }
        pre_hooks:
          type: array
          items: { $ref: "#/components/schemas/BackupHook" }
        post_hooks:
          type: array
          items: { $ref: "#/components/schemas/BackupHook" }
        enabled: { type: boolean }
        last_run_at: { type: string, format: date-time }
        next_run_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BackupJobInput:
      type: object
      required: [name, sources, schedule]
      properties:
        name: { type: string }
        target_id: { type: integer, format: int64, description: Saved target to write to. When set, target_type and target_config are ignored. }
        target_type: { type: string, enum: [local, sftp, smb, webdav, s3], description: Without target_id, the inline target is saved as a new target named after the job. }
        target_config: { type: object }
        sources:
          type: array
          minItems: 1
          maxItems: 1
          description: |
            Exactly one source per job. The server rejects multi-source
            payloads at create/update time. Operators back up several
            things by creating one job per source — keeps run records,
            schedules, retention, and restore semantics 1:1 with what
            the operator sees in the UI. P.13.5.
          items: { $ref: "#/components/schemas/BackupSource" }
        schedule: { type: string }
        retention_count: { type: integer, minimum: 0 }
        retention_days: { type: integer, minimum: 0 }
        encrypt: { type: boolean }
        pre_hooks:
          type: array
          items: { $ref: "#/components/schemas/BackupHook" }
        post_hooks:
          type: array
          items: { $ref: "#/components/schemas/BackupHook" }
        enabled: { type: boolean }

    BackupRun:
      type: object
      required: [id, job_id, job_name, status, started_at]
      properties:
        id: { type: integer, format: int64 }
        job_id: { type: integer, format: int64 }
        job_name: { type: string }
        status:
          type: string
          enum: [running, success, success_with_warnings, failed]
          description: success_with_warnings means the archive is complete and restorable but a post-hook failed; `error` holds the warning.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: Bytes stored on the target (after encryption). }
        target_path: { type: string, description: Archive path on the target. Empty for failed runs once the partial file was removed. }
        sha256: { type: string, description: SHA-256 of the archive as stored on the target (ciphertext for encrypted runs). }
        encrypted: { type: boolean }
        error: { type: string }
        pruned_at: { type: string, format: date-time, description: Set when the archive was deleted (retention); the run can no longer be restored. }
        sources:
          type: array
          items: { $ref: "#/components/schemas/BackupSource" }

    StagedRestore:
      type: object
      properties:
        staged_at: { type: string, format: date-time }
        source: { type: string, description: "run:<id>, upload:<file> or setup:<file>" }
        files: { type: integer }
        bytes: { type: integer, format: int64 }
        prev_dir: { type: string, description: Set once the swap started. }
        prev_stacks: { type: string }

    BackupRestoreRequest:
      type: object
      properties:
        dest_volume:
          type: string
          description: Volume runs. Docker volume name (`[a-zA-Z0-9][a-zA-Z0-9_.-]+`); paths are rejected with 400.
        target_stack: { type: string, description: Stack runs. Destination stack name. }
        host_id: { type: string, description: Docker host to restore onto; default is the host the backup was taken on. }
        mode: { type: string, enum: [merge, replace], default: merge }

    BackupRestoreReport:
      type: object
      properties:
        kind: { type: string, enum: [volume, stack] }
        stack_name: { type: string }
        host_id: { type: string }
        mode: { type: string, enum: [merge, replace] }
        files_restored: { type: array, items: { type: string } }
        volumes_restored: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    BackupVerifyResult:
      type: object
      description: |
        Result of extracting a system backup into a temp directory and
        running the post-restore sanity checks against the extracted
        files (P.12.4). The live install is never touched.
      properties:
        filename: { type: string, description: "Uploaded filename (only set for /restore/verify)." }
        counts:
          type: object
          properties:
            files: { type: integer }
            bytes: { type: integer, format: int64 }
            skipped_links: { type: integer, description: Symlink/hardlink entries that were not extracted. }
        sanity:
          type: object
          required: [passed, checks]
          properties:
            passed: { type: boolean }
            summary: { type: string }
            checks:
              type: array
              items:
                type: object
                required: [name, status]
                properties:
                  name: { type: string, example: users.admin }
                  status:
                    type: string
                    enum: [ok, warn, fail]
                  message: { type: string }

    DeployHistoryEntry:
      type: object
      required: [id, stack_name, host_id, deployed_at]
      description: |
        One past deploy snapshot (P.12.6). `compose_yaml` is only populated
        on the single-entry GET; list responses omit it to stay small.
      properties:
        id:              { type: integer, format: int64 }
        stack_name:      { type: string }
        host_id:         { type: string }
        compose_yaml:    { type: string }
        services:
          type: array
          items:
            type: object
            required: [service, image]
            properties:
              service: { type: string }
              image:   { type: string }
        note:             { type: string }
        deployed_by:      { type: string, description: users.id (UUID-style). }
        deployed_by_name: { type: string, description: Email captured at query time for display. }
        deployed_at:      { type: string, format: date-time }

    RollingUpdateRequest:
      type: object
      description: |
        Override the service's compose `deploy.update_config`. All fields are
        optional — omitted fields fall back to compose, then to engine
        defaults (parallelism=1, order=stop-first, failure_action=pause).
      properties:
        parallelism:
          type: integer
          minimum: 1
          description: Replicas replaced per batch.
        delay_seconds:
          type: integer
          minimum: 0
          description: Wait between batches.
        order:
          type: string
          enum: [stop-first, start-first]
          description: |
            `stop-first` tears down an old replica before the new one starts.
            `start-first` brings up a sibling, waits healthy, then tears down
            the old replica — only safe when the service has no
            `container_name` and no hard host-port bindings.
        failure_action:
          type: string
          enum: [pause, continue, rollback]

    ContainerUpdateResult:
      type: object
      required: [container_id, container_name, image, old_digest, new_digest, updated]
      properties:
        container_id: { type: string, description: ID of the container now running under the name. }
        container_name: { type: string }
        image: { type: string, description: Image ref that was pulled (update) or the rollback tag (rollback). }
        old_digest: { type: string, description: Image ID before the change. }
        new_digest: { type: string, description: Image ID after the change. }
        updated: { type: boolean }
        rollback_tag: { type: string, description: Tag that keeps the previous image for a rollback. }
        history_id: { type: integer, format: int64 }
        stack: { type: string, description: Set when the container belongs to a managed stack and was rebuilt from its compose.yaml. }
    RollingUpdateResult:
      type: object
      required: [service, total_replicas, updated, failed, skipped, rolled_back, new_image]
      properties:
        service: { type: string }
        total_replicas: { type: integer }
        updated: { type: integer, description: Replicas successfully replaced. }
        failed:  { type: integer, description: Replicas whose replace attempt errored. }
        skipped: { type: integer, description: Replicas not attempted because the rollout paused or rolled back. }
        rolled_back: { type: boolean, description: True when failure_action=rollback kicked in and already-replaced replicas were reverted. }
        previous_image: { type: string, description: Image running on the replicas before the rollout started (rollback target). }
        new_image:      { type: string, description: Image the rollout was targeting. }
        errors:
          type: array
          items: { type: string }

    BackupTarget:
      type: object
      required: [id, name, type, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [local, sftp, smb, webdav, s3] }
        config:
          type: object
          description: >-
            Target-specific settings. Secret fields (`password`, `secret_key`, `private_key`) are returned as `""` with a sibling `<field>_set: true` when a value is stored. On update an empty or omitted secret keeps the stored value.
        status: { type: string, enum: [unknown, ok, degraded, unreachable] }
        total_bytes: { type: integer, format: int64 }
        used_bytes: { type: integer, format: int64 }
        last_checked_at: { type: string, format: date-time }
        job_count: { type: integer, description: "Backup jobs (not deleted ones) that write to this target. Only for callers without a host or role scope." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BackupTargetInput:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string }
        type: { type: string, enum: [local, sftp, smb, webdav, s3] }
        config: { type: object }

    BackupTargetTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        total_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64 }
        error: { type: string }

    BackupStatus:
      type: object
      properties:
        enabled: { type: boolean }
        last_run_at: { type: string, format: date-time }
        last_run_status: { type: string, enum: [success, failed, running] }
        last_run_size_bytes: { type: integer, format: int64 }
        last_run_age_seconds: { type: integer }
        next_run_at: { type: string, format: date-time }

    AlertRule:
      type: object
      required: [id, name, kind, metric, operator, threshold, enabled]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [metric, restart_loop, container_stopped, unhealthy, oom, host_offline, disk_usage, backup_failed, backup_missed, cert_expiry]
          description: Evaluator. Event kinds use container_filter as their target filter (container, agent, mount point, backup job or domain; "*" for all, which for disk_usage means mounts holding Docker data), threshold as restarts, percent or days, and duration_seconds as the restart window or offline time.
        container_filter: { type: string, description: '"*" or the exact name of the target the rule watches.' }
        scope_host: { type: string, description: Host id the rule is limited to; empty means every host. }
        scope_tag: { type: string, description: Host tag the rule is limited to; empty means any. }
        scope_stack: { type: string, description: Compose stack the rule is limited to (container kinds); empty means any. }
        mute_schedule: { type: string, description: JSON weekly quiet-hours schedule; empty means never muted. }
        metric: { type: string, enum: [cpu_percent, mem_percent, ""], description: Metric kind only. }
        operator: { type: string, enum: [gt, lt, ""], description: Metric kind only. }
        threshold: { type: number }
        duration_seconds: { type: integer, minimum: 0 }
        cooldown_seconds: { type: integer, minimum: 0 }
        channel_ids:
          type: array
          items: { type: integer, format: int64 }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
        builtin:
          type: boolean
          description: "Built-in rules (P.11.5) cannot be deleted; disable instead."
        muted_until: { type: string, format: date-time }
        firing_since: { type: string, format: date-time }
        last_triggered_at: { type: string, format: date-time }
        last_resolved_at: { type: string, format: date-time }

    AlertRuleInput:
      type: object
      required: [name]
      description: metric, operator and a non-zero threshold are required for the metric kind (the default).
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [metric, restart_loop, container_stopped, unhealthy, oom, host_offline, disk_usage, backup_failed, backup_missed, cert_expiry]
          description: Evaluator. Event kinds use container_filter as their target filter (container, agent, mount point, backup job or domain; "*" for all, which for disk_usage means mounts holding Docker data), threshold as restarts, percent or days, and duration_seconds as the restart window or offline time.
        container_filter: { type: string }
        scope_host: { type: string, description: Host id the rule is limited to; empty means every host. }
        scope_tag: { type: string, description: Host tag the rule is limited to; empty means any. }
        scope_stack: { type: string, description: Compose stack the rule is limited to (container kinds); empty means any. }
        mute_schedule: { type: string, description: JSON weekly quiet-hours schedule; empty means never muted. }
        metric: { type: string, enum: [cpu_percent, mem_percent, ""], description: Metric kind only. }
        operator: { type: string, enum: [gt, lt, ""], description: Metric kind only. }
        threshold: { type: number }
        duration_seconds: { type: integer, minimum: 0 }
        cooldown_seconds: { type: integer, minimum: 0 }
        channel_ids:
          type: array
          items: { type: integer, format: int64 }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
        muted_until: { type: string, format: date-time }

    AlertHistoryEntry:
      type: object
      required: [id, rule_id, rule_name, status, occurred_at]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        rule_name: { type: string }
        container_name: { type: string }
        status: { type: string, enum: [fired, resolved] }
        message: { type: string }
        value: { type: number }
        threshold: { type: number }
        kind: { type: string, description: Kind of the rule that produced the entry; empty if the rule was deleted. }
        host_id: { type: string, description: 'Host the entry came from ("local" for the server); empty for backup and certificate rules. Host-scoped callers only see entries of their hosts.' }
        notified:
          type: boolean
          description: False when the transition was recorded but channels were not notified (rule muted or inside its cooldown).
        occurred_at: { type: string, format: date-time }

    DiskMount:
      type: object
      required: [mount_point, fs_type, total, used, percent]
      properties:
        mount_point: { type: string }
        fs_type: { type: string }
        total: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        percent: { type: number }
        roles:
          type: array
          items:
            type: string
            enum: [docker_root, containerd_root, stacks, data, backup_target]
        error: { type: string, description: Set when usage could not be read (for example a hung network mount). }

    NotificationChannel:
      type: object
      required: [id, name, type]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          enum: [webhook, email, slack, discord, ntfy, gotify, teams, pagerduty, pushover]
        config:
          type: object
          description: >-
            Channel-type-specific. Secret fields (`password`, `token`,
            `integration_key`, `app_token`, `user_key`, and `url` for slack,
            discord, teams, webhook, ntfy and gotify) are returned as `""` with a sibling
            `<field>_set: true` when stored; an empty or omitted secret on
            update keeps the stored value.
        enabled: { type: boolean }
        mute_schedule: { type: string, description: JSON weekly quiet-hours schedule; empty means never muted. }
        last_sent_at: { type: string, format: date-time, description: Last successful delivery. }
        last_error: { type: string, description: Error of the last failed delivery after all retries. }
        last_error_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationChannelInput:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string }
        type: { type: string }
        config: { type: object }

    AuditRetentionConfig:
      type: object
      required: [mode]
      description: Retention policy for the tamper-evident audit log (P.11.13).
      properties:
        mode:
          type: string
          enum: [forever, days, archive_local, archive_target]
          description: |
            `forever` never prunes; `days` keeps the last N days;
            `archive_local` writes older entries as NDJSON to a local
            directory before prune; `archive_target` writes them to a
            saved backup_target (SFTP/SMB/WebDAV/S3/local) before prune.
        days:
          type: integer
          minimum: 1
          description: Retention window in days (required unless mode=forever).
        target_id:
          type: integer
          format: int64
          description: backup_targets.id — required when mode=archive_target.
        local_dir:
          type: string
          description: Filesystem directory for `archive_local`. Default `./data/audit-archive`.

    AuditRetentionPreview:
      type: object
      properties:
        mode: { type: string }
        cutoff_at: { type: string, format: date-time }
        would_prune: { type: integer }
        total_rows: { type: integer }
        oldest_at: { type: string, format: date-time }

    AuditRetentionResult:
      type: object
      required: [mode, pruned, duration_ms]
      properties:
        mode: { type: string }
        cutoff_at: { type: string, format: date-time }
        pruned: { type: integer }
        archived: { type: boolean }
        archive_path: { type: string, description: "Local path or target-relative object name when archived." }
        bridge_row_id:
          type: integer
          format: int64
          description: The id of the `audit.chain_bridge` row inserted before the prune.
        duration_ms: { type: integer, format: int64 }

    AuditWebhookConfig:
      type: object
      description: |
        Realtime webhook that posts every audit entry to an external URL
        (P.11.14). Payload = audit entry JSON; signed with HMAC-SHA256
        on `X-Audit-Signature` when a secret is configured.
      properties:
        url: { type: string, format: uri }
        has_secret: { type: boolean }
        filter_actions:
          type: array
          items: { type: string }
          description: Action names or prefix-wildcards (e.g. "stack.*"). Empty = deliver every entry.

    AuditWebhookInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: "http:// or https:// — empty value disables dispatch." }
        secret:
          type: string
          format: password
          description: "HMAC shared secret. Empty on update keeps existing; use `clear_secret: true` to wipe."
        clear_secret: { type: boolean }
        filter_actions:
          type: array
          items: { type: string }

    AuditEntry:
      type: object
      required: [id, ts, action, category]
      description: |
        Tamper-evident: each row's `row_hash` chains to the previous
        entry's `prev_hash`. The genesis row anchors the chain against a
        file stored outside the DB.
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        user_id: { type: string }
        username: { type: string }
        action: { type: string, example: container.start }
        category:
          type: string
          enum: [changes, access, auth, system]
          description: |
            Derived from `action`: `changes` created, changed or removed
            something; `access` read data (file browsing and reads, exec,
            backup downloads); `auth` sign-in, sessions, tokens, MFA, SSO
            and scope denials; `system` the server itself and the audit trail.
        target: { type: string }
        details: { type: string, description: JSON-encoded contextual metadata. }
        prev_hash: { type: string }
        row_hash: { type: string }

    StackTemplateParam:
      type: object
      required: [name]
      properties:
        name: { type: string, example: db_password }
        description: { type: string }
        type:
          type: string
          enum: [string, number, bool, secret]
        default: { type: string }
        secret:
          type: boolean
          description: When true, the server auto-generates a value if the caller leaves it blank.
        enum:
          type: array
          items: { type: string }
        pattern:
          type: string
          description: Regex the value must match.
        required: { type: boolean }

    StackTemplate:
      type: object
      required: [id, slug, name, compose, parameters, builtin, created_at, updated_at]
      description: Stack template (P.11.12). Built-in templates ship with the binary and cannot be edited or deleted.
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, example: postgres-16 }
        name: { type: string }
        description: { type: string }
        icon_url: { type: string, format: uri }
        compose:
          type: string
          description: "compose.yaml body with `{{param}}` placeholders."
        env:
          type: string
          description: "Optional .env template (same placeholder syntax)."
        parameters:
          type: array
          items: { $ref: "#/components/schemas/StackTemplateParam" }
        author: { type: string }
        version: { type: string }
        builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StackTemplateInput:
      type: object
      required: [slug, name, compose]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        icon_url: { type: string, format: uri }
        compose: { type: string }
        env: { type: string }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/StackTemplateParam" }
        author: { type: string }
        version: { type: string }

    StackGitSource:
      type: object
      description: Git repository a stack pulls its compose.yaml from (P.11.11). Secrets redacted.
      required: [stack_name, repo_url, branch, path_in_repo, auth_kind, poll_interval_sec, auto_deploy, has_password, has_ssh_key, has_webhook_secret, created_at, updated_at]
      properties:
        stack_name: { type: string }
        repo_url: { type: string, example: "https://github.com/acme/stack.git" }
        branch: { type: string, default: main }
        path_in_repo:
          type: string
          description: Directory containing compose.yaml (+ optional .env), or a direct file path.
          default: "."
        auth_kind:
          type: string
          enum: [none, http, ssh]
        username: { type: string, description: HTTP basic-auth username or SSH user (defaults to `git`). }
        has_password: { type: boolean }
        has_ssh_key: { type: boolean }
        auto_deploy:
          type: boolean
          description: When true, a successful sync with a new SHA triggers a deploy.
        poll_interval_sec:
          type: integer
          minimum: 60
          description: 0 = do not poll (webhook / manual sync only).
        has_webhook_secret:
          type: boolean
          description: Whether a webhook secret is set. Without one, `POST /stacks/{name}/git/webhook` is rejected.
        last_sync_sha: { type: string }
        last_sync_at: { type: string, format: date-time }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StackGitSourceInput:
      type: object
      required: [repo_url]
      properties:
        repo_url: { type: string }
        branch: { type: string }
        path_in_repo:
          type: string
          description: |
            Relative path inside the repository (directory or compose file).
            Absolute paths and ".." are rejected with 400; symlinks that
            lead outside the repository are not followed.
        auth_kind:
          type: string
          enum: [none, http, ssh]
        username: { type: string }
        password:
          type: string
          format: password
          description: HTTP basic auth password / PAT. Empty on update = keep existing.
        clear_password: { type: boolean }
        ssh_key:
          type: string
          description: OpenSSH private key (PEM). Empty on update = keep existing.
        clear_ssh_key: { type: boolean }
        auto_deploy: { type: boolean }
        poll_interval_sec:
          type: integer
          minimum: 60
        webhook_secret:
          type: string
          description: Shared secret for HMAC verification of incoming webhook pushes. At least 16 characters when set or changed (shorter secrets stored earlier keep working). Empty keeps the stored secret. Webhooks are rejected while no secret is set.
        clear_webhook_secret: { type: boolean, description: "Removes the secret, which disables the webhook." }

    StackGitSyncResult:
      type: object
      required: [new_sha, changed, duration_ms]
      properties:
        old_sha: { type: string }
        new_sha: { type: string }
        changed: { type: boolean }
        deployed:
          type: boolean
          description: True when auto_deploy fired and completed on this sync.
        deploy_result:
          type: object
          description: Deploy result when `deployed` is true; mirrors /stacks/{name}/deploy.
        duration_ms: { type: integer, format: int64 }

    ProxyRoute:
      type: object
      required: [id, host, upstream, tls_mode, enabled]
      properties:
        id: { type: integer, format: int64 }
        host: { type: string, example: app.example.com }
        upstream:
          type: string
          description: Dial address `host:port` the proxy forwards to, e.g. `127.0.0.1:8080`.
        tls_mode:
          type: string
          enum: [auto, internal, none]
          description: "`auto` gets a certificate via ACME, `internal` uses Caddy's own CA, `none` serves plain HTTP on port 80 only (no certificate, no redirect)."
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cert_issuer: { type: string }
        cert_valid_from: { type: string, format: date-time }
        cert_valid_to: { type: string, format: date-time }
        cert_days_left: { type: integer }
        options: { $ref: "#/components/schemas/ProxySiteOptions" }

    ProxyRouteInput:
      type: object
      required: [upstream]
      properties:
        host:
          type: string
          description: Required on create; ignored on update. A domain name (optionally `*.` wildcard) or a non-loopback IP; `localhost`, `*.localhost`, loopback addresses and a bare `*` are rejected (400).
        upstream:
          type: string
          description: |
            `host:port` with a hostname or IP and a port from 1 to 65535. Schemes,
            paths, placeholders and unix sockets are rejected (400), as is the
            proxy's own admin API (port 2019 on a loopback address or any name).
            Stored routes that fail these checks are not served, raise an admin
            notice, and can't be re-enabled until edited.
        tls_mode:
          type: string
          enum: [auto, internal, none]
          description: Defaults to `auto` on create.
        enabled: { type: boolean }
        options:
          allOf:
            - $ref: "#/components/schemas/ProxySiteOptions"
          description: |
            Per-site options. Omitted on update: the stored options are kept.
            Sent: they replace the stored options and fields left out take their
            default. A basic-auth user sent without `password` keeps the stored
            password of the same username. Invalid options are rejected with 400
            naming the field (`options.<section>.<field>: ...`); a www redirect
            onto a name that is a site of its own is rejected with 409.

    ProxySitePreview:
      type: object
      required: [route_id, enabled, blocked, config]
      properties:
        route_id: { type: integer, format: int64 }
        enabled: { type: boolean }
        blocked: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: Caddy JSON config (`apps.http`, `apps.tls`) for this site.

    ProxySiteOptions:
      type: object
      description: |
        Structured per-site proxy options. Every field defaults to Caddy's
        behaviour, so an empty object serves the site as a plain reverse proxy
        with HTTP redirected to HTTPS. Values are never passed to Caddy as raw
        directives; strings containing `{`, `}` or control characters are
        rejected.
      properties:
        routing:
          type: object
          properties:
            extra_upstreams:
              type: array
              maxItems: 16
              items: { type: string }
              description: More `host:port` upstreams load-balanced with `upstream`; same rules as `upstream`.
            lb_policy:
              type: string
              enum: ["", round_robin, least_conn, first, client_ip_hash]
              description: Empty is Caddy's default (random).
            health_path:
              type: string
              description: Path for active health checks of every upstream, e.g. `/health`. Empty disables them.
            www_redirect:
              type: boolean
              description: Also serve `www.<host>` with a permanent redirect to `<host>`. Not allowed for wildcard, IP or `www.` hosts.
        https:
          type: object
          properties:
            allow_http:
              type: boolean
              description: Serve a TLS site on plain HTTP too instead of redirecting HTTP to HTTPS.
            hsts:
              type: boolean
              description: "Send `Strict-Transport-Security: max-age=31536000`. Needs `tls_mode` auto or internal."
        performance:
          type: object
          properties:
            flush_immediately:
              type: boolean
              description: Pass each chunk of the response on at once (`flush_interval -1`), for SSE, live logs and streaming downloads.
            buffer_requests:
              type: boolean
              description: Buffer up to 4 MiB of the request body before sending it upstream. Off (default) streams uploads.
            dial_timeout: { type: string, example: 30s, description: "Connect timeout, Go duration from 1s to 168h. Empty: Caddy default." }
            read_timeout: { type: string, example: 1h, description: "Upstream read timeout, Go duration from 1s to 168h. Empty: no limit." }
            write_timeout: { type: string, example: 1h, description: "Upstream write timeout, Go duration from 1s to 168h. Empty: no limit." }
            max_body_bytes:
              type: integer
              format: int64
              minimum: 0
              description: Largest request body accepted (413 above it). 0 means no limit.
            stream_close_delay:
              type: string
              example: 5m
              description: Keep WebSockets and other streams open this long after a config reload. Empty closes them on reload.
            compression: { type: boolean, description: Compress responses with zstd or gzip. }
        access:
          type: object
          properties:
            basic_auth:
              type: array
              maxItems: 32
              items:
                type: object
                required: [username]
                properties:
                  username: { type: string, maxLength: 64 }
                  password:
                    type: string
                    writeOnly: true
                    minLength: 8
                    maxLength: 72
                    description: Stored as a bcrypt hash; never returned.
            ip_mode:
              type: string
              enum: ["", allow, deny]
              description: "`allow` answers 403 to clients outside `ip_ranges`, `deny` to clients inside. Uses the client address after trusted proxies."
            ip_ranges:
              type: array
              maxItems: 256
              items: { type: string, example: 192.168.10.0/24 }
              description: IP addresses or CIDR ranges, stored in CIDR form.
            forward_auth:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: http://authelia:9091/api/verify?rd=https://auth.example.org
                  description: Auth service URL; a 2xx answer lets the request through, any other answer is returned to the client.
                copy_headers:
                  type: array
                  items: { type: string }
                  description: Headers copied from the auth answer onto the request, e.g. `Remote-User`.
        headers:
          type: object
          properties:
            security:
              type: boolean
              description: "Adds `X-Content-Type-Options: nosniff`, `X-Frame-Options: SAMEORIGIN` and `Referrer-Policy: strict-origin-when-cross-origin`."
            request_set:
              type: array
              items: { $ref: "#/components/schemas/ProxyHeader" }
            request_remove:
              type: array
              items: { type: string }
            response_set:
              type: array
              items: { $ref: "#/components/schemas/ProxyHeader" }
            response_remove:
              type: array
              items: { type: string }
        logs:
          type: object
          properties:
            access_log:
              type: boolean
              description: Write an access log line per request of this site to the proxy container's log.

    ProxyImportResult:
      type: object
      required: [sites, global_unsupported, warnings]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [host, upstream, tls_mode, options, status, unsupported]
            properties:
              host: { type: string }
              upstream: { type: string }
              tls_mode: { type: string, enum: [auto, internal, none] }
              options: { $ref: "#/components/schemas/ProxySiteOptions" }
              status: { type: string, enum: [ready, partial, skipped] }
              unsupported:
                type: array
                items: { type: string }
                description: Directives of this site that were not imported.
              error: { type: string, description: Why a skipped site was not imported. }
              route_id: { type: integer, format: int64, description: Set when the site was created (disabled). }
        global_unsupported:
          type: array
          items: { type: string }
          description: Global options and other parts of the file that apply to no single site and were not imported.
        warnings:
          type: array
          items: { type: string }
          description: Caddy's adapter warnings.

    ProxyHeader:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string, maxLength: 4096 }

    DrainPlan:
      type: object
      description: |
        Map of source-host stacks to target hosts. Returned by
        `/hosts/{id}/drain/plan` and accepted as the input to
        `/hosts/{id}/drain/execute`.
      properties:
        source_host_id: { type: string, format: uuid }
        strategy: { type: string, enum: [least-loaded, explicit, round-robin] }
        assignments:
          type: array
          items:
            type: object
            required: [stack, target_host_id]
            properties:
              stack: { type: string }
              target_host_id: { type: string, format: uuid }
              target_host_name: { type: string }
              volume_bytes: { type: integer, format: int64 }

    DrainStatus:
      type: object
      required: [id, source_host_id, status]
      properties:
        id: { type: integer, format: int64 }
        source_host_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, paused, completed, failed, aborted]
        plan: { $ref: "#/components/schemas/DrainPlan" }
        progress:
          type: object
          properties:
            total: { type: integer }
            done: { type: integer }
            current_stack: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        message: { type: string }

    VolumeEntry:
      type: object
      description: One row in a volume directory listing (P.11.8).
      required: [name, type, size, mode, mod_time]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [file, dir, symlink]
        size: { type: integer, format: int64 }
        mode: { type: string, description: Unix-style "rwxr-xr-x" string. }
        mod_time: { type: string, format: date-time }
        link_dest: { type: string, description: For symlinks, the target path. }

    VolumeFileResult:
      type: object
      description: Inline file read from a volume (P.11.8).
      required: [content, size, truncated, binary]
      properties:
        content:
          type: string
          format: byte
          description: Base64-encoded file bytes — capped at 1 MiB.
        size:
          type: integer
          format: int64
          description: Actual file size on disk (may exceed content length when truncated).
        truncated: { type: boolean }
        binary:
          type: boolean
          description: True when the first 8 KiB contain a NUL byte.

    MigrationStatus:
      type: object
      required: [id, stack, status]
      properties:
        id: { type: integer, format: int64 }
        stack: { type: string }
        source_host_id: { type: string }
        target_host_id: { type: string }
        status:
          type: string
          enum: [pending, copying, deploying, verifying, succeeded, failed, rolled_back]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        progress_percent: { type: number }
        message: { type: string }

    Container:
      type: object
      description: |
        Docker container summary. Mirrors the Docker SDK's
        `container.Summary` with `host_id` + `host_name` added when the
        response comes from a fan-out list. Most fields are passthrough.
      properties:
        Id: { type: string }
        Names:
          type: array
          items: { type: string }
        Image: { type: string }
        ImageID: { type: string }
        Command: { type: string }
        Created: { type: integer, format: int64 }
        State:
          type: string
          enum: [created, restarting, running, removing, paused, exited, dead]
        Status: { type: string, example: "Up 5 minutes" }
        Labels:
          type: object
          additionalProperties: { type: string }
        host_id: { type: string }
        host_name: { type: string }

    FanOutResponse:
      type: object
      description: |
        Returned by list endpoints when `?host=all`. `items` is the flat
        aggregated list; `errors` lists hosts that failed to respond so
        the UI can show partial results with a warning banner.
      required: [items]
      properties:
        items:
          type: array
          items: { type: object }
          description: Rows from every host that answered. Shape depends on the endpoint.
        errors:
          type: array
          items:
            type: object
            properties:
              host_id: { type: string }
              host_name: { type: string }
              error: { type: string }

    HostInfo:
      type: object
      required: [id, name, kind, status]
      properties:
        id:
          type: string
          description: '"local" for the central daemon, otherwise an agent UUID.'
        name: { type: string }
        kind:
          type: string
          enum: [local, agent]
        status:
          type: string
          enum: [online, offline, pending, revoked]
        tags:
          type: array
          items: { type: string }

    Agent:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, online, offline, revoked]
        version: { type: string }
        os: { type: string }
        arch: { type: string }
        hostname: { type: string }
        docker_version: { type: string }
        cert_fingerprint: { type: string }
        last_seen_at: { type: string, format: date-time }
        online_since: { type: string, format: date-time }
        cert_expires_at:
          type: string
          format: date-time
          description: Expiry of the client cert the agent last connected with. Agents renew it automatically within 30 days of expiry.
        protocol_version:
          type: integer
          description: Agent protocol version of the live session; only set while online.
        update_recommended:
          type: boolean
          description: True while online if the agent speaks an older protocol than the server and lacks some features.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentCreateResult:
      type: object
      required: [agent, token, token_expires_at, enroll_url, agent_url, ca_fingerprint, install_hint]
      description: |
        Returned on agent creation and token rotation. `token` is shown
        only here; a lost or expired token is replaced via
        `POST /agents/{id}/rotate-token`.
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        token:
          type: string
          description: One-time enrollment token. Paste into the install command on the agent host.
        token_expires_at:
          type: string
          format: date-time
          description: When the token stops working (DOCKMESH_AGENT_ENROLL_TOKEN_TTL, default 24h).
        enroll_url:
          type: string
          format: uri
          description: https URL of the enrollment endpoint on the agent listener.
        agent_url:
          type: string
          description: wss:// URL the agent will dial after enrollment.
        ca_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the agents CA certificate; the agent refuses to enroll with any other CA.
        install_hint:
          type: string
          description: Single-line install command to run on the agent host as root.

    AgentUpgradePolicy:
      type: object
      description: Fleet-wide agent upgrade policy (P.11.16) + live snapshot.
      required: [mode, server_version, connected_total, connected_up_to_date, connected_pending]
      properties:
        mode:
          type: string
          enum: [auto, manual, staged]
        stage_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: Wave size as percent of drifted agents (staged mode).
        stage_gap_sec:
          type: integer
          minimum: 60
          description: Minimum seconds between staged waves.
        server_version: { type: string }
        connected_total: { type: integer }
        connected_up_to_date: { type: integer }
        connected_pending:
          type: integer
          description: Connected agents whose version != server_version.
        last_run_at: { type: string, format: date-time }

    AgentUpgradeInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, manual, staged]
        stage_percent: { type: integer, minimum: 1, maximum: 100 }
        stage_gap_sec: { type: integer, minimum: 60 }

    AgentEnrollRequest:
      type: object
      required: [token, hostname, os, arch, version]
      properties:
        token: { type: string }
        hostname: { type: string }
        os: { type: string, example: linux }
        arch: { type: string, example: amd64 }
        version: { type: string }
        docker_version: { type: string }

    AgentEnrollResponse:
      type: object
      required: [agent_id, agent_name, client_cert, client_key, ca_cert, agent_url]
      properties:
        agent_id: { type: string, format: uuid }
        agent_name: { type: string }
        client_cert: { type: string, description: PEM-encoded client cert. }
        client_key: { type: string, description: PEM-encoded private key (shown once). }
        ca_cert: { type: string, description: PEM-encoded CA cert the agent should pin. }
        agent_url: { type: string, description: wss:// URL the agent should dial. }

    LoginResult:
      type: object
      description: |
        Either a fresh session (access+refresh+user) or an MFA challenge
        (`mfa_required: true` + `mfa_token`) that clients must complete via
        `POST /auth/mfa` before getting a session.
      properties:
        access_token:
          type: string
          description: "15-minute-TTL JWT. Send as `Authorization: Bearer <token>`."
        refresh_token:
          type: string
          description: "Opaque token for `/auth/refresh`. Rotates on every use."
        user:
          $ref: "#/components/schemas/User"
        mfa_required:
          type: boolean
          description: "True when the user has MFA enabled — use `mfa_token` with `/auth/mfa`."
        mfa_token:
          type: string
          description: "Short-lived challenge token for the `/auth/mfa` completion."

  parameters:
    SetupHeader:
      name: X-Dockmesh-Setup
      in: header
      required: true
      description: Any non-empty value. Sent by the install wizard so other websites cannot trigger setup calls from a visitor's browser.
      schema: { type: string }
    HostQuery:
      name: host
      in: query
      description: "Target host id. Empty or `local` = central server's daemon; otherwise an agent UUID. `all` fans out to every online host."
      required: false
      schema:
        type: string
        default: local
    HostIDPath:
      name: id
      in: path
      description: Host id — "local" for the central daemon, otherwise an agent UUID.
      required: true
      schema:
        type: string
    ContainerIDPath:
      name: id
      in: path
      description: Container id (long or short form) or name.
      required: true
      schema:
        type: string
    StackNamePath:
      name: name
      in: path
      description: Stack name — matches `[a-z0-9][a-z0-9-]*[a-z0-9]`, 2..63 chars.
      required: true
      schema:
        type: string
    ServicePath:
      name: service
      in: path
      description: Service name as declared in the compose file.
      required: true
      schema:
        type: string
    IntIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Integer primary key.
    UserIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User id (UUID).
    ConfirmExternalQuery:
      name: confirm_external
      in: query
      required: false
      schema: { type: string, enum: ["1"] }
      description: Deploy stack files changed outside Dockmesh as they are and record them as reviewed.
    DrainIDPath:
      name: drain_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Drain run id.

  responses:
    StackModifiedOutside:
      description: compose.yaml or .env changed outside Dockmesh; repeat with `confirm_external=1` after reviewing them.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, files]
            properties:
              error: { type: string }
              code: { type: string, enum: [modified_outside] }
              stack: { type: string }
              files:
                type: array
                items: { type: string }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but the token's role lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request body or invalid parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The operation conflicts with existing state (e.g. duplicate name, built-in rule deletion).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
