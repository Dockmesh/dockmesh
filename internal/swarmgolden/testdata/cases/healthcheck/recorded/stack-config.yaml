version: "3.13"
services:
  cmd:
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/
      timeout: 3s
      interval: 10s
      retries: 3
      start_period: 5s
    image: nginx:1.29-alpine
  disabled:
    healthcheck:
      disable: true
    image: nginx:1.29-alpine
  shell:
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ || exit 1
    image: nginx:1.29-alpine
