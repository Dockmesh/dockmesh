version: "3.13"
services:
  app:
    command:
      - sh
      - -c
      - echo $GATE_MARK > /data/marker; hostname > /data/hostname; env > /data/env.txt; exec sleep infinity
    environment:
      APP_SECRET: golden-not-a-secret
      GATE_MARK: gate-app
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - type: volume
        source: data
        target: /data
volumes:
  data: {}
