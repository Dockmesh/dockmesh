services:
  app:
    image: alpine:3.20
    command: ["sh", "-c", "echo $$GATE_MARK > /data/marker; hostname > /data/hostname; env > /data/env.txt; exec sleep infinity"]
    environment:
      GATE_MARK: gate-app
      APP_SECRET: ${APP_SECRET}
    volumes:
      - data:/data
    restart: unless-stopped
volumes:
  data: {}
