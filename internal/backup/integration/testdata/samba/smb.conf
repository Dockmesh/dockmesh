[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   map to guest = never
   server min protocol = SMB3
   server signing = mandatory
   ntlm auth = ntlmv2-only
   smb ports = 445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[backups]
   path = /data
   read only = no
   valid users = backup
   force user = backup
   force group = backup
   create mask = 0664
   directory mask = 0775
