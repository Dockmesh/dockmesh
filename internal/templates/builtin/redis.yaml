slug: redis-7
name: Redis 7
description: Redis 7 with AOF persistence and password auth, published on localhost by default.
icon_url: https://raw.githubusercontent.com/docker-library/docs/master/redis/logo.png
version: "1.1"
author: Dockmesh
parameters:
  - name: password
    description: Password clients send with AUTH. Auto-generated if blank; letters, digits, - and _ only, at least 12 characters.
    secret: true
    type: secret
    pattern: "^[A-Za-z0-9_-]{12,}$"
  - name: bind_address
    description: Host address the port is published on. 127.0.0.1 keeps Redis reachable from this host only; 0.0.0.0 publishes it on every interface, past any host firewall.
    default: "127.0.0.1"
    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
  - name: port
    default: "6379"
    pattern: "^[0-9]{2,5}$"
env: |
  REDIS_PASSWORD={{password|secret}}
compose: |
  services:
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      # The password is read from stdin, so it shows neither in the
      # container's command nor in the host's process list.
      command: ["sh", "-c", "printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" | exec redis-server - --appendonly yes"]
      environment:
        REDIS_PASSWORD: "${REDIS_PASSWORD}"
        REDISCLI_AUTH: "${REDIS_PASSWORD}"
      volumes:
        - redis_data:/data
      ports:
        - "{{bind_address|default:127.0.0.1}}:{{port|default:6379}}:6379"
      healthcheck:
        test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
        interval: 10s
        timeout: 3s
        retries: 5
  volumes:
    redis_data: {}
