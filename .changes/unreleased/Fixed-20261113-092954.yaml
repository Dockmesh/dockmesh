kind: Fixed
body: A deploy, rollback, scale, rolling update or image update no longer runs at the same time as another one on the same stack and collides on container names and replicas; the second one is refused with the operation that is running and since when, a git commit that arrives meanwhile is shown as a pending deploy and deployed as soon as the stack is free, also after a restart, and auto-scaling retries at its next check
