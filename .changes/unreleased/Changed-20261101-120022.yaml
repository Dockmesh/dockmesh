kind: Changed
body: Stacks, containers, templates, resources, topology and settings follow the new design. The containers list can be grouped by host or by stack, the container page shows CPU, memory, network and disk I/O history in charts with zoom and deploy markers, and CPU is shown as a share of all host cores. New templates list the placeholders found in the compose file so you can label them and set defaults. Settings are split into General, Updates and Encryption key.
time: 2026-11-01T12:00:22Z
