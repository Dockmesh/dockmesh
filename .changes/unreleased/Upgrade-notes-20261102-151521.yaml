kind: Upgrade notes
body: Existing OAuth2 and LDAP accounts move to their immutable id at their next sign-in within 30 days of the upgrade, as long as the login name or DN is still the one they were linked with; when that key isn't the new id (a GitHub `login`, a DN), the e-mail at the provider has to match the account too. Users renamed or moved before signing in again, and accounts not signed in within the 30 days, can't sign in through their provider any more and have to be recreated. The Authentication page and an admin notice list the accounts still waiting, with **End re-keying** to stop. Links left behind by providers deleted on earlier versions are removed.
