kind: Fixed
body: 'Restore, verify, download and retention of older backup runs no longer fail with an internal error after a target''s path, bucket, prefix, share or server is edited or a job is switched to another target: each run reads and deletes its archive where it was written. A run whose archive is missing says where it most likely is, and a target that still holds kept archives can''t be deleted'
