kind: Upgrade notes
body: "[agent-url-setting, admins] Without DOCKMESH_AGENT_PUBLIC_URL in dockmesh.env, install commands now use the agent URL from Settings, or the base URL's host on port 8443, and the agent certificate gets that name added on the first start. Existing names and IPs stay, so enrolled agents keep connecting."
