kind: Upgrade notes
body: Stacks already deployed from the PostgreSQL, MySQL or Vaultwarden template keep their secret in compose.yaml. To move it, add the value to the stack's .env, replace it in compose.yaml with ${VAR} and redeploy. Deploy history from before the upgrade still holds the old compose.yaml, so a rollback to it brings the secret back; change the password if that matters
