kind: Upgrade notes
body: Agents installed with --as-root keep running as root, also when the install command is run again, and the installer prints a notice; run the command again with --switch-to-service-user to move such an agent to the dockmesh-agent user. Scripts that pass --as-root for new hosts must drop the flag
