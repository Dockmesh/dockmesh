kind: Added
body: 'The container Files tab works on agent hosts too: browse, preview, download, edit and upload, plus deleting a file or symbolic link on every host. Uploads are limited to 8 MiB, previews and edits to 1 MiB, and /proc, /sys, /dev and device files can''t be opened. Agents older than the server ask to be updated.'
