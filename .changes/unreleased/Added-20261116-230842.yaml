kind: Added
body: 'Managed agents: the root updater can switch an agent to a new stacks directory (`stacks-dir-apply`). Root creates it only as one new directory directly in `/srv`, `/opt`, `/data`, `/mnt`, `/media` or a disk mounted below them; anywhere else an admin prepares an empty directory owned by the agent (`sudo install -d -o dockmesh-agent -g dockmesh-agent -m 0750 <dir>`). Root then rewrites `agent.env` and the unit and restarts the agent; `system install --stacks-dir` uses the same checks'
