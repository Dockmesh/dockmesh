kind: Security
body: 'Failed sign-ins, including attempts on a locked account, are written to the audit log and the audit webhook one by one only up to 10 per 15 minutes per client address and per username and 300 in total, with the rest summarised in one entry; sign-ins to a locked account now count towards the per-address sign-in limit, which other sign-ins from that address share'
