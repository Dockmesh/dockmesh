kind: Added
body: Image updates, backup runs, restores and new proxy sites show their real steps and a live log while they run. A running-operations indicator in the top bar lists running and recently finished work and opens its progress from any page; a toast says when your own work finishes, and a failure shows the step it failed at with its last log lines. Operations are kept for 7 days and listed under `GET /api/v1/operations` (live on `/ws/events`); credentials are masked before anything is stored or shown, and you only see operations on hosts and stacks in your scope. Work still running when the server stops is marked failed on the next start.
time: 2026-11-01T12:00:00Z
