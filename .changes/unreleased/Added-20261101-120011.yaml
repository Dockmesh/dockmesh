kind: Added
body: '`POST /api/v1/proxy/import` reads a Caddyfile and creates its sites as disabled proxy routes with the matching options. Directives without a matching option are listed per site instead of being dropped, and `dry_run` shows the result without creating anything. Snippets defined in the same file can be imported; imports of files can''t.'
