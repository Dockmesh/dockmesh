body: 'Agents: `DOCKMESH_STACKS_DIR` in `agent.env` sets where an agent keeps its stacks (default `<data dir>/stacks`); stacks already in an earlier directory stay there and stay writable while it holds stacks, and the host page shows each directory with its number of stacks'
