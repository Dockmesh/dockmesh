kind: Fixed
body: A stack being migrated or rolled back can no longer be deployed, deleted or git auto-deployed (409 migration_active), and an earlier migration of it can't be rolled back or finalised meanwhile; a migration doesn't start while a deploy or update holds the stack, and its rollback waits for one to finish before it stops or restarts the stack
