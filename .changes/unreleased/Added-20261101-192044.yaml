kind: Added
body: 'The backup job wizard picks the host: volume jobs choose a host and then one of its volumes, stack jobs run on the host the stack is deployed on (undeployed stacks can''t be backed up), and the wizard only offers hosts where you may manage backups (`GET /api/v1/backups/hosts`). Saving a job with a new host or source checks that the host, volume or stack deployment exists. Existing jobs keep their host.'
