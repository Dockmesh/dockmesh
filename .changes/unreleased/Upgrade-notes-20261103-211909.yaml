kind: Upgrade notes
body: '[plaintext-snapshot, admins] The first start removes pre-upgrade database copies (dockmesh.db.pre-migrate-*.bak) that hold plaintext secrets, from v0.4.x upgrades included, once the checks after the upgrade pass. Rolling back to v0.4.x is then only possible from a system backup. If a check fails, the copy is kept and a notice says why; delete it once Dockmesh works. Without secrets encryption nothing is removed'
