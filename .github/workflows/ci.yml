name: ci

# ci-ok is the only required check. On pull requests the jobs of areas the
# PR doesn't touch are skipped; pushes to main or a release/X.Y.x branch and
# merge-queue runs test everything. Label changes re-run the workflow so
# no-changelog takes effect. The native macOS smoke runs only on those pushes
# and on demand: macOS runners queue for a long time and must not hold up PRs
# or the merge queue.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, 'release/*.x']
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # The PR files API lists at most 3000 files; larger PRs run everything.
    outputs:
      go: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.web == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.docs == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.scripts == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.deps == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            go:
              - *ci
              - '**/*.go'
              - go.mod
              - go.sum
              - go.work
              - go.work.sum
              - .golangci.yml
              - Makefile
              - api/openapi/**
              - internal/**
              - cmd/**
              - pkg/**
              - CHANGELOG.md
            web:
              - *ci
              - web/**
            docs:
              - *ci
              - docs/**
            scripts:
              - *ci
              - scripts/**
            deps:
              - *ci
              - go.mod
              - go.sum
              - go.work
              - go.work.sum
              - web/package.json
              - web/package-lock.json

  # The quick checks share one runner, one step each. Every step runs even
  # when an earlier one failed, so one run reports all of them.
  checks:
    name: checks
    needs: changes
    runs-on: ubuntu-24.04
    env:
      GO_CHANGED: ${{ needs.changes.outputs.go }}
      DEPS_CHANGED: ${{ needs.changes.outputs.deps }}
      DOCS_SCRIPTS: ${{ needs.changes.outputs.go != 'true' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.scripts == 'true') }}
      # AGPL-3.0 compatible SPDX identifiers. OFL-1.1 covers the bundled
      # web fonts only (data, not linked code).
      ALLOWED: MIT;MIT-0;BSD-2-Clause;BSD-3-Clause;Apache-2.0;ISC;MPL-2.0;0BSD;Unlicense;CC0-1.0;BlueOak-1.0.0;Python-2.0;OFL-1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: env.DEPS_CHANGED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: fetch the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: changelog fragments
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPTIONAL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          # An empty base file means the base branch has no changelog yet.
          git show "$BASE_SHA:CHANGELOG.md" > "$RUNNER_TEMP/base-CHANGELOG.md" 2>/dev/null || true
          git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- .changes/unreleased/ > "$RUNNER_TEMP/changed.txt"
          go run ./scripts/relmanifest check -base "$RUNNER_TEMP/base-CHANGELOG.md" \
            -changed "$RUNNER_TEMP/changed.txt" -optional="$OPTIONAL"
      - name: CHANGELOG.md matches .changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          go run github.com/miniscruff/changie@v1.26.0 merge --dry-run > "$RUNNER_TEMP/CHANGELOG.md"
          diff -u CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md" || {
            echo "::error::CHANGELOG.md is generated; edit .changes/ and run changie merge"
            exit 1
          }

      - name: merged migrations are unchanged, new ones are timestamped
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          dir=internal/db/migrations/
          # Installs record a migration by file name: a renamed one runs again.
          changed=$(git diff --no-renames --name-only --diff-filter=DMT "$BASE_SHA" HEAD -- "$dir")
          if [ -n "$changed" ]; then
            echo "::error::merged migrations must not be edited, renamed or removed:"; echo "$changed"; exit 1
          fi
          bad=$(git diff --no-renames --name-only --diff-filter=A "$BASE_SHA" HEAD -- "$dir" |
            grep -Ev "^${dir}[0-9]{14}_[a-z0-9_]+\.sql$" || true)
          if [ -n "$bad" ]; then
            echo "::error::new migrations are named YYYYMMDDHHMMSS_<slug>.sql (make migration name=<slug>):"; echo "$bad"; exit 1
          fi

      # Only vulnerabilities our code actually calls count. Those with a fixed
      # version fail the step; those without one are reported as notices.
      - name: govulncheck
        if: ${{ !cancelled() && env.GO_CHANGED == 'true' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -format json ./... > "$RUNNER_TEMP/vuln.json"
          jq -r 'select(.finding) | .finding | select(.trace[0].function)
                 | [.osv, (.fixed_version // "")] | @tsv' "$RUNNER_TEMP/vuln.json" | sort -u > "$RUNNER_TEMP/called.tsv"
          while IFS=$'\t' read -r id fixed; do
            if [ -z "$fixed" ]; then
              echo "::notice::$id is reachable but has no fix yet: https://pkg.go.dev/vuln/$id"
            else
              echo "::error::$id is reachable, fixed in $fixed: https://pkg.go.dev/vuln/$id"
            fi
          done < "$RUNNER_TEMP/called.tsv"
          ! awk -F'\t' '$2 != "" { found = 1 } END { exit !found }' "$RUNNER_TEMP/called.tsv"

      # LGPL-3.0 is GPLv3 plus permissions, so it combines with AGPL-3.0;
      # github.com/cloudsoda/sddl (pulled in by the SMB client) uses it.
      - name: licenses of Go dependencies
        if: ${{ !cancelled() && env.DEPS_CHANGED == 'true' }}
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./cmd/dockmesh ./cmd/dockmesh-agent ./cmd/dmctl \
            --ignore github.com/dockmesh/dockmesh \
            --allowed_licenses="${ALLOWED//;/,},LGPL-3.0"
      - name: licenses of npm production dependencies
        if: ${{ !cancelled() && env.DEPS_CHANGED == 'true' }}
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx --yes license-checker-rseidelsohn@4.4.2 --production \
            --excludePrivatePackages --onlyAllow "$ALLOWED" --summary

      # docs/site is checked by a Go test, the install scripts by Go tests next
      # to them; when Go code changed, go test runs both.
      - name: docs and scripts
        if: ${{ !cancelled() && env.DOCS_SCRIPTS == 'true' }}
        run: go test -race ./scripts/...

  go-test:
    name: go test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The handlers package takes most of the test time and is split by
          # test name; the other packages run as two groups.
          - {name: handlers 1/2, shard: 1}
          - {name: handlers 2/2, shard: 2}
          - {name: heavy, group: heavy}
          - {name: rest, group: rest}
    env:
      HANDLERS: github.com/dockmesh/dockmesh/internal/api/handlers
      HEAVY: >-
        github.com/dockmesh/dockmesh/internal/alerts
        github.com/dockmesh/dockmesh/internal/backup
        github.com/dockmesh/dockmesh/internal/db
        github.com/dockmesh/dockmesh/internal/proxy
        github.com/dockmesh/dockmesh/internal/agents
        github.com/dockmesh/dockmesh/internal/saml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: handlers shard
        if: matrix.shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          go test -race -c -o "$RUNNER_TEMP/handlers.test" ./internal/api/handlers/
          cd internal/api/handlers
          "$RUNNER_TEMP/handlers.test" -test.list '.*' | grep -E '^(Test|Example|Fuzz)' > "$RUNNER_TEMP/all.txt"
          awk -v s="$SHARD" 'NR % 2 == s % 2' "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/mine.txt"
          echo "$(wc -l < "$RUNNER_TEMP/mine.txt") of $(wc -l < "$RUNNER_TEMP/all.txt") tests"
          "$RUNNER_TEMP/handlers.test" -test.timeout 15m -test.run "^($(paste -sd'|' "$RUNNER_TEMP/mine.txt"))\$"
      - name: package group
        if: matrix.group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          go list ./... > "$RUNNER_TEMP/pkgs.txt"
          if [ "$GROUP" = heavy ]; then
            pkgs=$HEAVY
          else
            pkgs=$(grep -vxF -e "$HANDLERS" $(printf -- '-e %s ' $HEAVY) "$RUNNER_TEMP/pkgs.txt")
          fi
          go test -race $pkgs

  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Real SMB, SFTP, WebDAV and S3 servers; the script prints the
      # DM_IT_* variables the tests read.
      - name: start backup targets
        run: internal/backup/integration/testdata/up.sh >> "$GITHUB_ENV"
      - name: backup targets
        run: go test -tags integration -count=1 -v ./internal/backup/integration/
      - name: jobs from saved targets
        run: go test -tags integration -count=1 -v -run AgainstRealServers ./internal/api/handlers/

  # The proxy's Caddy config against a real Caddy of the version the proxy
  # container runs. A download or checksum problem fails its own step.
  caddy:
    name: caddy
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CADDY_VERSION: 2.11.7
      CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: caddy version matches the proxy image
        run: |
          grep -q "DefaultProxyImage = \"caddy:${CADDY_VERSION}@" internal/proxy/container.go || {
            echo "::error::CADDY_VERSION ${CADDY_VERSION} differs from DefaultProxyImage in internal/proxy/container.go"
            exit 1
          }
      - name: download caddy
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          "$RUNNER_TEMP/caddy" version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: proxy config against caddy
        run: |
          start=$(date +%s)
          DOCKMESH_TEST_CADDY="$RUNNER_TEMP/caddy" go test -count=1 -v -run AgainstCaddy ./internal/proxy/
          echo "caddy tests took $(( $(date +%s) - start ))s"

  # golangci-lint's govet covers go vet.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Built with the job's toolchain, as prebuilt binaries can lag go.mod.
      # Only issues added since the branch left main count; only-new-issues
      # reads the PR patch, which GitHub does not serve past 20 000 lines.
      # The push that creates a branch has no before commit; its code is
      # already linted where it came from.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --new-from-merge-base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.created && github.sha || github.event.before }}

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:unit
      - run: npm run build

  build:
    name: build linux/amd64
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check Go toolchain
        run: |
          want=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          got=$(go env GOVERSION)
          echo "building with $got, go.mod toolchain $want"
          [ "$got" = "$want" ]
      - name: build frontend
        run: &frontend |
          cd web
          npm ci
          npm run build
          mkdir -p ../cmd/dockmesh/web_dist
          cp -r build/* ../cmd/dockmesh/web_dist/
      - name: build binaries
        env:
          TARGETS: linux/amd64
        run: &binaries |
          VERSION="ci-${GITHUB_SHA::7}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/dockmesh/dockmesh/pkg/version.Version=${VERSION} \
                   -X github.com/dockmesh/dockmesh/pkg/version.Commit=${COMMIT} \
                   -X github.com/dockmesh/dockmesh/pkg/version.Date=${DATE}"
          for target in $TARGETS; do
            echo "::group::$target"
            out="dist/${target/\//-}"
            mkdir -p "$out"
            for cmd in dockmesh dockmesh-agent dmctl; do
              CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
                go build -trimpath -ldflags "$LDFLAGS" -o "$out/$cmd" "./cmd/$cmd"
            done
            echo "::endgroup::"
          done
      - name: smoke test
        run: |
          ./dist/linux-amd64/dockmesh version
          ./dist/linux-amd64/dockmesh-agent --version
          ./dist/linux-amd64/dmctl --version

  # One runner cross-compiles the other targets in turn, so the frontend is
  # built once and the targets share the Go build cache. The linux/arm64
  # binaries are smoke-tested under qemu.
  build-cross:
    name: build darwin/amd64, darwin/arm64, linux/arm64
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build frontend
        run: *frontend
      - name: build binaries
        env:
          TARGETS: darwin/amd64 darwin/arm64 linux/arm64
        run: *binaries
      - name: smoke test linux/arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user-static
          qemu-aarch64-static ./dist/linux-arm64/dockmesh version
          qemu-aarch64-static ./dist/linux-arm64/dockmesh-agent --version
          qemu-aarch64-static ./dist/linux-arm64/dmctl --version

  smoke-macos:
    name: smoke darwin/arm64
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -o dist/dockmesh       ./cmd/dockmesh
          go build -trimpath -o dist/dockmesh-agent ./cmd/dockmesh-agent
          go build -trimpath -o dist/dmctl          ./cmd/dmctl
      - name: smoke test
        run: |
          ./dist/dockmesh version
          ./dist/dockmesh-agent --version
          ./dist/dmctl --version

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: |
          cd web
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          mkdir -p ../cmd/dockmesh/web_dist
          cp -r build/* ../cmd/dockmesh/web_dist/
          cd ..
          CGO_ENABLED=0 go build -trimpath -o dockmesh ./cmd/dockmesh
      - name: playwright (en + de) against a throwaway instance
        run: web/tests/run-ephemeral.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, go-test, integration, caddy, lint, web, build, build-cross, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
