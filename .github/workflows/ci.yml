name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Real SMB, SFTP, WebDAV and S3 servers; the script prints the
      # DM_IT_* variables the tests read.
      - name: start backup targets
        run: internal/backup/integration/testdata/up.sh >> "$GITHUB_ENV"
      - name: backup targets
        run: go test -tags integration -count=1 -v ./internal/backup/integration/
      - name: jobs from saved targets
        run: go test -tags integration -count=1 -v -run AgainstRealServers ./internal/api/handlers/

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Built with the job's toolchain, as prebuilt binaries can lag go.mod.
      # Only issues added since the branch left main count; only-new-issues
      # reads the PR patch, which GitHub does not serve past 20 000 lines.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --new-from-merge-base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Only vulnerabilities our code actually calls count. Those with a fixed
      # version fail the job; those without one are reported as notices.
      - name: scan
        run: |
          govulncheck -format json ./... > vuln.json
          jq -r 'select(.finding) | .finding | select(.trace[0].function)
                 | [.osv, (.fixed_version // "")] | @tsv' vuln.json | sort -u > called.tsv
          while IFS=$'\t' read -r id fixed; do
            if [ -z "$fixed" ]; then
              echo "::notice::$id is reachable but has no fix yet: https://pkg.go.dev/vuln/$id"
            else
              echo "::error::$id is reachable, fixed in $fixed: https://pkg.go.dev/vuln/$id"
            fi
          done < called.tsv
          ! awk -F'\t' '$2 != "" { found = 1 } END { exit !found }' called.tsv

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:unit
      - run: npm run build

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,  goarch: amd64, runner: ubuntu-latest,    smoke: true}
          - {goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm, smoke: true}
          - {goos: darwin, goarch: arm64, runner: macos-latest,     smoke: true}
          - {goos: darwin, goarch: amd64, runner: ubuntu-latest,    smoke: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check Go toolchain
        run: |
          want=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          got=$(go env GOVERSION)
          echo "building with $got, go.mod toolchain $want"
          [ "$got" = "$want" ]
      - name: build frontend
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../cmd/dockmesh/web_dist
          cp -r build/* ../cmd/dockmesh/web_dist/
      - name: build binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="ci-${GITHUB_SHA::7}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/dockmesh/dockmesh/pkg/version.Version=${VERSION} \
                   -X github.com/dockmesh/dockmesh/pkg/version.Commit=${COMMIT} \
                   -X github.com/dockmesh/dockmesh/pkg/version.Date=${DATE}"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o dist/dockmesh       ./cmd/dockmesh
          go build -trimpath -ldflags "$LDFLAGS" -o dist/dockmesh-agent ./cmd/dockmesh-agent
          go build -trimpath -ldflags "$LDFLAGS" -o dist/dmctl          ./cmd/dmctl
      - name: smoke test
        if: matrix.smoke
        run: |
          ./dist/dockmesh version
          ./dist/dockmesh-agent --version
          ./dist/dmctl --version

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    env:
      # AGPL-3.0 compatible SPDX identifiers. OFL-1.1 covers the bundled
      # web fonts only (data, not linked code).
      ALLOWED: MIT;MIT-0;BSD-2-Clause;BSD-3-Clause;Apache-2.0;ISC;MPL-2.0;0BSD;Unlicense;CC0-1.0;BlueOak-1.0.0;Python-2.0;OFL-1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # LGPL-3.0 is GPLv3 plus permissions, so it combines with AGPL-3.0;
      # github.com/cloudsoda/sddl (pulled in by the SMB client) uses it.
      - name: go dependencies
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./cmd/dockmesh ./cmd/dockmesh-agent ./cmd/dmctl \
            --ignore github.com/dockmesh/dockmesh \
            --allowed_licenses="${ALLOWED//;/,},LGPL-3.0"
      - name: npm production dependencies
        run: |
          cd web
          npm ci
          npx --yes license-checker-rseidelsohn@4.4.2 --production \
            --excludePrivatePackages --onlyAllow "$ALLOWED" --summary
