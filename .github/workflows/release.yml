# Build + publish release tarballs when a v* tag is pushed.
#
# Triggers
#   - tag push: vX.Y.Z (release) or vX.Y.Z-rc.N (release candidate)
#   - manual: workflow_dispatch with a tag input (re-run a failed release
#     without re-tagging)
#
# Outputs (attached to the GitHub Release)
#   dockmesh_linux_amd64.tar.gz    — server + agent + dmctl binaries
#   dockmesh_linux_arm64.tar.gz    — same, ARM64
#   dockmesh_darwin_amd64.tar.gz   — macOS Intel
#   dockmesh_darwin_arm64.tar.gz   — macOS Apple Silicon (M1/M2/M3…)
#   install.sh, uninstall.sh       — served by get.dockmesh.dev from
#                                    releases/latest/download/
#   release-manifest.json          — machine-readable severity, changes,
#                                    advisories and upgrade actions
#   checksums.txt                  — SHA-256 of every tarball, script and
#                                    the manifest (BSD-style so
#                                    `shasum -a 256 -c` also works)
#
# Release notes and the manifest come from the tag's section in
# CHANGELOG.md; the release fails before building if that section is
# missing. A release candidate has no section yet: its notes come from
# the unreleased fragments in .changes/.
#
# Tags come from main or, for patches of an older minor, from its
# release/X.Y.x branch. Only the highest stable version becomes GitHub's
# latest release and moves the website; get.dockmesh.dev, install.sh and
# the in-app update check all follow latest. A release candidate is
# published as a GitHub pre-release with the same assets, is never latest
# and leaves the website and the get.dockmesh.dev cache alone; only
# installs on the pre-release update channel or an explicit
# `install.sh --version vX.Y.Z-rc.N` pick it up.
#
# The install.sh served from get.dockmesh.dev expects the asset names
# exactly as above — don't rename without updating the installer.
#
# Windows server binaries are NOT shipped yet — dmctl for Windows is
# built by the Makefile but distributed via a separate channel.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3 or v1.3.0-rc.1)'
        required: true

# One release at a time: the latest decision reads the published releases
# and must not race another run that is about to publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notes:
    name: release notes
    runs-on: ubuntu-24.04
    # Later jobs check out this exact commit, so a branch named like the tag
    # or a moved tag can't change what gets built.
    outputs:
      sha: ${{ steps.line.outputs.sha }}
      version: ${{ steps.line.outputs.version }}
      prerelease: ${{ steps.line.outputs.prerelease }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          persist-credentials: false

      # Once release/X.Y.x exists, main has moved on to the next minor, so a
      # vX.Y.N tag must come from that branch.
      - name: tag is on its release line
        id: line
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$VERSION" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          printf '%s' "$VERSION" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$' ||
            { echo "::error::$VERSION is not a vX.Y.Z or vX.Y.Z-rc.N tag"; exit 1; }
          line=$(printf '%s' "$VERSION" | sed -nE 's/^v([0-9]+\.[0-9]+)\..*/\1/p')
          git fetch --no-tags --unshallow origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*.x:refs/remotes/origin/release/*.x' \
            "+refs/tags/$VERSION:refs/tags/$VERSION"
          sha=$(git rev-parse --verify "refs/tags/$VERSION^{commit}")
          [ "$(git rev-parse HEAD)" = "$sha" ] || { echo "::error::checkout is not $VERSION"; exit 1; }
          branch=main
          if git rev-parse -q --verify "refs/remotes/origin/release/$line.x" > /dev/null; then
            branch="release/$line.x"
          fi
          git merge-base --is-ancestor "$sha" "origin/$branch" || {
            echo "::error::$VERSION ($sha) is not on $branch"
            exit 1
          }
          echo "$VERSION ($sha) is on $branch"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: render notes + manifest
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          go run ./scripts/relmanifest release -version "$VERSION" \
            -notes release-notes.md -body release-body.md -manifest release-manifest.json
          cat release-body.md release-manifest.json

      - name: upload notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            release-notes.md
            release-body.md
            release-manifest.json

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: notes
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notes.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: set VERSION
        id: v
        env:
          VERSION: ${{ needs.notes.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: setup Node (for SvelteKit build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: check Go toolchain
        run: |
          want=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          got=$(go env GOVERSION)
          echo "building with $got, go.mod toolchain $want"
          [ "$got" = "$want" ]

      - name: build frontend
        run: |
          cd web
          npm ci
          npm run build
          # main Dockmesh Makefile expects the build dir embed target
          mkdir -p ../cmd/dockmesh/web_dist
          cp -r build/* ../cmd/dockmesh/web_dist/

      - name: build binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/dockmesh/dockmesh/pkg/version.Version=${VERSION} \
                   -X github.com/dockmesh/dockmesh/pkg/version.Commit=${COMMIT} \
                   -X github.com/dockmesh/dockmesh/pkg/version.Date=${DATE}"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o dist/dockmesh        ./cmd/dockmesh
          if [ "$GOOS" = linux ]; then
            # Both linux agents ship in every linux tarball so a server can enroll hosts of either architecture.
            for a in amd64 arm64; do
              GOARCH=$a go build -trimpath -ldflags "$LDFLAGS" -o "dist/dockmesh-agent-linux-$a" ./cmd/dockmesh-agent
            done
          else
            go build -trimpath -ldflags "$LDFLAGS" -o dist/dockmesh-agent ./cmd/dockmesh-agent
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o dist/dmctl           ./cmd/dmctl

      - name: package tarball
        run: |
          TARBALL="dockmesh_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          cd dist
          cp ../LICENSE .
          cp ../README.md .
          cp ../scripts/install-agent.sh .
          AGENTS="dockmesh-agent"
          [ "${{ matrix.goos }}" = linux ] && AGENTS="dockmesh-agent-linux-amd64 dockmesh-agent-linux-arm64"
          tar -czf "../$TARBALL" dockmesh $AGENTS dmctl LICENSE README.md install-agent.sh
          cd ..
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

      - name: upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockmesh_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dockmesh_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dockmesh_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

  release:
    name: publish release
    needs: [notes, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release and attach assets
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notes.outputs.sha }}
          persist-credentials: false

      - name: set VERSION
        id: v
        env:
          VERSION: ${{ needs.notes.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: assemble release dir
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec mv {} release/ \;
          cp scripts/install.sh scripts/uninstall.sh release/
          cp artifacts/release-notes/release-manifest.json release/
          # Combined checksums.txt — one sha256 line per asset.
          cd release
          sha256sum *.tar.gz install.sh uninstall.sh release-manifest.json > checksums.txt
          cat checksums.txt

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: decide latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft | not) | .tag_name' > "$RUNNER_TEMP/published.txt"
          latest=$(go run ./scripts/relmanifest latest -version "$VERSION" -published "$RUNNER_TEMP/published.txt")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: Dockmesh ${{ steps.v.outputs.version }}
          draft: false
          prerelease: ${{ needs.notes.outputs.prerelease }}
          make_latest: ${{ steps.latest.outputs.latest }}
          body_path: artifacts/release-notes/release-body.md
          files: |
            release/*.tar.gz
            release/install.sh
            release/uninstall.sh
            release/release-manifest.json
            release/checksums.txt

      # Drop Cloudflare's edge cache for the install / uninstall scripts
      # so users running `curl get.dockmesh.dev | bash` immediately after
      # a release pick up the new install.sh — without this the worker
      # holds the previous copy for up to 5 minutes (TTL on the route),
      # which already bit us once when an env-file change shipped in a
      # tag but the cached install.sh still wrote the old layout.
      - name: purge get.dockmesh.dev cache
        if: success() && needs.notes.outputs.prerelease == 'false' && steps.latest.outputs.latest == 'true' && env.CF_API_TOKEN != '' && env.CF_ZONE_ID != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://get.dockmesh.dev/",
              "https://get.dockmesh.dev/install.sh",
              "https://get.dockmesh.dev/uninstall",
              "https://get.dockmesh.dev/uninstall.sh"
            ]}'

      # The release is out at this point; a missing token or a failed call
      # only leaves the website behind, so it warns instead of failing.
      - name: trigger website sync
        if: always() && steps.publish.outcome == 'success' && needs.notes.outputs.prerelease == 'false' && steps.latest.outputs.latest == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          TAG: ${{ steps.v.outputs.version }}
        run: |
          if [ -n "$GH_TOKEN" ] && gh api repos/Dockmesh/website/dispatches \
               -f event_type=app-release -f "client_payload[tag]=$TAG"; then
            echo "website sync triggered for $TAG"
          else
            echo "::warning::website sync not triggered; run: gh workflow run release-sync.yml -R Dockmesh/website -f tag=$TAG"
          fi
