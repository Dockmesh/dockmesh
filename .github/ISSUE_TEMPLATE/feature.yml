name: Feature request
description: Suggest something Dockmesh should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing feature requests](https://github.com/Dockmesh/dockmesh/issues?q=is%3Aissue+label%3Aenhancement) first.
        If yours is already there, give it a 👍 instead of opening a duplicate; we sort by them.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Dockmesh to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Workarounds, or other tools that already do this.
