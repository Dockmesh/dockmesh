version: 2
updates:
  # Setting labels replaces Dependabot's defaults, so they are listed again
  # next to no-changelog (which skips the changelog check).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, go, no-changelog]
    groups:
      go-modules:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    labels: [dependencies, javascript, no-changelog]
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github_actions, no-changelog]
    groups:
      github-actions:
        patterns: ['*']
