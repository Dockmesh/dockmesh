version: 2
updates:
  # no-changelog skips the changelog check.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, no-changelog]
    groups:
      go-modules:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    labels: [dependencies, no-changelog]
    # svelte-check 4 accepts TypeScript 5 and 6 only.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, no-changelog]
    groups:
      github-actions:
        patterns: ['*']
