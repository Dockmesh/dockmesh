# Changelog fragments: https://changie.dev. CHANGELOG.md is generated from
# .changes/ with `changie merge`; see RELEASING.md for cutting a release.
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
envPrefix: CHANGIE_
fragmentFileFormat: '{{ replace " " "-" .Kind }}-{{.Time.Format "20060102-150405"}}'
# CHANGIE_SEVERITY is security, recommended or normal.
versionFormat: '## [{{.VersionNoPrefix}}] - {{.Time.Format "2006-01-02"}} [{{.Env.SEVERITY}}]'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
newlines:
  afterChangelogHeader: 1
  afterChangelogVersion: 1
  beforeHeaderFile: 1
  beforeKind: 1
  afterKind: 1
kinds:
  - label: Highlights
  - label: Added
  - label: Changed
  - label: Fixed
  - label: Security
  # The id names the note in release-manifest.json and stays fixed; it is
  # kept in an HTML comment so rendered markdown doesn't show it.
  - label: Upgrade notes
    changeFormat: '- {{if eq .Custom.Audience "admins"}}**Admins:** {{end}}{{.Body}} <!-- {{.Custom.Id}} -->'
    additionalChoices:
      - key: Id
        label: Id (short kebab-case name, e.g. re-login)
        type: string
        minLength: 1
      - key: Audience
        label: Who has to act
        type: enum
        enumOptions: [all, admins]
